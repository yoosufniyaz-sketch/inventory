<style>
:root{
  --ink:#101826;--paper:#eef0ee;--surface:#ffffff;--surface-2:#f6f7f6;
  --line:#dde1e4;--line-strong:#c3c9d0;--steel:#56637a;--steel-soft:#8b96a8;
  --accent:#14406b;--accent-strong:#0d2f4e;--accent-soft:#e6ecf1;--on-accent:#ffffff;
  --good:#2f8f5b;--good-soft:#e6f4ec;--warn:#a9760a;--warn-soft:#fbf1dd;--critical:#b3261e;--critical-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(16,24,38,.06),0 4px 14px rgba(16,24,38,.06);
  --petrol:#2a78d6;--diesel:#eb6834;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef1f5;--paper:#0e131a;--surface:#161d27;--surface-2:#1b2330;
  --line:#263142;--line-strong:#344256;--steel:#a3adbd;--steel-soft:#77839a;
  --accent:#7fb0e0;--accent-strong:#a9cbef;--accent-soft:#1c2c40;--on-accent:#0b1522;
  --good:#5cc08a;--good-soft:#16301f;--warn:#e0ac3c;--warn-soft:#33280f;--critical:#f07a70;--critical-soft:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --petrol:#3987e5;--diesel:#d95926;
}}
:root[data-theme="dark"]{
  --ink:#eef1f5;--paper:#0e131a;--surface:#161d27;--surface-2:#1b2330;
  --line:#263142;--line-strong:#344256;--steel:#a3adbd;--steel-soft:#77839a;
  --accent:#7fb0e0;--accent-strong:#a9cbef;--accent-soft:#1c2c40;--on-accent:#0b1522;
  --good:#5cc08a;--good-soft:#16301f;--warn:#e0ac3c;--warn-soft:#33280f;--critical:#f07a70;--critical-soft:#3a1a18;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
.mono{font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.brand{padding:0 8px 22px}
.brand .mark{font-family:"Oswald",system-ui,sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;color:var(--accent-strong);letter-spacing:.03em;line-height:1.1}
.brand .sub{font-size:11px;text-transform:uppercase;color:var(--steel);letter-spacing:.12em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--steel);padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-strong)}

.nav .badge{margin-left:auto}
.badge.warn{background:var(--warn)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:12px;color:var(--steel);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--steel-soft);display:inline-block;flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--critical)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-align:left;font-size:12px}

/* Main */
main{min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

<script>
"use strict";
/* ================= CONFIG ================= */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCj0m27rYwINI2ZO1APNgu3-8Lu1liol_o",
  authDomain: "fdc-vehicle-management.firebaseapp.com",
  projectId: "fdc-vehicle-management",
  storageBucket: "fdc-vehicle-management.firebasestorage.app",
  messagingSenderId: "681628225367",
  appId: "1:681628225367:web:b4cdc4866bd08a31487812"
};
var COLS = ["vehicles","fuel_records","service_records","fuel_requisitions","users"];
var VEHICLE_TYPES = ["Motorcycle","Car","Doublecab","Pick Up","Van","Speed Boat"];
var FUEL_TYPES = ["Petrol","Diesel"];
var STATUSES = ["Active","In service","Inactive"];
var SERVICE_TYPES = ["General service","Oil change","Tyre change","Battery replacement","Brake service","Engine service","Hull / outboard service","Other"];
var INCIDENT_STATUS = ["Open","In progress","Resolved"];
var STATUTORY = [
  {key:"annualFee", label:"Annual Fee"},
  {key:"insurance", label:"Insurance"},
  {key:"roadworthiness", label:"Roadworthiness"}
];
var DURATIONS = [["","Custom"],["6","6 months"],["12","1 year"],["24","2 years"],["36","3 years"]];

/* ================= SETTINGS (per browser) ================= */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var settings = Object.assign({remindDays:30, spBase:"", currency:"Rf"}, lsGet("fdc_settings",{}));
/* Optional: only allow sign-up with these email domains, e.g. ["fdc.mv"]. Empty = any email.
   (Also enforce this in your Firestore security rules — see notes.) */
var ALLOWED_EMAIL_DOMAINS = [];
/* Owners are always admins and their role can't be changed in the app.
   Keep this list in sync with the Firestore security rules. */
var OWNER_EMAILS = ["yoosuf.niyaz@fdc.mv"];
function isOwnerEmail(e){return OWNER_EMAILS.indexOf(String(e||"").toLowerCase())>=0;}
function myProfile(){return currentUser?Store.data.users.find(function(u){return u.id===currentUser.uid;}):null;}
function isAdmin(){if(!currentUser)return false;if(isOwnerEmail(currentUser.email))return true;var p=myProfile();return !!p&&p.role==="admin";}
function roleOf(u){return isOwnerEmail(u.email)?"owner":(u.role==="admin"?"admin":"member");}
var ADMIN_ACTS=["newReqLike","addVehicle","addFuel","addReq","addReqForVeh","addReqFromFuel","addPeriodic","addIncident","delVehicle","delFuel","delReq","delService","setRole","editVehicle","editFuel","editReq","editService","renew","clearImg"];
var currentUser = null;
var userName = "";

/* ================= STORE ================= */
var Store = {
  mode:"local", db:null,
  data:{vehicles:[],fuel_records:[],service_records:[],fuel_requisitions:[],users:[]},
  unsubs:[],
  /* Start live listeners — called only after a successful email/password sign-in */
  start: function(){
    this.stop();
    this.db = this.db || firebase.firestore();
    this.mode = "cloud";
    var self=this;
    setSync("warn","Loading data…");
    COLS.forEach(function(c){
      self.unsubs.push(self.db.collection(c).onSnapshot(function(snap){
        self.data[c] = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());});
        setSync("good","Synced to cloud");
        render();
      }, function(err){
        console.error(err);
        setSync("crit", err.code==="permission-denied" ? "No database access — check Firestore rules" : "Database error ("+(err.code||err.message)+")");
      }));
    });
  },
  stop: function(){
    this.unsubs.forEach(function(u){try{u();}catch(e){}});
    this.unsubs=[];
    this.data={vehicles:[],fuel_records:[],service_records:[],fuel_requisitions:[],users:[]};
  },
  save: async function(col,obj){
    obj = Object.assign({}, obj); var id = obj.id; delete obj.id;
    obj.updatedAt = Date.now(); obj.updatedBy = userName||"";
    if(!id){ obj.createdAt = Date.now(); obj.createdBy = userName||""; }
    if(this.mode==="cloud"){
      if(id) await this.db.collection(col).doc(id).set(obj,{merge:true});
      else { var ref = await this.db.collection(col).add(obj); id = ref.id; }
    } else {
      var list = this.data[col];
      if(id){ var i=list.findIndex(function(x){return x.id===id;}); list[i]=Object.assign({},list[i],obj,{id:id}); }
      else { id = "L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); list.push(Object.assign({id:id},obj)); }
      lsSet("fdc_local_"+col, list); render();
    }
    return id;
  },
  remove: async function(col,id){
    if(this.mode==="cloud") await this.db.collection(col).doc(id).delete();
    else { this.data[col]=this.data[col].filter(function(x){return x.id!==id;}); lsSet("fdc_local_"+col,this.data[col]); render(); }
  }
};

/* ================= HELPERS ================= */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function money(v){return settings.currency+" "+num(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(v){return settings.currency+" "+Math.round(num(v)).toLocaleString("en-US");}
function todayISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function daysUntil(iso){var t=new Date();t.setHours(0,0,0,0);return Math.round((parseISO(iso)-t)/864e5);}
function fmtDate(iso){if(!iso)return "—";var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+"/"+m[2]+"/"+m[1]:"—";}
/* Date fields: typed and shown as dd/mm/yyyy, stored as yyyy-mm-dd.
   A hidden native date input supplies the calendar pop-up. */
function dateField(name,val,extra,attrs){
  val=val||"";
  return '<span class="dpick"><input type="text" class="dtext" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="dd/mm/yyyy" value="'+esc(fmtDate(val)==="—"?"":fmtDate(val))+'"'+(attrs||"")+'>'+
    '<input type="hidden" data-date'+(name?' name="'+name+'"':"")+' value="'+esc(val)+'"'+(extra||"")+'>'+
    '<span class="dicon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg></span>'+
    '<input type="date" class="dnative" tabindex="-1" aria-label="Open calendar" value="'+esc(val)+'"></span>';
}
function dmyToISO(t){
  var m=String(t||"").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if(!m) return null;
  var d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function setDateVal(hidden,iso,silent){
  var w=hidden.closest(".dpick"); hidden.value=iso||"";
  if(w){w.querySelector(".dtext").value=iso?fmtDate(iso):"";w.querySelector(".dnative").value=iso||"";w.querySelector(".dtext").classList.remove("bad");}
  if(!silent) hidden.dispatchEvent(new Event("change",{bubbles:true}));
}
function addMonths(iso,m){var d=parseISO(iso);d.setMonth(d.getMonth()+m);d.setDate(d.getDate()-1);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function durationText(a,b){
  if(!a||!b) return "—";
  var s=parseISO(a),e=parseISO(b); var days=Math.round((e-s)/864e5)+1; if(days<=0) return "—";
  var months=Math.round(days/30.44);
  if(months>=12 && months%12===0) return (months/12)+(months===12?" year":" years");
  if(months>=1) return months+(months===1?" month":" months");
  return days+" days";
}
function expiryState(iso){
  if(!iso) return {k:"",t:"Not set",d:null};
  var d=daysUntil(iso);
  if(d<0) return {k:"crit",t:"Expired "+(-d)+"d ago",d:d};
  if(d===0) return {k:"crit",t:"Expires today",d:d};
  if(d<=settings.remindDays) return {k:"warn",t:"Expires in "+d+"d",d:d};
  return {k:"good",t:"Valid",d:d};
}
function vehicleById(id){return Store.data.vehicles.find(function(v){return v.id===id;});}
function vLabel(v){return v?(v.plate||"—"):"(deleted vehicle)";}
function vName(v){return v?[v.make,v.model].filter(Boolean).join(" "):"";}
function sortedVehicles(){return Store.data.vehicles.slice().sort(function(a,b){return String(a.plate||"").localeCompare(String(b.plate||""));});}
function opts(list,sel,blank){return (blank!=null?'<option value="">'+esc(blank)+'</option>':"")+list.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(sel)===String(v)?" selected":"")+'>'+esc(l)+'</option>';}).join("");}
function vehicleOpts(sel){return '<option value="">Select vehicle…</option>'+sortedVehicles().map(function(v){return '<option value="'+esc(v.id)+'"'+(v.id===sel?" selected":"")+'>'+esc(v.plate)+" — "+esc(vName(v)||v.type||"")+'</option>';}).join("");}
function get(o,path){return path.split(".").reduce(function(a,k){return a==null?undefined:a[k];},o);}
function fld(label,name,val,type,cls,extra){
  type=type||"text";
  if(type==="date") return '<label class="'+(cls||"")+'"><span>'+label+'</span>'+dateField(name,val,extra)+'</label>';
  if(type==="url") return '<label class="'+(cls||"")+'"><span>'+label+'</span><div class="sp-row"><input type="text" inputmode="url" autocomplete="off" spellcheck="false" class="linkin" name="'+name+'" value="'+esc(val==null?"":val)+'"'+(extra||"")+'><button type="button" class="btn sm paste-btn" data-act="pasteLink" title="Paste link from clipboard">Paste</button></div></label>';
  return '<label class="'+(cls||"")+'"><span>'+label+'</span><input type="'+type+'" name="'+name+'" value="'+esc(val==null?"":val)+'"'+(type==="number"?' step="any" min="0" inputmode="decimal"':"")+(extra||"")+'></label>';
}
function formToObj(form){
  var o={};
  new FormData(form).forEach(function(v,k){
    if(typeof v!=="string") return;
    var p=k.split("."),t=o; while(p.length>1){var x=p.shift();t=t[x]=t[x]||{};} t[p[0]]=v.trim();
  });
  return o;
}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2600);}
function setSync(k,t){$("#syncDot").className="dot "+k;$("#syncText").textContent=t;}
function spLink(url,label){return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+(label||"Open document")+' ↗</a>':'<span class="hint">No document linked</span>';}

/* ================= ALERTS ================= */
function collectAlerts(){
  var out=[];
  Store.data.vehicles.forEach(function(v){
    STATUTORY.forEach(function(s){
      var x=v[s.key]; if(!x||!x.expiry) return;
      var st=expiryState(x.expiry); if(st.k==="warn"||st.k==="crit") out.push({v:v,s:s,st:st,exp:x.expiry,cost:x.cost});
    });
  });
  Store.data.service_records.forEach(function(r){
    if(r.kind==="incident"||!r.nextDate) return;
    var later=Store.data.service_records.some(function(o){return o!==r&&o.kind!=="incident"&&o.vehicleId===r.vehicleId&&(o.date||"")>(r.date||"");});
    if(later) return;
    var st=expiryState(r.nextDate); if(st.k==="warn"||st.k==="crit"){
      st=Object.assign({},st,{t:st.d<0?"Overdue "+(-st.d)+"d":st.d===0?"Due today":"Due in "+st.d+"d"});
      out.push({v:vehicleById(r.vehicleId),s:{label:"Periodic service"},st:st,exp:r.nextDate});
    }
  });
  out=out.concat(reqAlerts());
  return out.sort(function(a,b){return a.st.d-b.st.d;});
}
/* Requisitions that are used up (and no replacement added yet) or running low */
function reqAlerts(){
  var out=[];
  Store.data.fuel_requisitions.forEach(function(rq){
    if(rq.closed) return;
    var st=reqStatus(rq), word=rq.kind==="PR"?"PR":"Petty cash";
    if(st.k==="crit"){
      if(reqVehs(rq).every(function(vid){return usableReqs(vid,rq.fuelType,rq.kind).length;})) return; // new requisitions already cover these vehicles
      out.push({v:vehicleById(reqVehs(rq)[0]),vlabel:reqPlates(rq),reqId:rq.id,s:{label:word+" "+rq.refNo+" balance depleted"},note:"add a new "+(rq.kind==="PR"?"PR":"petty cash requisition"),st:{k:"crit",t:"Balance depleted",d:-1}});
    } else if(st.k==="warn"){
      out.push({v:vehicleById(reqVehs(rq)[0]),vlabel:reqPlates(rq),reqId:rq.id,s:{label:word+" "+rq.refNo+" low balance"},note:money(Math.max(0,reqBalance(rq)))+(hasL(rq)?" · "+fmtL(Math.max(0,reqBalanceL(rq))):"")+" left",st:{k:"warn",t:"Low balance",d:1}});
    }
  });
  return out;
}
function maybeNotify(alerts){
  if(!("Notification" in window)||Notification.permission!=="granted"||!alerts.length) return;
  var key="fdc_notified_"+todayISO(); if(lsGet(key,false)) return;
  var exp=alerts.filter(function(a){return a.st.k==="crit";}).length;
  var dep=alerts.filter(function(a){return a.reqId&&a.st.k==="crit";}).length;
  new Notification("FDC Vehicle Management",{body:(dep?dep+" PR / petty cash balance"+(dep>1?"s":"")+" depleted. ":"")+(exp?exp+" expired / overdue, ":"")+(alerts.length-exp)+" expiring within "+settings.remindDays+" days. Open the portal to review."});
  lsSet(key,true);
}

/* ================= STATE & RENDER ================= */
var state = {view:"vehicles", vMode:(lsGet("fdc_vmode","cards")), q:"", ftype:"", ffuel:"", fstatus:"", svcTab:"periodic", repPreset:"6m", repFrom:"", repTo:"", repVeh:"", repGran:"", fuelQ:"", svcQ:"", fuelVeh:"", fuelMonth:"", fuelFund:"", fuelReq:"", fuelTab:"log", svcVeh:"", drawerId:null};
var notifiedOnce=false;
function render(){
  $$("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.view===state.view);});
  var alerts=collectAlerts(), b=$("#alertBadge");
  b.hidden=!alerts.length; b.textContent=alerts.length;
  var ra=alerts.filter(function(a){return a.reqId;}), fb=$("#fuelBadge"); fb.hidden=!ra.length; fb.textContent=ra.length;
  fb.classList.toggle("warn",!!ra.length&&!ra.some(function(a){return a.st.k==="crit";}));
  $("#whoName").textContent=userName||"—";$("#whoEmail").textContent=currentUser?currentUser.email:"";
  var admin=isAdmin(); document.body.classList.toggle("is-admin",admin);
  var rb=$("#whoRole"); rb.hidden=!currentUser; rb.textContent=admin?"Admin":"Member"; rb.className="pill role-badge "+(admin?"acc":"");
  if(state.view==="users"&&!admin) state.view="vehicles";
  $$("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.view===state.view);});
  var m=$("#main");
  if(state.view==="vehicles") m.innerHTML=viewVehicles(alerts);
  else if(state.view==="fueling") m.innerHTML=viewFueling();
  else if(state.view==="users") m.innerHTML=viewUsers();
  else if(state.view==="reports") m.innerHTML=viewReports();
  else m.innerHTML=viewServicing();
  if(state.view==="reports") wireReports();
  if(state.drawerId) renderDrawer();
  if(!notifiedOnce && currentUser && Store.data.vehicles.length){notifiedOnce=true;maybeNotify(alerts);}
}

/* ---------- Vehicle Details view ---------- */
function viewVehicles(alerts){
  var vs=Store.data.vehicles, q=state.q.toLowerCase();
  var expired=0,expiring=0,annual=0;
  vs.forEach(function(v){STATUTORY.forEach(function(s){var x=v[s.key]||{};annual+=num(x.cost);var st=expiryState(x.expiry);if(st.k==="crit")expired++;else if(st.k==="warn")expiring++;});});
  var list=sortedVehicles().filter(function(v){
    if(state.ftype&&v.type!==state.ftype) return false;
    if(state.ffuel&&v.fuelType!==state.ffuel) return false;
    if(state.fstatus&&(v.status||"Active")!==state.fstatus) return false;
    if(!q) return true;
    return [v.plate,v.make,v.model,v.assignedTo,v.department,v.type,v.chassisNo,v.tyreFront,v.tyreRear,v.tyreSpare,v.tyreBrand].join(" ").toLowerCase().indexOf(q)>=0;
  });
  var h='<div class="top"><div><h1>Vehicle Details</h1><p>All corporate vehicles, statutory documents and renewal dates.</p></div>'+
    '<button class="btn primary" data-act="addVehicle">+ Add Vehicle</button></div>'+
    '<div class="kpis">'+
      kpi("Total vehicles",vs.length,"",vs.filter(function(v){return (v.status||"Active")==="Active";}).length+" active")+
      kpi("Expired documents",expired,expired?"crit":"","Annual fee, insurance, roadworthiness")+
      kpi("Expiring ≤ "+settings.remindDays+" days",expiring,expiring?"warn":"","Renew soon")+
      kpi("Statutory cost (current)",money0(annual),"","Sum of latest renewal costs")+
    '</div>';
  h+='<section class="panel"><div class="panel-h"><h2>Needs attention</h2><span class="hint">Items expiring within '+settings.remindDays+' days or already expired</span></div>';
  if(!alerts.length) h+='<div class="empty">Nothing due. All statutory documents are valid.</div>';
  else h+='<ul class="alerts">'+alerts.map(function(a){
    return '<li data-act="'+(a.reqId?"viewReq":"openVehicle")+'" data-id="'+esc(a.reqId||(a.v&&a.v.id))+'"><span class="dot '+a.st.k+'"></span><div class="what"><b class="mono">'+esc(a.vlabel||vLabel(a.v))+'</b> · '+esc(a.s.label)+' <span class="hint">('+esc(a.note||fmtDate(a.exp))+')</span></div><span class="pill '+a.st.k+'">'+esc(a.st.t)+'</span></li>';
  }).join("")+'</ul>';
  h+='</section>';
  h+='<div class="toolbar"><input class="grow" type="search" placeholder="Search plate, make, model, driver, tyre size…" value="'+esc(state.q)+'" data-bind="q">'+
    '<select data-bind="ftype">'+opts(VEHICLE_TYPES,state.ftype,"All types")+'</select>'+
    '<select data-bind="ffuel">'+opts(FUEL_TYPES,state.ffuel,"All fuel")+'</select>'+
    '<select data-bind="fstatus">'+opts(STATUSES,state.fstatus,"All status")+'</select>'+
    '<div class="tabs"><button data-act="vMode" data-m="cards" class="'+(state.vMode!=="list"?"on":"")+'">Cards</button><button data-act="vMode" data-m="list" class="'+(state.vMode==="list"?"on":"")+'">List &amp; tyres</button></div></div>';
  if(!vs.length) h+='<div class="panel"><div class="empty">No vehicles yet.<br><br><button class="btn primary" data-act="addVehicle">+ Add your first vehicle</button></div></div>';
  else if(!list.length) h+='<div class="panel"><div class="empty">No vehicles match these filters.</div></div>';

function spec(l,v){return '<div><span>'+l+'</span>'+esc(v||"—")+'</div>';}
function byDateDesc(a,b){return String(b.date||"").localeCompare(String(a.date||""));}

/* ---------- Search helper: every word typed must appear somewhere in the record ---------- */
function matchQ(q,parts){
  q=String(q||"").trim().toLowerCase(); if(!q) return true;
  var hay=parts.map(function(x){return x==null?"":String(x);}).join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
function vehWords(id){var v=vehicleById(id);return v?[v.plate,v.make,v.model,v.type,v.assignedTo,v.department]:[];}
function dateWords(iso){return iso?[iso,fmtDate(iso)]:[];}
function fuelHay(r){var rq=reqById(r.requisitionId);return vehWords(r.vehicleId).concat(dateWords(r.date),[r.fuelType,r.fundType,r.fundType==="Petty Cash"?"PC":"",rq&&rq.refNo,r.poNo,r.ref,r.station,r.filledBy,r.notes,num(r.total).toFixed(2),num(r.litres).toFixed(2)]);}
function reqHay(rq){return [].concat.apply([],reqVehs(rq).map(vehWords)).concat(dateWords(rq.date),[rq.kind,rq.kind==="Petty Cash"?"PC":"",rq.refNo,rq.fuelType,rq.notes,reqStatus(rq).t,num(rq.amount).toFixed(2)]);}
function svcHay(r){return vehWords(r.vehicleId).concat(dateWords(r.date),[r.serviceType,r.type,r.vendor,r.notes,r.issue,r.status,r.reportedBy,r.odometer,num(r.cost).toFixed(2),r.nextDate?fmtDate(r.nextDate):""]);}

/* ---------- Fuel requisitions (PR / Petty Cash) ---------- */
var FUND_TYPES=[["PR","PR (Purchase Requisition)"],["Petty Cash","Petty Cash"]];
function fundShort(k){return k==="PR"?"PR":"Petty Cash";}
/* A requisition can cover several vehicles (shared balance). Older ones store a single vehicleId. */
function reqVehs(rq){return (rq.vehicleIds&&rq.vehicleIds.length)?rq.vehicleIds:(rq.vehicleId?[rq.vehicleId]:[]);}
function reqCovers(rq,vid){return reqVehs(rq).indexOf(vid)>=0;}
function reqPlates(rq){return reqVehs(rq).map(function(id){return vLabel(vehicleById(id));}).join(", ");}
function reqVehHtml(rq){var ids=reqVehs(rq);
  if(ids.length===1){var v=vehicleById(ids[0]);return '<span class="mono">'+esc(vLabel(v))+'</span><div class="sub">'+esc(vName(v))+'</div>';}
  return '<span class="pill acc">'+ids.length+' vehicles</span><div class="sub" style="max-width:220px">'+esc(reqPlates(rq))+'</div>';}
function reqById(id){return Store.data.fuel_requisitions.find(function(r){return r.id===id;});}
function reqUsed(rq,excludeFuelId){return Store.data.fuel_records.reduce(function(s,f){return f.requisitionId===rq.id&&f.id!==excludeFuelId?s+num(f.total):s;},0);}
function reqBalance(rq,excludeFuelId){return Math.round((num(rq.amount)-reqUsed(rq,excludeFuelId))*100)/100;}
/* Litre balance (requisitions created before litres were added have no litre limit) */
function hasL(rq){return num(rq.litres)>0;}
function reqUsedL(rq,excludeFuelId){return Store.data.fuel_records.reduce(function(s,f){return f.requisitionId===rq.id&&f.id!==excludeFuelId?s+num(f.litres):s;},0);}
function reqBalanceL(rq,excludeFuelId){return Math.round((num(rq.litres)-reqUsedL(rq,excludeFuelId))*100)/100;}
function fmtL(x){return num(x).toLocaleString("en-US",{maximumFractionDigits:2})+" L";}
function reqPct(rq){var a=num(rq.amount)?reqBalance(rq)/num(rq.amount):1, l=hasL(rq)?reqBalanceL(rq)/num(rq.litres):1;return Math.max(0,Math.min(1,a,l));}
function reqStatus(rq){
  if(rq.closed) return {k:"",t:"Closed"};
  if(reqBalance(rq)<=0||(hasL(rq)&&reqBalanceL(rq)<=0)) return {k:"crit",t:"Limit reached"};
  if(reqPct(rq)<0.2) return {k:"warn",t:"Low balance"};
  return {k:"good",t:"Active"};
}
function reqLabel(rq){return (rq.kind==="PR"?"PR ":"PC ")+(rq.refNo||"—");}
/* Requisitions that can still fund a fill for this vehicle + fuel type + funding type, oldest first */
function usableReqs(vehicleId,fuelType,kind,excludeFuelId,keepId){
  return Store.data.fuel_requisitions.filter(function(rq){
    if(rq.id===keepId) return true;
    return !rq.closed&&reqCovers(rq,vehicleId)&&rq.fuelType===fuelType&&rq.kind===kind&&reqBalance(rq,excludeFuelId)>0&&(!hasL(rq)||reqBalanceL(rq,excludeFuelId)>0);
  }).sort(function(a,b){return String(a.date||"").localeCompare(String(b.date||""));});
}
function balBar(rq){
  var pct=reqPct(rq)*100,st=reqStatus(rq);
  return '<div class="bar '+st.k+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
}

var FUEL_SERIES=[{key:"Petrol",color:"var(--petrol)"},{key:"Diesel",color:"var(--diesel)"}];
function isoOf(d){var x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
function repPresetRange(p){
  var t=new Date();t.setHours(0,0,0,0);var to=isoOf(t),from;
  if(p==="month") from=isoOf(new Date(t.getFullYear(),t.getMonth(),1));
  else if(p==="3m") from=isoOf(new Date(t.getFullYear(),t.getMonth()-2,1));
  else if(p==="6m") from=isoOf(new Date(t.getFullYear(),t.getMonth()-5,1));
  else if(p==="year") from=isoOf(new Date(t.getFullYear(),0,1));
  else { var ds=Store.data.fuel_records.map(function(r){return r.date;}).filter(Boolean).sort(); from=ds[0]||isoOf(new Date(t.getFullYear(),0,1)); if(ds.length&&ds[ds.length-1]>to) to=ds[ds.length-1]; }
  return {from:from,to:to};
}
function repRange(){
  if(!state.repFrom||!state.repTo){var r=repPresetRange(state.repPreset||"6m");state.repFrom=state.repFrom||r.from;state.repTo=state.repTo||r.to;}
  var f=state.repFrom,t=state.repTo; if(f>t){var x=f;f=t;t=x;} return {from:f,to:t};
}
function repGran(from,to){
  if(state.repGran) return state.repGran;
  var days=(parseISO(to)-parseISO(from))/864e5;
  return days<=45?"day":days<=120?"week":"month";
}
function bucketKey(iso,g){
  if(g==="month") return iso.slice(0,7);
  if(g==="week"){var d=parseISO(iso),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return isoOf(d);}
  return iso;
}
function bucketList(from,to,g){
  var out=[],d=parseISO(g==="month"?from.slice(0,7)+"-01":bucketKey(from,g)),end=parseISO(to),guard=0;
  while(d<=end&&guard++<2000){
    out.push(g==="month"?isoOf(d).slice(0,7):isoOf(d));
    if(g==="month") d=new Date(d.getFullYear(),d.getMonth()+1,1); else d.setDate(d.getDate()+(g==="week"?7:1));
  }
  return out;
}
function bucketLabel(k,g,long){
  if(g==="month") return parseISO(k+"-01").toLocaleDateString("en-GB",{month:"short",year:long?"numeric":"2-digit"});
  var s=parseISO(k).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  if(g==="week") return long?"Week of "+s+" "+k.slice(0,4):s;
  return long?parseISO(k).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):s;
}
function repData(){
  var rg=repRange(),g=repGran(rg.from,rg.to);
  var recs=Store.data.fuel_records.filter(function(r){return r.date&&r.date>=rg.from&&r.date<=rg.to&&(!state.repVeh||r.vehicleId===state.repVeh)&&(r.fuelType==="Petrol"||r.fuelType==="Diesel");});
  var keys=bucketList(rg.from,rg.to,g), idx={}; keys.forEach(function(k,i){idx[k]=i;});
  var rows=keys.map(function(k){return {k:k,Petrol:{l:0,c:0},Diesel:{l:0,c:0}};});
  var tot={Petrol:{l:0,c:0,n:0},Diesel:{l:0,c:0,n:0}}, byVeh={};
  recs.forEach(function(r){
    var i=idx[bucketKey(r.date,g)],ft=r.fuelType;
    if(i!=null){rows[i][ft].l+=num(r.litres);rows[i][ft].c+=num(r.total);}
    tot[ft].l+=num(r.litres);tot[ft].c+=num(r.total);tot[ft].n++;
    var bv=byVeh[r.vehicleId]=byVeh[r.vehicleId]||{l:0,c:0,n:0,ft:ft};bv.l+=num(r.litres);bv.c+=num(r.total);bv.n++;
  });
  return {from:rg.from,to:rg.to,g:g,recs:recs,rows:rows,tot:tot,byVeh:byVeh};
}

/* Donut chart — litres Petrol vs Diesel */
function drawPie(D){
  var el=$("#pieChart"); if(!el) return;
  var T=D.tot,total=T.Petrol.l+T.Diesel.l,S=220,R=100,r0=64,cx=S/2,cy=S/2,a=-Math.PI/2,paths="";
  FUEL_SERIES.forEach(function(s){
    var v=T[s.key].l; if(!v) return;
    var frac=v/total;
    if(frac>=0.9999){paths+='<circle class="slice" data-k="'+s.key+'" cx="'+cx+'" cy="'+cy+'" r="'+((R+r0)/2)+'" fill="none" stroke="'+s.color+'" stroke-width="'+(R-r0)+'"/>';return;}
    var a2=a+frac*2*Math.PI,lg=frac>0.5?1:0;
    function pt(rr,ang){return (cx+rr*Math.cos(ang)).toFixed(2)+" "+(cy+rr*Math.sin(ang)).toFixed(2);}
    paths+='<path class="slice" data-k="'+s.key+'" d="M'+pt(R,a)+" A"+R+" "+R+" 0 "+lg+" 1 "+pt(R,a2)+" L"+pt(r0,a2)+" A"+r0+" "+r0+" 0 "+lg+" 0 "+pt(r0,a)+'Z" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>';
    a=a2;
  });
  var svg='<svg viewBox="0 0 '+S+' '+S+'" width="'+S+'" height="'+S+'" role="img" aria-label="Litres by fuel type: Petrol '+fmtNum(T.Petrol.l,1)+' L, Diesel '+fmtNum(T.Diesel.l,1)+' L">'+paths+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" class="pie-total">'+fmtNum(total,0)+'</text><text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" class="pie-sub">litres total</text></svg>';
  var leg='<div class="pie-legend">'+FUEL_SERIES.map(function(s){var v=T[s.key];return '<div class="pl-row"><i class="swatch lg" style="background:'+s.color+'"></i><div><div class="pl-name">'+s.key+' <span class="pl-pct">'+(total?(v.l/total*100).toFixed(1):"0.0")+'%</span></div><div class="pl-val">'+fmtNum(v.l,1)+' L</div><div class="sub">'+money(v.c)+' · '+v.n+' entries</div></div></div>';}).join("")+'</div>';

    p.addEventListener("mousemove",function(ev){var k=p.dataset.k,v=T[k],bb=box.getBoundingClientRect();

  });
}

/* Line chart — cost per period, Petrol vs Diesel (one y-axis, Rf) */
function niceMax(v){if(v<=0)return 10;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function drawLine(D){

  var W=Math.max(300,el.clientWidth||600),H=310,pl=62,pr=64,pt=28,pb=34,iw=W-pl-pr,ih=H-pt-pb,rows=D.rows,n=rows.length;

  var lines="",ends=[];

    if(n===1) lines+='<circle cx="'+X(0)+'" cy="'+Y(rows[0][s.key].c)+'" r="4" fill="'+s.color+'"/>';

  });
  ends.sort(function(a,b){return a.y-b.y;}); if(ends[1].y-ends[0].y<14){var mid=(ends[0].y+ends[1].y)/2;ends[0].y=mid-7;ends[1].y=mid+7;}
  ends.forEach(function(e){lines+='<text x="'+(W-pr+8)+'" y="'+(e.y+4)+'" class="endlbl">'+e.k+'</text>';});
  var svg='<svg width="'+W+'" height="'+H+'" role="img" aria-label="Fuel cost over time, petrol and diesel">'+g+lines+
    '<line class="xhair" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" visibility="hidden"/>'+

    '<rect class="hit" x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg><div class="tip" hidden></div>';
  el.innerHTML=svg;
  var svgEl=el.querySelector("svg"),tip=el.querySelector(".tip"),xh=el.querySelector(".xhair");
  el.querySelector(".hit").addEventListener("mousemove",function(ev){
    var bb=svgEl.getBoundingClientRect(),x=ev.clientX-bb.left,i=n<=1?0:Math.round((x-pl)/(iw/(n-1)));i=Math.max(0,Math.min(n-1,i));

    tip.hidden=false;var tw=tip.offsetWidth;tip.style.left=(cx+14+tw>W?cx-14-tw:cx+14)+"px";tip.style.top=(pt+6)+"px";
  });
  el.querySelector(".hit").addEventListener("mouseleave",function(){tip.hidden=true;xh.setAttribute("visibility","hidden");$$(".hdot",el).forEach(function(c){c.setAttribute("visibility","hidden");});});
}

/* ================= IN-APP BACK / FORWARD NAVIGATION =================
   Each page (Vehicle Details, Fueling, …) is a history entry (#/fueling).
   Opening a panel, form or photo adds one "overlay" entry, so the browser / phone
   Back button closes the top-most panel instead of leaving the app. */
var VIEWS=["vehicles","fueling","servicing","reports","users"];
var Nav={
  overlay:false, ignore:0, needPush:false,
  anyOpen:function(){return !$("#lightbox").hidden||!$("#overlay").hidden||!!state.drawerId;},
  push:function(st,hash){history.pushState(st,"",hash);},
  openLayer:function(){
    if(this.overlay) return; this.overlay=true;
    if(this.ignore>0) this.needPush=true; else this.push({view:state.view,overlay:1},location.hash);
  },
  layerClosed:function(){
    if(!this.overlay||this.anyOpen()) return; this.overlay=false;
    if(this.needPush){this.needPush=false;return;}
    this.ignore++; history.back();
  },
  closeTop:function(){
    if(!$("#lightbox").hidden) closeLightboxUI();
    else if(!$("#overlay").hidden) closeModalUI();
    else if(state.drawerId) closeDrawerUI();
  },
  closeAllUI:function(){closeLightboxUI();closeModalUI();closeDrawerUI();},
  go:function(view){
    if(VIEWS.indexOf(view)<0) view="vehicles";
    var hadOverlay=this.overlay; this.closeAllUI(); this.overlay=false; this.needPush=false;
    if(view===state.view){ if(hadOverlay){this.ignore++;history.back();} window.scrollTo(0,0); return; }
    state.view=view;
    if(hadOverlay) history.replaceState({view:view},"","#/"+view); else this.push({view:view},"#/"+view);
    render(); window.scrollTo(0,0);
  },
  fromHash:function(){var v=(location.hash.match(/^#\/(\w+)/)||[])[1];return VIEWS.indexOf(v)>=0?v:null;}
};
window.addEventListener("popstate",function(e){
  if(Nav.ignore>0){ Nav.ignore--; if(Nav.ignore===0&&Nav.needPush){Nav.needPush=false;Nav.push({view:state.view,overlay:1},location.hash);} return; }
  var st=e.state||{};
  if(st.overlay){ // came "forward" onto an overlay entry with nothing open — step back over it
    if(!Nav.anyOpen()){Nav.ignore++;history.back();} else Nav.overlay=true; return; }
  if(Nav.overlay||Nav.anyOpen()){
    Nav.overlay=false; Nav.closeTop();
    if(Nav.anyOpen()){Nav.overlay=true;Nav.push({view:state.view,overlay:1},location.hash);} // more layers left: keep one Back step per layer
    return;
  }
  var v=st.view||Nav.fromHash()||"vehicles";
  if(v!==state.view){state.view=v;render();window.scrollTo(0,0);}
});

      var max=1600,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));

      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.8));};img.src=r.result;};
    r.readAsDataURL(file);
  });

/* ---------- Litres × rate = total: fill in whichever of the three you didn't type ---------- */
function fuelCalc(f,changed){
  if(!modalCtx) return;
  var names=["litres","rate","total"], ord=modalCtx.calcOrder||[];
  ord=[changed].concat(ord.filter(function(n){return n!==changed;}));
  // if only one field has been typed, pair it with another field that already has a value
  if(ord.length<2){var other=["rate","litres","total"].filter(function(n){return n!==changed&&num(f[n].value)>0;})[0];if(other)ord.push(other);}
  ord=ord.slice(0,2); modalCtx.calcOrder=ord;
  var target=names.filter(function(n){return ord.indexOf(n)<0;})[0]; if(!target) return;
  var L=num(f.litres.value),R=num(f.rate.value),T=num(f.total.value),out=null;
  if(target==="total"&&L>0&&R>0) out=(L*R).toFixed(2);
  if(target==="litres"&&T>0&&R>0) out=(T/R).toFixed(2);
  if(target==="rate"&&T>0&&L>0) out=(T/L).toFixed(3);
  names.forEach(function(n){f[n].classList.toggle("calc",n===target&&out!==null);});
  if(out!==null){f[target].value=out;var lbl={litres:"Litres",rate:"Rate per litre",total:"Total cost"}[target];var h=$("#calcHint");if(h)h.textContent=lbl+" calculated automatically from the other two.";}
}

  $$("#auth [data-only]").forEach(function(el){el.hidden=el.dataset.only!==mode;});
  $("#authSubmit").textContent=mode==="login"?"Sign in":"Create account";
  $('#authForm [name=password]').autocomplete=mode==="login"?"current-password":"new-password";
  authMsg("");
}
function showAuth(show){
  $("#auth").hidden=!show; document.body.classList.toggle("locked",show);
  if(show){closeModal();closeDrawer();setTimeout(function(){var f=$(authMode==="register"?'#authForm [name=name]':'#authForm [name=email]');if(f)f.focus();},50);}

function saveProfile(){
  if(!currentUser||!Store.db) return;
  var ref=Store.db.collection("users").doc(currentUser.uid), base={name:userName,email:currentUser.email,lastLogin:Date.now()};
  ref.get().then(function(d){
    if(!d.exists){base.role="member";base.createdAt=Date.now();}
    return ref.set(base,{merge:true});
  }).catch(function(e){console.warn("profile",e);});
}
var Auth={
  init:function(){
    setAuthMode("login");
    var ready=function(){$("#authLoading").hidden=true;$("#authForm").hidden=false;};
    if(!window.firebase){ready();showAuth(true);authMsg("Could not load the sign-in service. Check your internet connection and reload the page.");$("#authSubmit").disabled=true;setSync("crit","Offline");return;}
    try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){ console.warn(e); }
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
    Store.db=firebase.firestore();
    firebase.auth().onAuthStateChanged(function(user){
      if(user && user.isAnonymous){ firebase.auth().signOut(); return; } // old anonymous sessions from the previous version
      currentUser=user||null; ready();
      if(user){
        userName=user.displayName||user.email.split("@")[0];
        showAuth(false); Store.start(); saveProfile(); render();
      }else{
        userName=""; Store.stop(); notifiedOnce=false; state.drawerId=null; render(); showAuth(true); setSync("","Signed out");
      }
    });
  },
  submit:async function(f){
    var email=f.email.value.trim().toLowerCase(), pw=f.password.value;
    if(!email||!pw){authMsg("Enter your email and password.");return;}
    if(authMode==="login"){
      await firebase.auth().signInWithEmailAndPassword(email,pw);
      return true;
    }
    var name=f.name.value.trim();
    if(!name){authMsg("Please enter your full name.");return;}
    if(!/^\S+@\S+\.\S+$/.test(email)){authMsg("That email address is not valid.");return;}
    if(ALLOWED_EMAIL_DOMAINS.length && ALLOWED_EMAIL_DOMAINS.indexOf(email.split("@")[1])<0){authMsg("Please register with your company email ("+ALLOWED_EMAIL_DOMAINS.map(function(d){return "@"+d;}).join(", ")+").");return;}
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){authMsg("Password must be at least 8 characters and include a letter and a number.");return;}
    if(pw!==f.password2.value){authMsg("Passwords do not match.");return;}
    var cred=await firebase.auth().createUserWithEmailAndPassword(email,pw);
    await cred.user.updateProfile({displayName:name});
    userName=name; currentUser=cred.user; saveProfile(); render();
    cred.user.sendEmailVerification().catch(function(){});
    toast("Account created — welcome, "+name);
    return true;
  },
  forgot:async function(){
    var email=$('#authForm [name=email]').value.trim();
    if(!email){authMsg("Type your email address above, then click “Forgot password?” again.");return;}
    try{await firebase.auth().sendPasswordResetEmail(email);authMsg("If an account exists for "+email+", a password reset link has been sent. Check your inbox (and spam).",true);}
    catch(e){authMsg(authErr(e));}
  }
};
document.addEventListener("submit",async function(e){
  if(e.target.id!=="authForm") return; e.preventDefault();
  var b=$("#authSubmit"); b.disabled=true; authMsg("");
  var label=b.textContent; b.textContent=authMode==="login"?"Signing in…":"Creating account…";
  try{ if(await Auth.submit(e.target)){ e.target.password.value=""; e.target.password2.value=""; } }

/* ---------- Date fields (dd/mm/yyyy) ---------- */
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("dtext")){
    var raw=t.value, digits=raw.replace(/\D/g,"").slice(0,8);
    var deleting=String(e.inputType||"").indexOf("delete")===0;
    if(!deleting&&!/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4}$/.test(raw)){ // typing digits: auto-insert the slashes
      var out=digits.slice(0,2); if(digits.length>2) out+="/"+digits.slice(2,4); if(digits.length>4) out+="/"+digits.slice(4,8);
      t.value=out;
    }
    var hid=t.parentNode.querySelector("[data-date]"), iso=dmyToISO(t.value);
    if(iso){t.classList.remove("bad"); if(hid.value!==iso){hid.value=iso;t.parentNode.querySelector(".dnative").value=iso;hid.dispatchEvent(new Event("change",{bubbles:true}));}}
    else if(!t.value.trim()&&hid.value&&!hid.hasAttribute("data-bind")){hid.value="";hid.dispatchEvent(new Event("change",{bubbles:true}));}
  }
  if(t.classList&&t.classList.contains("dnative")){ // picked from calendar
    var h=t.parentNode.querySelector("[data-date]"); if(t.value) setDateVal(h,t.value);
  }
},true);

document.addEventListener("focusout",function(e){

/* ---------- Link fields: accept pasted SharePoint links in any format ---------- */
function cleanLink(t){t=String(t||"").trim();var m=t.match(/https?:\/\/[^\s"'<>]+/i);return m?m[0]:t.replace(/\s+/g," ");}
document.addEventListener("paste",function(e){
  var t=e.target; if(!t.classList||!t.classList.contains("linkin")||!e.clipboardData) return;
  var plain=e.clipboardData.getData("text/plain")||"", html=e.clipboardData.getData("text/html")||"", url="";
  var hm=html.match(/href="([^"]+)"/i); if(hm) url=hm[1].replace(/&amp;/g,"&");
  if(!url) url=cleanLink(plain);
  if(!url) return;               // nothing usable — let the browser do its normal paste
  e.preventDefault(); t.value=url; t.dispatchEvent(new Event("input",{bubbles:true}));
});

document.addEventListener("submit",async function(e){
