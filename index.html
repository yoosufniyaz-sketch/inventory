<script>
/* =====================================================================

===================================================================== */
const state = { products: [], movements: [], profiles: [], assets: [], assetTransfers: [] };
const DEFAULT_LOCATIONS = [

];

function getLocation(id){ return LOCATIONS.find(l=>l.id===id); }

const ui = {
  tab: 'dashboard',
  productsFilter: { search:'', category:'' },
  movementsFilter: { search:'', type:'', locationId:'', acquisition:'', dateFrom:'', dateTo:'' },

  selectedAssetId: null,

};

/* =====================================================================
   STORAGE — saved to this browser's localStorage, so it works fully
   standalone: as a local file, or hosted on your own website.
   Data lives only in the browser/device you're using — it won't sync
   to other devices or follow you if you switch browsers.
===================================================================== */
const STORAGE_PREFIX = 'fdc_inventory_';
const THEME_KEY = STORAGE_PREFIX + 'theme';
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const sun = document.getElementById('theme-icon-sun');
  const moon = document.getElementById('theme-icon-moon');
  if(sun && moon){
    sun.classList.toggle('hidden', theme!=='dark');
    moon.classList.toggle('hidden', theme==='dark');
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme(next);
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(saved);
})();

function hasStorageApi(){
  try{
    const testKey = STORAGE_PREFIX + '__test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}
async function getJSON(key, fallback){
  if(!hasStorageApi()){ markStorageDown('missing'); return fallback; }
  try{
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    markStorageUp();
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback; // missing or corrupt value is treated as empty
  }
}
async function setJSON(key, value){
  if(!hasStorageApi()){ markStorageDown('missing'); return false; }
  try{
    window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    markStorageUp();
    return true;
  }catch(e){
    // Most commonly a full/disabled storage quota (e.g. private browsing)
    markStorageDown('error');
    return false;
  }
}
async function persistItemDoc(item){
  await setJSON('products', state.products);
  if(firestoreItemsRef){
    try{ await firestoreItemsRef.doc(item.id).set(item); }
    catch(e){ toast('Saved locally, but could not sync to the cloud right now.', true); }
  }
}
async function deleteItemDoc(id){
  await setJSON('products', state.products);
  if(firestoreItemsRef){
    try{ await firestoreItemsRef.doc(id).delete(); }
    catch(e){ toast('Deleted locally, but could not sync to the cloud right now.', true); }
  }
}
async function persistMovementDoc(m){
  await setJSON('movements', state.movements);
  if(firestoreMovementsRef){
    try{ await firestoreMovementsRef.doc(m.id).set(m); }
    catch(e){ toast('Saved locally, but could not sync to the cloud right now.', true); }
  }
}
async function deleteMovementDoc(id){
  await setJSON('movements', state.movements);
  if(firestoreMovementsRef){
    try{ await firestoreMovementsRef.doc(id).delete(); }
    catch(e){ toast('Deleted locally, but could not sync to the cloud right now.', true); }
  }
}
async function persistAssetDoc(asset){
  await setJSON('assets', state.assets);
  if(firestoreAssetsRef){
    try{ await firestoreAssetsRef.doc(asset.id).set(asset); }
    catch(e){ toast('Saved locally, but could not sync to the cloud right now.', true); }
  }
}
async function deleteAssetDoc(id){
  await setJSON('assets', state.assets);
  if(firestoreAssetsRef){
    try{ await firestoreAssetsRef.doc(id).delete(); }
    catch(e){ toast('Deleted locally, but could not sync to the cloud right now.', true); }
  }
}
async function persistAssetTransferDoc(t){
  await setJSON('assetTransfers', state.assetTransfers);
  if(firestoreAssetTransfersRef){
    try{ await firestoreAssetTransfersRef.doc(t.id).set(t); }
    catch(e){ toast('Saved locally, but could not sync to the cloud right now.', true); }
  }
}
async function deleteAssetTransferDoc(id){
  await setJSON('assetTransfers', state.assetTransfers);
  if(firestoreAssetTransfersRef){
    try{ await firestoreAssetTransfersRef.doc(id).delete(); }
    catch(e){ toast('Deleted locally, but could not sync to the cloud right now.', true); }
  }
}

let storageDown = false;
function markStorageDown(reason){
  const wasDown = storageDown;
  storageDown = true;
  renderStorageBanner(reason);
  if(!wasDown) toast('Changes are not being saved — see the notice at the top of the page.', true);
}
function markStorageUp(){
  if(storageDown){ storageDown = false; toast('Saving is working again.'); }
  const el = document.getElementById('storage-banner');
  if(el) el.remove();
  document.body.classList.remove('has-banner');
}
function renderStorageBanner(reason){
  document.body.classList.add('has-banner');
  let el = document.getElementById('storage-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'storage-banner';
    el.className = 'fixed top-0 inset-x-0 z-[70] bg-rose-600 text-white text-[13px] px-4 py-2.5 flex flex-wrap items-center justify-center gap-3 text-center';
    document.body.prepend(el);
  }
  const msg = reason === 'missing'
    ? "Your browser is blocking local storage here (common in private/incognito windows, or with strict cookie settings). Allow site data for this page, or open it in a normal browser window."
    : "Your browser couldn't save that change — storage may be full or disabled. Try clearing space or checking your browser's privacy settings.";
  el.innerHTML = '<span><b class="font-bold">Not saving.</b> ' + msg + '</span>' +
    '<button class="bg-white/20 hover:bg-white/30 rounded px-2.5 py-1 text-xs font-semibold shrink-0" onclick="this.parentElement.remove(); document.body.classList.remove(\'has-banner\');">Dismiss</button>';
}

/* =====================================================================
   CLOUD SYNC — optional. Off by default (data stays local-only, no
   sign-in). Once connected to a Firebase project, each person signs in
   with their own account, and their inventory syncs across their own
   devices. Data is private per account — it is never shared between
   different people's accounts.
   We never see or store anyone's credentials — the config and session
   live only in the browser, managed by Firebase itself.
===================================================================== */
const CLOUD_CONFIG_KEY = STORAGE_PREFIX + 'cloud_config';
const REQUIRED_EMAIL_DOMAIN = 'fdc.mv';
function isAllowedEmail(email){
  return (email||'').trim().toLowerCase().endsWith('@' + REQUIRED_EMAIL_DOMAIN);
}
let firestoreDb = null;
let firestoreItemsRef = null;
let firestoreMovementsRef = null;
let firestoreAssetsRef = null;
let firestoreAssetTransfersRef = null;
let firestoreProfilesRef = null;
let firebaseAuth = null;
let itemsUnsub = null;
let movementsUnsub = null;
let assetsUnsub = null;
let assetTransfersUnsub = null;
let locationsUnsub = null;
let profileUnsub = null;
let allProfilesUnsub = null;
let pendingSignupExtra = null;
let cloudStatus = 'local'; // 'local' | 'connecting' | 'synced' | 'error'
let authUser = null; // { uid, email, name } | null
const authUi = { mode: 'login' };

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}

const DEFAULT_FIREBASE_CONFIG = { apiKey: "AIzaSyBC_p38cBCkq3FRmb5wnfeJZTMafYV1FXw", authDomain: "fdc-inventory.firebaseapp.com", projectId: "fdc-inventory", storageBucket: "fdc-inventory.firebasestorage.app", messagingSenderId: "376772139420", appId: "1:376772139420:web:dab35c35a7d84ad3e25059", measurementId: "G-25CHH1XQKJ" };
function getCloudConfig(){ try{ const raw = localStorage.getItem(CLOUD_CONFIG_KEY); if(raw) return JSON.parse(raw); return { firebaseConfig: DEFAULT_FIREBASE_CONFIG }; }catch(e){ return { firebaseConfig: DEFAULT_FIREBASE_CONFIG }; } }
function setCloudConfig(cfg){
  if(cfg) localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
  else localStorage.removeItem(CLOUD_CONFIG_KEY);
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector('script[data-src="'+src+'"]')){ resolve(true); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.setAttribute('data-src', src);
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error('Could not load the cloud sync library. Check your connection.'));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  if(window.firebase && window.firebase.firestore && window.firebase.auth) return true;
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js');
  if(!window.firebase) throw new Error('Cloud sync library did not load.');
  return true;
}

function parseFirebaseConfigInput(text){
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1 || end===-1 || end<start) throw new Error('Paste the full Firebase config object, including the { }.');
  const objText = text.slice(start, end+1);
  let obj;
  try{ obj = JSON.parse(objText); }
  catch(e){
    try{ obj = Function('"use strict"; return (' + objText + ');')(); }
    catch(e2){ throw new Error('Could not read that config. Paste it exactly as copied from Firebase.'); }
  }
  if(!obj || !obj.apiKey || !obj.projectId) throw new Error('That config is missing apiKey or projectId — copy the whole object from Firebase.');
  return obj;
}

function clearLocalDataCache(){
  state.products = [];
  state.movements = [];
  state.assets = [];
  state.assetTransfers = [];
  LOCATIONS = DEFAULT_LOCATIONS.map(l=>({...l}));
  localStorage.removeItem(STORAGE_PREFIX+'products');
  localStorage.removeItem(STORAGE_PREFIX+'movements');
  localStorage.removeItem(STORAGE_PREFIX+'assets');
  localStorage.removeItem(STORAGE_PREFIX+'assetTransfers');
  localStorage.removeItem(STORAGE_PREFIX+'locations');
}

async function initCloudIfConfigured(){
  const cfg = getCloudConfig();
  if(!cfg){ cloudStatus = 'local'; authUser = null; renderApp(); return; }
  cloudStatus = 'connecting';
  renderApp();
  try{
    await ensureFirebase();
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg.firebaseConfig);
    firestoreDb = firebase.firestore();
    firestoreProfilesRef = firestoreDb.collection('fdc_inventory_profiles');
    firebaseAuth = firebase.auth();
    firebaseAuth.onAuthStateChanged(user=>{
      if(user){
        const pendingExtra = pendingSignupExtra; pendingSignupExtra = null;
        authUser = {
          uid:user.uid, email:user.email,
          name: (pendingExtra && pendingExtra.name) || user.displayName || user.email,
          role:'member',
          designation: (pendingExtra && pendingExtra.designation) || '',
          department: (pendingExtra && pendingExtra.department) || '',
        };
        cloudStatus = 'synced';
        firestoreItemsRef = firestoreDb.collection('fdc_inventory_items');
        firestoreMovementsRef = firestoreDb.collection('fdc_inventory_movements');
        firestoreAssetsRef = firestoreDb.collection('fdc_inventory_assets');
        firestoreAssetTransfersRef = firestoreDb.collection('fdc_inventory_asset_transfers');
        listenToCloudItems();
        listenToCloudMovements();
        listenToCloudAssets();
        listenToCloudAssetTransfers();
        listenToCloudLocations();
        ensureOwnProfileDoc(user, pendingExtra);
        listenToOwnProfile(user);
      } else {
        authUser = null;
        if(itemsUnsub){ itemsUnsub(); itemsUnsub = null; }
        if(movementsUnsub){ movementsUnsub(); movementsUnsub = null; }
        if(assetsUnsub){ assetsUnsub(); assetsUnsub = null; }
        if(assetTransfersUnsub){ assetTransfersUnsub(); assetTransfersUnsub = null; }
        if(locationsUnsub){ locationsUnsub(); locationsUnsub = null; }
        if(profileUnsub){ profileUnsub(); profileUnsub = null; }
        if(allProfilesUnsub){ allProfilesUnsub(); allProfilesUnsub = null; }
        state.profiles = [];
        firestoreItemsRef = null; firestoreMovementsRef = null; firestoreAssetsRef = null; firestoreAssetTransfersRef = null;
        clearLocalDataCache();
        cloudStatus = 'synced';
      }
      renderApp();
    });
  }catch(e){
    cloudStatus = 'error';
    toast('Could not connect to cloud sync: ' + (e && e.message ? e.message : 'unknown error'), true);
    renderApp();
  }
}
function listenToOwnProfile(user){
  if(profileUnsub) profileUnsub();
  if(!firestoreProfilesRef) return;
  profileUnsub = firestoreProfilesRef.doc(user.uid).onSnapshot(doc=>{
    if(doc.exists && authUser){
      const d = doc.data();
      authUser.role = d.role || 'member';
      authUser.designation = d.designation || '';
      authUser.department = d.department || '';
      authUser.name = d.name || authUser.name;
    }
    renderApp();
  }, err=>{ /* profile is a nice-to-have on top of auth; a failure here shouldn't block the app */ });
}
async function ensureOwnProfileDoc(user, extra){ if(!firestoreProfilesRef || !firestoreDb) return; try{ let assignedRole = null; const metaRef = firestoreDb.collection('fdc_inventory_meta').doc('adminStatus'); await firestoreDb.runTransaction(async (tx) => { const ref = firestoreProfilesRef.doc(user.uid); const snap = await tx.get(ref); if(snap.exists) return; const metaSnap = await tx.get(metaRef); const alreadyHasAdmin = metaSnap.exists && metaSnap.data().assigned; const role = alreadyHasAdmin ? 'member' : 'admin'; const data = Object.assign({ uid:user.uid, email:user.email, name:user.displayName||user.email, role, designation:'', department:'', createdAt: Date.now() }, extra||{}); tx.set(ref, data); if(!alreadyHasAdmin) tx.set(metaRef, { assigned:true }); assignedRole = role; }); if(assignedRole && authUser && authUser.uid===user.uid){ authUser.role = assignedRole; renderApp(); } }catch(e){ } }
let lastCloudErrorToastAt = 0;
function handleCloudSyncError(err, collectionLabel){
  cloudStatus = 'error';
  const isPermissionDenied = err && (err.code === 'permission-denied' || (err.message||'').toLowerCase().includes('permission'));
  const now = Date.now();
  if(now - lastCloudErrorToastAt > 4000){
    lastCloudErrorToastAt = now;
    if(isPermissionDenied){
      toast('Cloud sync blocked by Firestore rules for ' + collectionLabel + ' — changes are still saving to this browser. Check Firestore Database → Rules covers this collection.', true);
    } else {

  }, err=> handleCloudSyncError(err, 'locations'));

async function persistLocations(){
  localStorage.setItem(STORAGE_PREFIX+'locations', JSON.stringify(LOCATIONS));
  if(firestoreDb){
    try{ await firestoreDb.collection('fdc_inventory_meta').doc('locations').set({ list: LOCATIONS }); }
    catch(e){ toast('Saved locally, but could not sync to the cloud right now.', true); }
  }
}
function moveLocation(id, direction){
  if(!canManageInventory()){ toast('Only admins can reorder locations.', true); return; }
  const idx = LOCATIONS.findIndex(l=>l.id===id);
  if(idx===-1) return;
  const swapWith = direction==='up' ? idx-1 : idx+1;
  if(swapWith<0 || swapWith>=LOCATIONS.length) return;
  const tmp = LOCATIONS[idx];
  LOCATIONS[idx] = LOCATIONS[swapWith];
  LOCATIONS[swapWith] = tmp;
  persistLocations();
  rerenderMain();
}

    firestoreDb = null; firestoreItemsRef = null; firestoreMovementsRef = null; firestoreAssetsRef = null; firestoreAssetTransfersRef = null; firebaseAuth = null; authUser = null; cloudStatus = 'local';
    closeModal();

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'An account with this email already exists — sign in instead.';
  if(code.includes('invalid-email')) return 'Enter a valid email address.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('network-request-failed')) return 'Network error — check your connection and try again.';
  if(code.includes('operation-not-allowed')) return 'Email/Password sign-in isn’t turned on for this Firebase project yet. In the Firebase console, go to Authentication → Sign-in method and enable Email/Password.';
  if(code.includes('configuration-not-found')) return 'Authentication hasn’t been set up for this Firebase project yet. In the Firebase console, go to Authentication and click "Get started" first, then enable Email/Password under Sign-in method.';
  return (e && e.message) || 'Something went wrong. Please try again.';
}

/* =====================================================================
   UTILITIES
===================================================================== */
function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}
function fmtNum(n){ return (Number(n)||0).toLocaleString(undefined, { maximumFractionDigits:2 }); }
function byName(a,b){ return (a.name||'').localeCompare(b.name||''); }
function byTag(a,b){
  const ta = (a.tag||'').trim(), tb = (b.tag||'').trim();
  if(!ta && !tb) return byName(a,b);
  if(!ta) return 1;  // items with no code sort after coded ones
  if(!tb) return -1;
  return ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
}
function displayName(p){ return (p.variant||'').trim() ? p.name + ' (' + p.variant.trim() + ')' : p.name; }
function byDisplayName(a,b){ return displayName(a).localeCompare(displayName(b)); }
function getProduct(id){ return state.products.find(p=>p.id===id); }
function distinctCategories(){
  return [...new Set(state.products.map(p=>(p.category||'').trim()).filter(Boolean))].sort();
}
function toast(msg, isError){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium text-white max-w-xs ' + (isError ? 'bg-rose-600' : 'bg-slate-900');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3000);
}

async function init(){
  const [products, movements, assets, assetTransfers, locations] = await Promise.all([
    getJSON('products', []),
    getJSON('movements', []),
    getJSON('assets', []),
    getJSON('assetTransfers', []),
    getJSON('locations', null),
  ]);
  state.products = products || [];
  state.movements = movements || [];
  state.assets = assets || [];
  state.assetTransfers = assetTransfers || [];
  if(Array.isArray(locations) && locations.length) LOCATIONS = locations;
  const cfg = getCloudConfig();
  if(cfg) cloudStatus = 'connecting'; // avoid a flash of the app before we know sign-in state
  renderApp();
  if(cfg) initCloudIfConfigured();
}

function renderApp(){
  const cfg = getCloudConfig();
  const needsAuth = !!cfg && cloudStatus !== 'local' && cloudStatus !== 'error';
  const authScreen = document.getElementById('auth-screen');
  const appRoot = document.getElementById('app-root');
  if(needsAuth && !authUser){
    appRoot.classList.add('hidden');
    authScreen.classList.remove('hidden');
    authScreen.classList.add('flex');
    renderAuthScreen();
  } else {
    authScreen.classList.add('hidden');
    authScreen.classList.remove('flex');
    appRoot.classList.remove('hidden');
    if(ui.tab==='admin' && !(authUser && authUser.role==='admin')) ui.tab = 'dashboard';
    if(ui.tab==='locations' && !canManageInventory()) ui.tab = 'dashboard';
    render();
  }
}

function render(){
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id && el_contains_main(activeEl)) ? activeEl.id : null;
  const selStart = (activeId && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
  const selEnd = (activeId && typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null;

  renderNav();
  renderSidebarFoot();
  const el = document.getElementById('main-inner');
  try{
    if(ui.tab==='dashboard') el.innerHTML = viewDashboard();
    else if(ui.tab==='products') el.innerHTML = viewProducts();
    else if(ui.tab==='levels') el.innerHTML = viewStockLevels();
    else if(ui.tab==='movements') el.innerHTML = viewMovements();
    else if(ui.tab==='assets') el.innerHTML = viewAssets();
    else if(ui.tab==='asset-detail') el.innerHTML = viewAssetDetail();
    else if(ui.tab==='asset-transactions') el.innerHTML = viewAssetTransactions();
    else if(ui.tab==='locations') el.innerHTML = viewLocations();
    else if(ui.tab==='admin') el.innerHTML = viewAdmin();
  }catch(e){
    console.error(e);
    el.innerHTML = `<div class="text-center py-16 text-slate-500"><h3 class="text-base font-semibold text-slate-800 mb-1">Something went wrong</h3><p class="text-sm">${esc(e.message)}</p></div>`;
  }
  if(activeId){
    const newEl = document.getElementById(activeId);
    if(newEl && typeof newEl.focus === 'function'){
      newEl.focus();
      if(selStart !== null && typeof newEl.setSelectionRange === 'function'){
        try{ newEl.setSelectionRange(selStart, selEnd); }catch(err){}
      }
    }
  }
  syncStickyOffsets();
}
function el_contains_main(node){
  const main = document.getElementById('main-inner');
  return !!(main && node && main.contains(node));
}
function syncStickyOffsets(){
  requestAnimationFrame(()=>{
    const stackEls = [...document.querySelectorAll('.sticky-toolbar')];
    const theads = document.querySelectorAll('.sticky-thead');
    if(!stackEls.length && !theads.length) return;
    const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
    const mobileHeaderH = isDesktop ? 0 : 56; // h-14 mobile top bar
    let cumulative = 0;
    stackEls.forEach(el=>{
      el.style.top = (isDesktop ? cumulative : mobileHeaderH + cumulative) + 'px';
      cumulative += el.getBoundingClientRect().height;
    });
    const gap = 2; // small buffer so no sliver of the row underneath ever peeks through
    const offsetPx = (isDesktop ? cumulative : mobileHeaderH + cumulative) + gap;
    theads.forEach(t=>{
      [...t.children].forEach(th=>{ th.style.top = offsetPx + 'px'; });
    });
  });
}
window.addEventListener('resize', ()=>{ if(document.querySelector('.sticky-toolbar, .sticky-thead')) syncStickyOffsets(); });
function rerenderMain(){ render(); }

/* =====================================================================
   COMPUTED STATS
===================================================================== */
function qtyAt(p, locId){ return (p.stock && p.stock[locId]) || 0; }
function productTotalQty(p){ return LOCATIONS.reduce((sum,l)=> sum + qtyAt(p, l.id), 0); }
function reorderLevelAt(p, locId){ return (p.reorderLevels && p.reorderLevels[locId]!=null) ? p.reorderLevels[locId] : null; }
function hasPerLocationReorder(p){ return !!(p.reorderLevels && LOCATIONS.some(l=> p.reorderLevels[l.id]!=null)); }
function lowStockLocations(p){
  if(!hasPerLocationReorder(p)) return [];
  return LOCATIONS.filter(l=> reorderLevelAt(p,l.id)!=null && qtyAt(p,l.id) <= reorderLevelAt(p,l.id));
}
function isLowStock(p){
  if(hasPerLocationReorder(p)) return lowStockLocations(p).length > 0;
  return p.reorderLevel!=null && productTotalQty(p) <= p.reorderLevel;
}
function totalUnits(){ return state.products.reduce((s,p)=>s+productTotalQty(p), 0); }
function lowStockProducts(){ return state.products.filter(isLowStock); }
function locationTotalUnits(locId){ return state.products.reduce((s,p)=>s+qtyAt(p, locId), 0); }
function locationTotalItems(locId){ return state.products.filter(p=>qtyAt(p, locId) > 0).length; }
function categoryBreakdown(){
  const map = {};
  state.products.forEach(p=>{
    const cat = (p.category||'').trim() || 'Uncategorized';
    map[cat] = (map[cat]||0) + productTotalQty(p);
  });
  return Object.entries(map).map(([category, units])=>({category, units})).sort((a,b)=>b.units-a.units);
}
function assetCategoryBreakdown(){
  const map = {};
  state.assets.forEach(a=>{
    const cat = (a.category||'').trim() || 'Uncategorized';
    map[cat] = (map[cat]||0) + 1;
  });
  return Object.entries(map).map(([category, count])=>({category, count})).sort((a,b)=>b.count-a.count);
}

===================================================================== */
function viewStockLevels(){
  const valuationLocations = LOCATIONS.filter(l=>l.stockValuation!==false);
  const hiddenCount = LOCATIONS.length - valuationLocations.length;
  const list = [...state.products].sort(byDisplayName);
  const rows = list.map(p=>{
    const total = productTotalQty(p);
    const low = isLowStock(p);
    const cells = valuationLocations.map(l=>{
      const q = qtyAt(p, l.id);
      const rl = reorderLevelAt(p, l.id);
      const cellLow = rl!=null && q <= rl;
      return `<td class="py-3 text-right num${cellLow?' text-amber-700 font-semibold':''}">${q ? fmtNum(q) : '<span class="text-slate-300">—</span>'}${cellLow?' <span class="text-[10px] align-top">●</span>':''}</td>`;
    }).join('');
    return `
      <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
        <td class="px-5 sm:px-6 py-3">
          <div class="font-semibold text-slate-800">${esc(displayName(p))} ${low?'<span class="ml-1.5 inline-flex px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[11px] font-semibold">Low</span>':''}</div>
          <div class="text-[11.5px] text-slate-400">${esc(p.sku||'No SKU')}${p.category?(' · '+esc(p.category)):''}</div>
        </td>
        ${cells}
        <td class="py-3 pr-5 sm:pr-6 text-right num font-bold text-slate-900">${fmtNum(total)}</td>
      </tr>`;
  }).join('');

  return `
    <div class="sticky-toolbar flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Stock Levels</h1>
        <p class="text-sm text-slate-500 mt-0.5">Quantity on hand for every item, by location.${hiddenCount ? ` ${hiddenCount} location${hiddenCount===1?'':'s'} hidden (stock valuation off).` : ''}</p>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200">
      ${list.length ? `
      <div class="w-full">
        <table class="w-full text-sm">
          <thead><tr class="sticky-thead sticky-thead-0 text-left text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
            <th class="px-5 sm:px-6 py-3 font-semibold">Item</th>
            ${valuationLocations.map(l=>`<th class="py-3 font-semibold text-right">${esc(l.code)}</th>`).join('')}
            <th class="py-3 pr-5 sm:pr-6 font-semibold text-right">Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>` : `
      <div class="text-center py-16 px-6">
        <h3 class="text-base font-semibold text-slate-800 mb-1">No items yet</h3>
        <p class="text-sm text-slate-500 max-w-sm mx-auto mb-4">Add items to see stock levels across all ${LOCATIONS.length} location${LOCATIONS.length===1?'':'s'}.</p>
      </div>`}
    </div>
  `;
}

function togglePerLocationReorder(){
  const perLoc = document.getElementById('pf-reorder-perloc-toggle').checked;
  document.getElementById('pf-reorder-total-wrap').classList.toggle('hidden', perLoc);
  document.getElementById('pf-reorder-perloc-wrap').classList.toggle('hidden', !perLoc);
}
function updatePfNamePreview(){
  const name = document.getElementById('pf-name').value.trim();
  const variant = document.getElementById('pf-variant').value.trim();
  document.getElementById('pf-name-preview').textContent = variant ? (name||'—') + ' (' + variant + ')' : (name||'—');
}

function saveProduct(id){
  if(!canManageInventory()){ toast(id ? 'Only admins can edit items.' : 'Only admins can add new items.', true); return; }
  const errEl = document.getElementById('pf-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('pf-name').value.trim();
  if(!name){ errEl.textContent='Item name is required.'; errEl.classList.remove('hidden'); return; }
  const stock = {};
  LOCATIONS.forEach(l=>{ stock[l.id] = Number(document.getElementById('pf-qty-'+l.id).value) || 0; });
  const perLoc = document.getElementById('pf-reorder-perloc-toggle').checked;
  const reorderLevels = {};
  if(perLoc){
    LOCATIONS.forEach(l=>{
      const raw = document.getElementById('pf-reorder-'+l.id).value;
      if(raw !== '') reorderLevels[l.id] = Number(raw) || 0;
    });
  }
  const data = {
    name,
    variant: document.getElementById('pf-variant').value.trim(),
    description: document.getElementById('pf-description').value.trim(),
    sku: document.getElementById('pf-sku').value.trim(),
    category: document.getElementById('pf-category').value.trim(),
    stock,
    reorderLevel: Number(document.getElementById('pf-reorder').value) || 0,
    reorderLevels,
  };
  let savedProduct;
  if(id){
    savedProduct = getProduct(id);
    Object.assign(savedProduct, data);
  } else {
    savedProduct = { id: uid(), ...data, createdAt: nowISO() };
    state.products.push(savedProduct);
  }
  persistItemDoc(savedProduct);
  closeModal();
  toast(id ? 'Item updated.' : 'Item added.');
  rerenderMain();
}

function deleteProduct(id){
  if(!canManageInventory()){ toast('Only admins can delete items.', true); return; }
  confirmAction('Delete this item and its stock movement history? This cannot be undone.', async ()=>{
    const movementsToDelete = state.movements.filter(m=>m.productId===id);
    state.products = state.products.filter(p=>p.id!==id);
    state.movements = state.movements.filter(m=>m.productId!==id);
    await deleteItemDoc(id);
    for(const m of movementsToDelete){ await deleteMovementDoc(m.id); }
    toast('Item deleted.');
    rerenderMain();
  });
}

function locTag(locId){
  const l = getLocation(locId);
  if(!l) return '<span class="text-slate-400">—</span>';
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-medium"><span class="w-1.5 h-1.5 rounded-full" style="background:${l.color}"></span>${esc(l.code)}</span>`;
}
function movementRow(m, compact){
  const p = getProduct(m.productId);
  const badge = m.type==='in'
    ? '<span class="inline-flex px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold">Stock In</span>'
    : '<span class="inline-flex px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 text-xs font-semibold">Stock Out</span>';
  if(compact){
    return `
      <tr class="border-b border-slate-100 last:border-0">
        <td class="px-5 sm:px-6 py-2.5 text-slate-500">${fmtDate(m.date)}</td>
        <td class="py-2.5">${badge}</td>
        <td class="py-2.5 text-slate-700">${p?esc(displayName(p)):'<span class="text-slate-400">Deleted item</span>'}</td>
        <td class="py-2.5">${locTag(m.locationId)}</td>
        <td class="py-2.5 pr-5 sm:pr-6 text-right num font-medium">${m.type==='in'?'+':'-'}${fmtNum(m.quantity)}</td>
      </tr>`;
  }
  return `
    <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
      <td class="px-5 sm:px-6 py-3 text-slate-500">${fmtDate(m.date)}</td>
      <td class="py-3">${badge}</td>
      <td class="py-3 text-slate-700">${p?esc(displayName(p)):'<span class="text-slate-400">Deleted item</span>'}</td>
      <td class="py-3">${locTag(m.locationId)}</td>
      <td class="py-3 text-right num font-medium ${m.type==='in'?'text-emerald-600':'text-rose-600'}">${m.type==='in'?'+':'-'}${fmtNum(m.quantity)}</td>
      <td class="py-3 text-slate-500">${acquisitionLabel(m)}</td>
      <td class="py-3 text-slate-500">${esc(m.reason||'—')}</td>
      <td class="py-3 text-slate-500">${issuedToLabel(m)}</td>
      <td class="py-3 text-slate-500">${esc(m.loggedByName||'—')}</td>
      <td class="py-3 pr-5 sm:pr-6 text-right">${canManageInventory() ? `<button onclick="deleteMovement('${m.id}')" class="text-xs font-semibold text-rose-600 hover:underline">Delete</button>` : ''}</td>
    </tr>`;
}
function acquisitionLabel(m){
  if(m.type!=='in' || !m.acquisition) return '—';
  return esc(m.acquisition);
}
function issuedToLabel(m){
  if(m.type!=='out' || (!m.staffName && !m.department)) return '—';
  if(m.staffName && m.department) return esc(m.staffName) + ' <span class="text-slate-400">· ' + esc(m.department) + '</span>';
  return esc(m.staffName || m.department);
}

function getFilteredMovements(){
  const f = ui.movementsFilter;
  let list = [...state.movements];
  if(f.type) list = list.filter(m=>m.type===f.type);
  if(f.locationId) list = list.filter(m=>m.locationId===f.locationId);
  if(f.acquisition) list = list.filter(m=>m.type==='in' && m.acquisition===f.acquisition);
  if(f.dateFrom) list = list.filter(m=>m.date >= f.dateFrom);
  if(f.dateTo) list = list.filter(m=>m.date <= f.dateTo);
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(m=>{
      const p = getProduct(m.productId);
      return ((p?p.name:'')+' '+(p&&p.variant?p.variant:'')+' '+(m.reason||'')+' '+(m.acquisition||'')+' '+(m.department||'')+' '+(m.staffName||'')).toLowerCase().includes(q);
    });
  }
  return list;
}
const ACQUISITION_TYPES = ['Purchase Order', 'CSR', 'Petty Cash'];
function acquisitionBreakdown(list){
  const map = {};
  ACQUISITION_TYPES.forEach(a=>{ map[a] = 0; });
  list.forEach(m=>{
    if(m.type==='in' && m.acquisition && map.hasOwnProperty(m.acquisition)) map[m.acquisition] += m.quantity;
  });
  return map;
}
function hasActiveMovementFilters(){
  const f = ui.movementsFilter;
  return !!(f.search || f.type || f.locationId || f.acquisition || f.dateFrom || f.dateTo);
}
function clearMovementFilters(){
  ui.movementsFilter = { search:'', type:'', locationId:'', acquisition:'', dateFrom:'', dateTo:'' };
  rerenderMain();
}

function listenToAllProfiles(){
  if(allProfilesUnsub || !firestoreProfilesRef) return;
  allProfilesUnsub = () => {}; // set immediately so a same-tick callback can't cause reentrant re-subscription
  allProfilesUnsub = firestoreProfilesRef.onSnapshot(snap=>{
    state.profiles = snap.docs.map(d=>d.data());
    if(ui.tab==='admin') render();
  }, err=>{
    toast('Could not load the user list — check Firestore rules allow admins to read all profiles.', true);
  });
}

function saveLocation(id){
  if(!canManageInventory()){ toast('Only admins can manage locations.', true); return; }
  const errEl = document.getElementById('lf-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('lf-name').value.trim();
  const code = document.getElementById('lf-code').value.trim().toUpperCase();
  const color = document.getElementById('lf-color').value;
  const address = document.getElementById('lf-address').value.trim();
  const stockValuation = document.getElementById('lf-stock-valuation-no').checked ? false : true;
  if(!name){ errEl.textContent='Location name is required.'; errEl.classList.remove('hidden'); return; }
  if(!code){ errEl.textContent='Short code is required.'; errEl.classList.remove('hidden'); return; }
  const dup = LOCATIONS.find(l=> l.code.toLowerCase()===code.toLowerCase() && l.id!==id);
  if(dup){ errEl.textContent='That code is already used by ' + dup.name + '.'; errEl.classList.remove('hidden'); return; }
  if(id){
    const loc = getLocation(id);
    loc.name = name; loc.code = code; loc.color = color; loc.address = address; loc.stockValuation = stockValuation;
  } else {
    LOCATIONS.push({ id: uid(), name, code, color, address, stockValuation });
  }
  persistLocations();
  closeModal();
  toast(id ? 'Location updated.' : 'Location added.');
  rerenderMain();
}
function deleteLocation(id){
  if(!canManageInventory()){ toast('Only admins can manage locations.', true); return; }
  if(LOCATIONS.length <= 1){ toast('At least one location is required.', true); return; }
  const loc = getLocation(id);
  if(!loc) return;
  const hasStock = state.products.some(p=> qtyAt(p, id) > 0);
  const hasAssets = state.assets.some(a=> a.locationId === id);
  const warning = (hasStock || hasAssets)
    ? `Delete "${loc.name}"? It still has ${hasStock?'stock':''}${hasStock&&hasAssets?' and ':''}${hasAssets?'assets':''} recorded against it — those records will remain but this location will no longer appear as an option.`
    : `Delete "${loc.name}"? This cannot be undone.`;
  confirmAction(warning, ()=>{
    LOCATIONS = LOCATIONS.filter(l=>l.id!==id);
    persistLocations();
    toast('Location deleted.');
    rerenderMain();
  });
}

async function saveUserEdit(uid){
  const errEl = document.getElementById('admin-edit-error');
  errEl.classList.add('hidden');
  const designation = document.getElementById('ae-designation').value.trim();
  const department = document.getElementById('ae-department').value.trim();
  const roleEl = document.getElementById('ae-role');
  const target = state.profiles.find(x=>x.uid===uid);
  const adminCount = state.profiles.filter(x=>x.role==='admin').length;
  if(!roleEl.disabled && target.role==='admin' && roleEl.value==='member' && adminCount<=1){
    errEl.textContent = 'At least one admin is required.'; errEl.classList.remove('hidden'); return;
  }
  try{
    const data = { designation, department };
    if(!roleEl.disabled) data.role = roleEl.value;
    await firestoreProfilesRef.doc(uid).set(data, { merge:true });
    closeModal();
    toast('User updated.');
  }catch(e){
    errEl.textContent = 'Could not save — ' + (e && e.message ? e.message : 'check Firestore permissions.'); errEl.classList.remove('hidden');
  }
}
async function sendPasswordResetForUser(email){
  try{
    await firebaseAuth.sendPasswordResetEmail(email);
    toast('Password reset email sent to ' + email + '.');
  }catch(e){
    toast(friendlyAuthError(e), true);
  }
}

function updateMovementHint(){
  const hint = document.getElementById('mf-hint');
  const pid = document.getElementById('mf-product').value;
  const locId = document.getElementById('mf-location').value;
  const p = getProduct(pid);
  const loc = getLocation(locId);
  if(hint && p && loc) hint.textContent = 'Currently in stock at ' + loc.name + ': ' + fmtNum(qtyAt(p, locId)) + (p.sku ? ' · ' + p.sku : '');
}
function saveMovement(type){
  const errEl = document.getElementById('mf-error');
  errEl.classList.add('hidden');
  const productId = document.getElementById('mf-product').value;
  const locationId = document.getElementById('mf-location').value;
  const qty = Number(document.getElementById('mf-qty').value);
  const date = document.getElementById('mf-date').value;
  const reason = document.getElementById('mf-reason').value.trim();
  const acquisition = type==='in' ? document.getElementById('mf-acquisition').value : '';
  const department = type==='out' ? document.getElementById('mf-department').value.trim() : '';
  const staffName = type==='out' ? document.getElementById('mf-staffname').value.trim() : '';
  const p = getProduct(productId);
  const loc = getLocation(locationId);

  if(!p) { errEl.textContent='Choose an item.'; errEl.classList.remove('hidden'); return; }
  if(!loc) { errEl.textContent='Choose a location.'; errEl.classList.remove('hidden'); return; }
  if(!qty || qty<=0){ errEl.textContent='Enter a quantity greater than zero.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }
  if(type==='in' && !acquisition){ errEl.textContent='Choose how this stock was acquired.'; errEl.classList.remove('hidden'); return; }
  const currentAtLoc = qtyAt(p, locationId);
  if(type==='out' && qty > currentAtLoc){
    errEl.textContent = `Only ${fmtNum(currentAtLoc)} in stock at ${loc.name} — reduce the quantity or log a Stock In first.`;
    errEl.classList.remove('hidden');
    return;
  }

  if(!p.stock) p.stock = {};
  p.stock[locationId] = type==='in' ? currentAtLoc + qty : currentAtLoc - qty;
  const newMovement = {
    id: uid(), type, productId, locationId, quantity: qty, date, reason, acquisition, department, staffName, createdAt: nowISO(),
    loggedByName: authUser ? authUser.name : null,
    loggedByEmail: authUser ? authUser.email : null,
  };
  state.movements.push(newMovement);
  persistItemDoc(p);
  persistMovementDoc(newMovement);
  closeModal();
  toast('Stock movement logged.');
  rerenderMain();
}
function deleteMovement(id){
  if(!canManageInventory()){ toast('Only admins can delete stock movements.', true); return; }
  const m = state.movements.find(x=>x.id===id);
  if(!m) return;
  confirmAction('Delete this movement? The quantity change it made will be reversed.', ()=>{
    const p = getProduct(m.productId);
    if(p && p.stock){
      const cur = qtyAt(p, m.locationId);
      p.stock[m.locationId] = m.type==='in' ? cur - m.quantity : cur + m.quantity;
    }
    state.movements = state.movements.filter(x=>x.id!==id);
    if(p) persistItemDoc(p);
    deleteMovementDoc(id);
    toast('Movement deleted.');
    rerenderMain();
  });
}

function exportAssetTransfersCSV(){
  const f = ui.assetTransactionsFilter;
  const header = ['Date','Asset','Tag','From','To','Department','Assignee','Reason','Handled by'];
  const rows = getFilteredAssetTransactions().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
    const a = getAsset(t.assetId);
    const fromLoc = getLocation(t.fromLocationId);
    const toLoc = getLocation(t.toLocationId);
    return [t.date, a?a.name:'', a?a.tag||'':'', fromLoc?fromLoc.name:'', toLoc?toLoc.name:'', t.toDepartment||'', t.toAssignedTo||'', t.reason||'', t.handledByName||''];
  });
  if(rows.length===0){ toast('No movements match the current filters — nothing to export.', true); return; }
  const rangePart = (f.dateFrom || f.dateTo) ? `_${f.dateFrom||'start'}_to_${f.dateTo||'now'}` : '_' + todayStr();
  downloadCSV('asset_movements' + rangePart + '.csv', header, rows);
}

function handleAssetImageSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please select an image file.', true); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const dataInput = document.getElementById('af-image-data');
      const preview = document.getElementById('af-image-preview');
      const removeBtn = document.getElementById('af-image-remove-btn');
      if(dataInput) dataInput.value = dataUrl;
      if(preview){ preview.src = dataUrl; preview.classList.remove('hidden'); }
      if(removeBtn) removeBtn.classList.remove('hidden');
    };
    img.onerror = function(){ toast('Could not read that image — try a different file.', true); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast('Could not read that image — try a different file.', true); };
  reader.readAsDataURL(file);
}
function removeAssetImage(){
  const dataInput = document.getElementById('af-image-data');
  const preview = document.getElementById('af-image-preview');
  const removeBtn = document.getElementById('af-image-remove-btn');

  if(dataInput) dataInput.value = '';
  if(preview){ preview.src = ''; preview.classList.add('hidden'); }
  if(removeBtn) removeBtn.classList.add('hidden');
  if(fileInput) fileInput.value = '';
}

function saveAsset(id){
  if(id && !canManageInventory()){ toast('Only admins can edit assets.', true); return; }
  const errEl = document.getElementById('af-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('af-name').value.trim();
  const locationId = document.getElementById('af-location').value;
  if(!name){ errEl.textContent='Asset name is required.'; errEl.classList.remove('hidden'); return; }
  if(!locationId){ errEl.textContent='Choose a location.'; errEl.classList.remove('hidden'); return; }
  const data = {
    name,
    tag: document.getElementById('af-tag').value.trim(),
    serialNumber: document.getElementById('af-serial').value.trim(),
    category: document.getElementById('af-category').value.trim(),
    locationId,
    department: document.getElementById('af-department').value.trim(),
    assignedTo: document.getElementById('af-assignedto').value.trim(),
    status: document.getElementById('af-status').value,
    notes: document.getElementById('af-notes').value.trim(),
    image: document.getElementById('af-image-data').value || '',
  };
  let saved;
  if(id){
    saved = getAsset(id);
    Object.assign(saved, data);
  } else {
    saved = { id: uid(), ...data, createdAt: nowISO() };
    state.assets.push(saved);
  }
  persistAssetDoc(saved);
  closeModal();
  toast(id ? 'Asset updated.' : 'Asset added.');
  rerenderMain();
}
function deleteAsset(id){
  if(!canManageInventory()){ toast('Only admins can delete assets.', true); return; }
  confirmAction('Delete this asset and its transfer history? This cannot be undone.', async ()=>{
    const transfersToDelete = state.assetTransfers.filter(t=>t.assetId===id);
    state.assets = state.assets.filter(a=>a.id!==id);
    state.assetTransfers = state.assetTransfers.filter(t=>t.assetId!==id);
    await deleteAssetDoc(id);
    for(const t of transfersToDelete){ await deleteAssetTransferDoc(t.id); }
    toast('Asset deleted.');
    rerenderMain();
  });
}

        <input type="text" id="tf-assignedto" value="${esc(asset.assignedTo||'')}" placeholder="Person's name" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Date *</label>
        <input type="date" id="tf-date" value="${todayStr()}" max="${todayStr()}" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
      </div>
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-600 mb-1.5">Reason / notes</label>
      <input type="text" id="tf-reason" placeholder="e.g. Reassigned to new department" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
    </div>
    <div class="flex justify-end gap-2.5">
      <button class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-50" onclick="closeModal()">Cancel</button>
      <button class="px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700" onclick="saveTransfer('${assetId}')">Log transfer</button>
    </div>
  `;
  openModal('Transfer / Handover', body);
}
function saveTransfer(assetId){
  const errEl = document.getElementById('tf-error');
  errEl.classList.add('hidden');
  const asset = getAsset(assetId);
  if(!asset){ errEl.textContent='Asset not found.'; errEl.classList.remove('hidden'); return; }
  const toLocationId = document.getElementById('tf-location').value;
  const toDepartment = document.getElementById('tf-department').value.trim();
  const toAssignedTo = document.getElementById('tf-assignedto').value.trim();
  const date = document.getElementById('tf-date').value;
  const reason = document.getElementById('tf-reason').value.trim();
  const toLoc = getLocation(toLocationId);
  if(!toLoc){ errEl.textContent='Choose a destination location.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }

  const transfer = {
    id: uid(),
    assetId,
    fromLocationId: asset.locationId, toLocationId,
    fromDepartment: asset.department||'', toDepartment,
    fromAssignedTo: asset.assignedTo||'', toAssignedTo,
    date, reason, createdAt: nowISO(),
    handledByName: authUser ? authUser.name : null,
    handledByEmail: authUser ? authUser.email : null,
  };
  asset.locationId = toLocationId;
  asset.department = toDepartment;
  asset.assignedTo = toAssignedTo;
  state.assetTransfers.push(transfer);
  persistAssetDoc(asset);
  persistAssetTransferDoc(transfer);
  closeModal();
  toast('Transfer logged.');
  rerenderMain();
}

/* =====================================================================
   CSV EXPORT
===================================================================== */
function csvCell(v){
  const s = String(v==null?'':v);
  const nl = String.fromCharCode(10);
  const needsQuote = s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf(nl)>=0;
  return needsQuote ? '"'+s.split('"').join('""')+'"' : s;
}
function downloadCSV(filename, header, rows){
  const lines = [header.join(',')];
  rows.forEach(r=> lines.push(r.map(csvCell).join(',')));
  const blob = new Blob([lines.join(String.fromCharCode(10))], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportProductsCSV(){
  const header = ['SKU','Name','Variant','Description','Category', ...LOCATIONS.map(l=>l.name+' qty'), 'Total qty','Reorder level (total)', ...LOCATIONS.map(l=>l.name+' reorder level'), 'Status'];
  const rows = [...state.products].sort(byDisplayName).map(p=>[
    p.sku||'', p.name, p.variant||'', p.description||'', p.category||'', ...LOCATIONS.map(l=>qtyAt(p,l.id)), productTotalQty(p),
    p.reorderLevel, ...LOCATIONS.map(l=>{ const rl = reorderLevelAt(p,l.id); return rl!=null?rl:''; }), isLowStock(p)?'Low stock':'In stock'
  ]);
  downloadCSV('items_' + todayStr() + '.csv', header, rows);
}
function exportMovementsCSV(){
  const f = ui.movementsFilter;
  const header = ['Date','Type','Item','SKU','Location','Quantity','Acquisition','Reason / reference','Department','Staff name','Logged by'];
  const rows = getFilteredMovements().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>{
    const p = getProduct(m.productId);
    const loc = getLocation(m.locationId);
    return [m.date, m.type==='in'?'Stock In':'Stock Out', p?displayName(p):'', p?p.sku||'':'', loc?loc.name:'', m.quantity, m.acquisition||'', m.reason||'', m.department||'', m.staffName||'', m.loggedByName||''];
  });
  if(rows.length===0){ toast('No movements match the current filters — nothing to export.', true); return; }
  const rangePart = (f.dateFrom || f.dateTo) ? `_${f.dateFrom||'start'}_to_${f.dateTo||'now'}` : '_' + todayStr();
  downloadCSV('stock_movements' + rangePart + '.csv', header, rows);
}
function exportAssetsCSV(){
  const header = ['Tag','Serial Number','Name','Category','Location','Department','Assigned to','Status','Notes'];
  const rows = [...state.assets].sort(byName).map(a=>{
    const loc = getLocation(a.locationId);
    return [a.tag||'', a.serialNumber||'', a.name, a.category||'', loc?loc.name:'', a.department||'', a.assignedTo||'', a.status==='retired'?'Retired':'Active', a.notes||''];
  });
  if(rows.length===0){ toast('No assets to export.', true); return; }
  downloadCSV('assets_' + todayStr() + '.csv', header, rows);
}
