<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  body{ font-family:'Inter', ui-sans-serif, system-ui, sans-serif; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .num{ font-variant-numeric: tabular-nums; }
  .bar-fill{ transition: width .5s ease; }
  @media (min-width: 1024px){
    #sidebar{ position: sticky; top: 0; bottom: auto; align-self: flex-start; height: 100vh; width: 16rem; flex-shrink: 0; }
  }
  .sticky-toolbar{ position: sticky; top: 3.5rem; z-index: 20; background: #f1f5f9; padding-top: 0.5rem; margin-top: -0.5rem; }
  @media (min-width: 1024px){ .sticky-toolbar{ top: 0; } }
  .sticky-toolbar.sticky-toolbar-card{ background: #fff; padding-top: 1rem; margin-top: 0; }
  .sticky-thead th{ position: sticky; top: 3.5rem; z-index: 15; background: #fff; box-shadow: 0 1px 0 0 rgb(241 245 249); }
  @media (min-width: 1024px){ .sticky-thead th{ top: 0; } }

  /* Purchase requisition form: keep the header fields pinned while scrolling a long list of items
     (only where there's room: not on phones or very short windows) */
  /* top offset cancels the modal overlay's own padding (sm:p-6 = 1.5rem) so the block pins flush with the top of the window */
  .pr-sticky-head{ position: sticky; top: -1.5rem; z-index: 20; }
  @media (max-width: 639px), (max-height: 599px){ .pr-sticky-head{ position: static; } }

  /* Purchase requisitions: one long banner per requisition.
     Layout follows the width of the list itself (container query), not the screen:
     wide = a single row, medium = three short rows, narrow = a simple stack. */
  /* Purchase requisitions: the top area (title, buttons, filters, sort) stays pinned while the list scrolls.
     Kept slim: one row for title + buttons, one row for filters + sort. The negative margins make the pinned
     strip run edge to edge across the page's side padding, and the offsets match the layout of the app:
     a fixed 3.5rem top bar below desktop width, none on desktop. Not pinned on phones or very short windows. */
  .pr-page{ container: prpage / inline-size; }
  .pr-top{ position: sticky; top: 3.5rem; z-index: 20; margin: -1rem -1rem 1.25rem; padding: 1rem 1rem .875rem;
           background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
  @media (min-width: 640px){ .pr-top{ margin-left: -1.5rem; margin-right: -1.5rem; padding-left: 1.5rem; padding-right: 1.5rem; } }
  @media (min-width: 1024px){ .pr-top{ top: 0; margin-left: -2.5rem; margin-right: -2.5rem; padding-left: 2.5rem; padding-right: 2.5rem; } }
  @media (max-width: 639px), (max-height: 599px){ .pr-top{ position: static; } }
  html[data-theme="dark"] .pr-top{ background: #0f172a; border-bottom-color: #1e293b; }
  .pr-head{ display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: .875rem; }
  .pr-head-text{ flex: 1 1 0; min-width: 0; }
  .pr-head-actions{ display: flex; gap: .625rem; flex-shrink: 0; }
  .pr-toolbar{ display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .pr-pills{ display: flex; flex-wrap: wrap; gap: .5rem; flex: 1 1 0; min-width: 0; }
  .pr-sort{ display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  @container prpage (max-width: 740px){
    .pr-head{ align-items: center; }
    .pr-head-text p{ display: none; }
    .pr-head-text h1{ font-size: 1.25rem; line-height: 1.75rem; }
    .pr-head-actions{ gap: .5rem; }
    .pr-head-actions > button{ padding: .5rem .75rem; font-size: .8125rem; }
    .pr-pills{ flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .pr-pills::-webkit-scrollbar{ display: none; }
    .pr-pills > button{ flex-shrink: 0; white-space: nowrap; }
    .pr-sort-label{ display: none; }
    .pr-toolbar{ gap: .75rem; }
  }
  @container prpage (max-width: 560px){
    .pr-head{ flex-direction: column; align-items: stretch; gap: .625rem; }
    .pr-head-actions{ width: 100%; }
    .pr-head-actions > button{ flex: 1 1 0; justify-content: center; }
  }
  @container prpage (max-width: 460px){
    .pr-head-actions{ flex-direction: column-reverse; }   /* primary action first, one per row */
  }
  .pr-list{ container: prlist / inline-size; display: flex; flex-direction: column; gap: .75rem; }
  .pr-banner{ position: relative; overflow: hidden; cursor: pointer; min-height: 5.25rem;
              display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 1rem; row-gap: .25rem; align-items: center;
              padding: .875rem 6rem .875rem 1rem; }
  .pr-banner > div{ min-width: 0; }
  .pr-banner .pb-num   { grid-column: 1;     grid-row: 1; }
  .pr-banner .pb-total { grid-column: 2;     grid-row: 1; text-align: right; }
  .pr-banner .pb-items { grid-column: 1 / 3; grid-row: 2; }
  .pr-banner .pb-who   { grid-column: 1;     grid-row: 3; }
  .pr-banner .pb-where { grid-column: 2;     grid-row: 3; text-align: right; }
  .pb-trunc{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-nowrap{ white-space: nowrap; }
  .pr-ribbon{ position: absolute; top: 24px; right: -42px; width: 160px; text-align: center; transform: rotate(45deg);
              padding: 4px 0; font-size: 10px; font-weight: 700; letter-spacing: .025em; text-transform: uppercase;
              box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  @container prlist (min-width: 1020px){
    .pr-banner{ grid-template-columns: 10.5rem minmax(0,1.5fr) minmax(0,1fr) 9rem 10.5rem; column-gap: 1.25rem; }
    .pr-banner .pb-num   { grid-column: 1; grid-row: 1; }
    .pr-banner .pb-items { grid-column: 2; grid-row: 1; }
    .pr-banner .pb-who   { grid-column: 3; grid-row: 1; }
    .pr-banner .pb-where { grid-column: 4; grid-row: 1; text-align: left; }
    .pr-banner .pb-total { grid-column: 5; grid-row: 1; }
  }
  @container prlist (max-width: 540px){
    .pr-banner{ grid-template-columns: minmax(0,1fr); padding-right: 4.5rem; }
    .pr-banner .pb-num, .pr-banner .pb-total, .pr-banner .pb-items, .pr-banner .pb-who, .pr-banner .pb-where{ grid-column: 1; text-align: left; }
    .pr-banner .pb-num{ grid-row: 1; } .pr-banner .pb-total{ grid-row: 2; } .pr-banner .pb-items{ grid-row: 3; }
    .pr-banner .pb-who{ grid-row: 4; } .pr-banner .pb-where{ grid-row: 5; }
    .pr-ribbon{ top: 16px; right: -38px; width: 130px; font-size: 9px; }
  }

  /* Handover form: each item is a card; the Variant column only appears for catalog items */
  /* Handovers list: one roomy banner per handover. The layout follows the width of the list itself:
     wide = items, From and To side by side; medium = items on top, From and To below; narrow = one column. */
  .ho-list{ container: holist / inline-size; display: flex; flex-direction: column; gap: 1rem; }
  .ho-card{ padding: 1.25rem 1.5rem 1.5rem; }
  .ho-card-head{ display: flex; flex-wrap: wrap; align-items: center; gap: .625rem 1.25rem; padding-bottom: 1rem; margin-bottom: 1.125rem; }
  .ho-card-actions{ display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.125rem; margin-left: auto; }
  .ho-card-body{ display: grid; grid-template-columns: minmax(0,1fr); gap: 1.375rem; }
  .ho-card-body > div{ min-width: 0; }
  .ho-label{ margin-bottom: .5rem; }
  .ho-card-body > .ho-col-remarks{ grid-column: 1 / -1; }
  .ho-item-row{ display: flex; flex-wrap: wrap; align-items: baseline; gap: .125rem .5rem; padding: .3125rem 0; }
  @container holist (min-width: 560px){
    .ho-card-body{ grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .ho-card-body > .ho-col-items{ grid-column: 1 / -1; }
  }
  @container holist (min-width: 860px){
    .ho-card-body{ grid-template-columns: minmax(0,1.8fr) minmax(0,1fr) minmax(0,1fr); gap: 2.25rem; }
    .ho-card-body > .ho-col-items{ grid-column: auto; }
  }
  .ho-line-grid{ display: grid; grid-template-columns: minmax(0,1fr) 6rem 1.75rem; gap: .75rem; align-items: end; }
  .ho-line-wrap.has-variant .ho-line-grid{ grid-template-columns: minmax(0,1fr) 11rem 6rem 1.75rem; }
  .ho-line-wrap:not(.has-variant) .ho-variant{ display: none; }
  .ho-line-row2{ display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: .75rem; margin-top: .75rem; }
  .ho-remove{ height: 2.625rem; }
  .ho-item-line{ max-width: 22rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 639px){
    .ho-line-grid, .ho-line-wrap.has-variant .ho-line-grid{ grid-template-columns: minmax(0,1fr) 5rem 1.75rem; }
    .ho-line-grid .ho-item{ grid-column: 1; grid-row: 1; } .ho-line-grid .ho-qty{ grid-column: 2; grid-row: 1; } .ho-line-grid .ho-remove{ grid-column: 3; grid-row: 1; }
    .ho-line-wrap.has-variant .ho-variant{ grid-column: 1 / -1; grid-row: 2; }
    .ho-line-row2{ grid-template-columns: 1fr; }
  }

  /* ---------- Dark mode ---------- */
  html[data-theme="dark"]{ color-scheme: dark; }
  html[data-theme="dark"] body.bg-slate-100{ background-color: #0f172a; }
  html[data-theme="dark"] .bg-slate-100{ background-color: #334155; }
  html[data-theme="dark"] .bg-slate-50{ background-color: #1e293b; }
  html[data-theme="dark"] .bg-white{ background-color: #1e293b; }
  .donut-hole{ fill: #fff; }
  html[data-theme="dark"] .donut-hole{ fill: #1e293b; }
  .chart-gridline{ color: #e2e8f0; }
  html[data-theme="dark"] .chart-gridline{ color: #334155; }
  .chart-axis-label{ fill: #94a3b8; }
  html[data-theme="dark"] .border-slate-100{ border-color: #334155; }
  html[data-theme="dark"] .border-slate-200{ border-color: #334155; }
  html[data-theme="dark"] .border-slate-300{ border-color: #475569; }
  html[data-theme="dark"] .divide-slate-100 > :not([hidden]) ~ :not([hidden]){ border-color: #334155; }
  html[data-theme="dark"] .text-slate-900{ color: #f1f5f9; }
  html[data-theme="dark"] .text-slate-800{ color: #e2e8f0; }
  html[data-theme="dark"] .text-slate-700{ color: #cbd5e1; }
  html[data-theme="dark"] .text-slate-600{ color: #b4c0d3; }
  html[data-theme="dark"] .text-slate-500{ color: #a3b1c6; }
  html[data-theme="dark"] .text-slate-400{ color: #8394ad; }
  html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{ background-color: #0f172a; color: #e2e8f0; }
  html[data-theme="dark"] input::placeholder, html[data-theme="dark"] textarea::placeholder{ color: #7c8ba3; }
  html[data-theme="dark"] .hover\:bg-slate-50:hover{ background-color: #273449; }
  html[data-theme="dark"] .hover\:bg-slate-100:hover{ background-color: #334155; }

  /* Dark-mode readability: colours that were tuned for white backgrounds */
  html[data-theme="dark"] .text-brand-600{ color: #a5b4fc; }
  html[data-theme="dark"] .text-brand-700, html[data-theme="dark"] .text-brand-800{ color: #c7d2fe; }
  html[data-theme="dark"] .text-rose-600{ color: #fb7185; }
  html[data-theme="dark"] .text-rose-700{ color: #fda4af; }
  html[data-theme="dark"] .text-emerald-600{ color: #34d399; }
  html[data-theme="dark"] .text-emerald-700{ color: #6ee7b7; }
  html[data-theme="dark"] .text-amber-700{ color: #fcd34d; }
  html[data-theme="dark"] .text-amber-800{ color: #fde68a; }
  /* tinted boxes/pills become dark translucent tints so their (now light) text stays readable */
  html[data-theme="dark"] .bg-slate-200{ background-color: #334155; }
  html[data-theme="dark"] .bg-slate-50\/50{ background-color: rgba(148,163,184,.07); }
  html[data-theme="dark"] .bg-rose-50{ background-color: rgba(244,63,94,.12); }
  html[data-theme="dark"] .bg-rose-100{ background-color: rgba(244,63,94,.18); }
  html[data-theme="dark"] .bg-amber-50{ background-color: rgba(245,158,11,.12); }
  html[data-theme="dark"] .bg-amber-100{ background-color: rgba(245,158,11,.18); }
  html[data-theme="dark"] .bg-emerald-100{ background-color: rgba(16,185,129,.18); }
  html[data-theme="dark"] .bg-brand-50{ background-color: rgba(99,102,241,.15); }
  /* hover states that would otherwise turn dark-on-dark or flash a light background */
  html[data-theme="dark"] .hover\:text-slate-600:hover{ color: #e2e8f0; }
  html[data-theme="dark"] .hover\:text-slate-700:hover{ color: #f1f5f9; }
  html[data-theme="dark"] .hover\:text-rose-600:hover{ color: #fb7185; }
  html[data-theme="dark"] .hover\:text-brand-600:hover{ color: #c7d2fe; }
  html[data-theme="dark"] .hover\:bg-slate-200:hover{ background-color: #3d4c63; }
  html[data-theme="dark"] .hover\:bg-rose-50:hover{ background-color: rgba(244,63,94,.15); }
  html[data-theme="dark"] .sticky-toolbar{ background-color: #0f172a; }
  html[data-theme="dark"] .sticky-toolbar.sticky-toolbar-card{ background-color: #1e293b; }
  html[data-theme="dark"] .sticky-thead th{ background-color: #1e293b; box-shadow: 0 1px 0 0 #334155; }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{ background:#475569; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
  }
</style>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{ /* non-fatal — app still works without it, just won't offer a full PWA install */ });
    });
  }
</script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

<div class="min-h-screen flex" id="app-root">

  <!-- Mobile top bar -->
  <header class="lg:hidden fixed top-0 inset-x-0 h-14 bg-slate-900 text-white flex items-center justify-between px-4 z-30">
    <button onclick="toggleSidebar(true)" class="p-2 -ml-2 rounded hover:bg-slate-800">
      <svg width="24" height="24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="font-extrabold tracking-tight text-[15px]">FDC Inventory</div>
    <div class="w-6"></div>
  </header>

  <!-- Sidebar backdrop (mobile) -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed lg:sticky lg:top-0 lg:self-start lg:h-screen inset-y-0 left-0 w-64 bg-slate-900 text-slate-200 flex flex-col z-40 -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out">
    <div class="px-6 py-6 border-b border-white/10 flex items-center justify-between">
      <div class="text-lg font-extrabold tracking-tight text-white">FDC Inventory</div>
      <button onclick="toggleTheme()" id="theme-toggle-btn" title="Switch theme" class="w-8 h-8 shrink-0 flex items-center justify-center rounded-lg text-slate-300 hover:bg-white/10 hover:text-white">
        <svg id="theme-icon-sun" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" class="hidden"><circle cx="10" cy="10" r="3.2"/><path stroke-linecap="round" d="M10 2.5v1.8M10 15.7v1.8M17.5 10h-1.8M4.3 10H2.5M15.3 4.7l-1.27 1.27M5.97 14.03L4.7 15.3M15.3 15.3l-1.27-1.27M5.97 5.97L4.7 4.7"/></svg>
        <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 10.8A7.5 7.5 0 0 1 9.2 3 7.5 7.5 0 1 0 17 10.8z"/></svg>
      </button>
    </div>
    <nav id="nav-list" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"></nav>
    <div id="sidebar-foot" class="px-5 py-4 border-t border-white/10"></div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0 pt-14 lg:pt-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-9" id="main-inner"></div>
  </main>
</div>

<!-- Sign-in screen (shown only when cloud sync requires a signed-in user) -->
<div id="auth-screen" class="hidden min-h-screen items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-2xl border border-slate-200 p-7">
    <div class="text-center mb-6">
      <div class="text-lg font-extrabold tracking-tight text-slate-900">FDC Inventory</div>
      <div class="text-xs text-slate-500 mt-1">Individual sign-in, shared database</div>
    </div>
    <div class="flex border border-slate-200 rounded-lg p-1 mb-5 bg-slate-50" id="auth-tabs"></div>
    <div id="auth-body"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 bg-slate-900/50 z-50 hidden items-start justify-center overflow-y-auto p-4 sm:p-6">
  <div id="modal-box" class="modal-box-el bg-white rounded-xl shadow-2xl w-full max-w-lg mt-4 sm:mt-10 mb-10">
    <div class="flex items-center justify-between px-5 sm:px-6 py-4 border-b border-slate-200">
      <h3 id="modal-title" class="text-lg font-bold text-slate-900"></h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none px-1">&times;</button>
    </div>
    <div id="modal-body" class="px-5 sm:px-6 py-5"></div>
  </div>
</div>

<!-- QR scanner (layers on top of the modal rather than replacing it, so in-progress form data is never lost) -->

/* =====================================================================
   STORAGE — saved to this browser's localStorage, so it works fully
   standalone: as a local file, or hosted on your own website.
   Data lives only in the browser/device you're using — it won't sync
   to other devices or follow you if you switch browsers.
===================================================================== */
const STORAGE_PREFIX = 'fdc_inventory_';
const THEME_KEY = STORAGE_PREFIX + 'theme';
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const sun = document.getElementById('theme-icon-sun');
  const moon = document.getElementById('theme-icon-moon');
  if(sun && moon){
    sun.classList.toggle('hidden', theme!=='dark');
    moon.classList.toggle('hidden', theme==='dark');
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme(next);
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(saved);
})();

function hasStorageApi(){
  try{
    const testKey = STORAGE_PREFIX + '__test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}
async function getJSON(key, fallback){
  if(!hasStorageApi()){ markStorageDown('missing'); return fallback; }
  try{
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    markStorageUp();
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback; // missing or corrupt value is treated as empty
  }
}
async function setJSON(key, value){
  if(!hasStorageApi()){ markStorageDown('missing'); return false; }
  try{
    window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    markStorageUp();
    return true;
  }catch(e){
    // Most commonly a full/disabled storage quota (e.g. private browsing) —
    // if this array carries embedded photos, retry once without them rather
    // than giving up (the cloud copy, when connected, still has the images).
    if(Array.isArray(value) && value.some(x=>x && x.image)){
      try{
        const lightened = value.map(x=> x && x.image ? {...x, image:''} : x);
        window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(lightened));
        markStorageUp();
        return true;
      }catch(e2){ /* still too large or storage genuinely unavailable — fall through */ }
    }
    markStorageDown('error');
    return false;
  }
}
// Local cache copies of items/assets never need to carry embedded photos:
// once cloud sync is on, Firestore holds the authoritative copy with images,
// and this local copy is only a resilience fallback. Photos are by far the
// biggest thing pushing these arrays past the browser's local storage quota,
// so we strip them here proactively (rather than only after a write fails).
function stripImagesForLocalCache(list){
  return list.map(x=> x && x.image ? {...x, image:''} : x);
}
/* =====================================================================
   CLOUD SYNC SAFETY — never lose records that exist only on this device.
   A record counts as "synced" once the cloud has confirmed it (it arrived in a
   snapshot, or our write was acknowledged). Anything else is kept when the cloud
   answers with a shorter list, and can be uploaded with one click.
===================================================================== */
const SYNC_GUARDED = {
  itemTransfers:        { one:'item transfer',        label:'item transfers',        collection:'fdc_inventory_item_transfers',        ref:()=>firestoreItemTransfersRef,        listen:()=>listenToCloudItemTransfers() },
  purchaseRequisitions: { one:'purchase requisition', label:'purchase requisitions', collection:'fdc_inventory_purchase_requisitions', ref:()=>firestorePurchaseRequisitionsRef, listen:()=>listenToCloudPurchaseRequisitions() },
  handovers:            { one:'handover',             label:'handovers',             collection:'fdc_inventory_handovers',             ref:()=>firestoreHandoversRef,            listen:()=>listenToCloudHandovers() },
};
const UNSYNCED_GRACE_MS = 15000; // a record saved a moment ago may still be on its way to the cloud
const syncedIdSets = {};
const syncListenerStatus = {};   // key -> 'ok' | 'error' (set once the cloud has answered, either way)
function syncedIds(key){
  if(!syncedIdSets[key]){
    let arr = [];
    try{ arr = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'synced_' + key) || '[]'); }catch(e){}
    syncedIdSets[key] = new Set(Array.isArray(arr) ? arr : []);
  }
  return syncedIdSets[key];
}
function persistSyncedIds(key){
  try{ localStorage.setItem(STORAGE_PREFIX + 'synced_' + key, JSON.stringify([...syncedIds(key)])); }catch(e){}
}
function markSynced(key, id){ const s = syncedIds(key); if(!s.has(id)){ s.add(id); persistSyncedIds(key); } }
function forgetSynced(key, id){ const s = syncedIds(key); if(s.delete(id)) persistSyncedIds(key); }
function resetSyncTracking(){
  Object.keys(SYNC_GUARDED).forEach(k=>{
    delete syncedIdSets[k]; delete syncListenerStatus[k];
    try{ localStorage.removeItem(STORAGE_PREFIX + 'synced_' + k); }catch(e){}
  });
}
function applyCloudSnapshot(key, snap){
  const cloud = snap.docs.map(d=>d.data());
  const cloudIds = new Set(cloud.map(r=>r.id));
  const known = syncedIds(key);
  // never confirmed by the cloud and not in it now: it only exists here, so keep it
  const localOnly = (state[key]||[]).filter(r => r && r.id && !cloudIds.has(r.id) && !known.has(r.id));
  // confirmed before but gone now: it was deleted elsewhere
  [...known].forEach(id => { if(!cloudIds.has(id)) known.delete(id); });
  snap.docs.forEach(d => { if(!(d.metadata && d.metadata.hasPendingWrites)) known.add(d.data().id); });
  persistSyncedIds(key);
  state[key] = cloud.concat(localOnly);
  setJSON(key, state[key]);
  syncListenerStatus[key] = 'ok';
}
function syncListenerError(key, err){
  syncListenerStatus[key] = 'error';
  handleCloudSyncError(err, SYNC_GUARDED[key].label);
}
function unsyncedRecords(key, opts){
  const known = syncedIds(key);
  const now = Date.now();
  return (state[key]||[]).filter(r=>{
    if(!r || !r.id || known.has(r.id)) return false;
    if(opts && opts.ignoreGrace) return true;
    const t = r.createdAt ? Date.parse(r.createdAt) : NaN;
    return !(t && now - t < UNSYNCED_GRACE_MS);
  });
}
function unsyncedSummary(opts){
  const parts = [];
  if(firestoreDb && authUser){
    Object.keys(SYNC_GUARDED).forEach(key=>{
      if(!syncListenerStatus[key]) return;   // wait for the cloud's first answer before judging
      const n = unsyncedRecords(key, opts).length;
      if(n) parts.push({ key, count:n, text: n + ' ' + (n===1 ? SYNC_GUARDED[key].one : SYNC_GUARDED[key].label) });
    });
  }
  return { total: parts.reduce((s,p)=>s+p.count, 0), parts };
}
function unsyncedBannerHtml(){
  const s = unsyncedSummary();
  if(!s.total) return '';
  return `
    <div class="bg-amber-50 text-amber-800 rounded-xl px-4 py-3 mb-5 flex items-center justify-between gap-3 flex-wrap">
      <div class="text-sm leading-relaxed">Saved only on this device, not in the cloud yet: <span class="font-bold">${esc(s.parts.map(p=>p.text).join(', '))}</span>. Other devices can't see them, and signing out would remove them from this device.</div>
      <button id="unsynced-upload-btn" onclick="uploadUnsyncedToCloud()" class="shrink-0 px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700">Upload to cloud</button>
    </div>`;
}
let uploadingUnsynced = false;
async function uploadUnsyncedToCloud(){
  if(uploadingUnsynced) return;
  if(!firestoreDb){ toast('Cloud sync is not connected.', true); return; }
  uploadingUnsynced = true;
  const btn = document.getElementById('unsynced-upload-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Uploading…'; }
  let uploaded = 0, failure = null;
  const touched = [];
  try{
    for(const key of Object.keys(SYNC_GUARDED)){
      const cfg = SYNC_GUARDED[key];
      const ref = cfg.ref();
      if(!ref) continue;
      const pending = unsyncedRecords(key, { ignoreGrace:true });
      for(let i = 0; i < pending.length; i += 200){
        const chunk = pending.slice(i, i + 200);
        const batch = firestoreDb.batch();
        chunk.forEach(r => batch.set(ref.doc(r.id), r));
        try{ await batch.commit(); }
        catch(e){ failure = { e, cfg }; break; }
        chunk.forEach(r => markSynced(key, r.id));
        uploaded += chunk.length;
        if(!touched.includes(key)) touched.push(key);
      }
      if(failure) break;
    }
  } finally { uploadingUnsynced = false; }
  // a listener that was blocked earlier stays dead until re-attached
  touched.forEach(key => { try{ SYNC_GUARDED[key].listen(); }catch(e){} });
  if(failure) toast(syncErrorMessage(failure.e, failure.cfg.collection, 'save'), true);
  else toast(uploaded ? `Uploaded ${fmtNum(uploaded)} record${uploaded===1?'':'s'} to the cloud.` : 'Everything is already in the cloud.');
  renderApp();
}
function scheduleUnsyncedCheck(){ setTimeout(()=>{ try{ renderApp(); }catch(e){} }, UNSYNCED_GRACE_MS + 500); }

function syncErrorMessage(e, collectionName, action){
  const isPermissionError = e && (e.code==='permission-denied' || (e.message||'').toLowerCase().includes('permission'));
  const verb = action==='delete' ? 'Deleted' : 'Saved';
  if(isPermissionError){
    return `${verb} locally, but Firestore rules are blocking sync for ${collectionName} — check Firestore Database → Rules covers this collection.`;
  }
  return `${verb} locally, but could not sync to the cloud right now${e && e.message ? (': ' + e.message) : ''}.`;
}

let storageDown = false;
function markStorageDown(reason){
  const wasDown = storageDown;
  storageDown = true;
  renderStorageBanner(reason);
  if(!wasDown) toast('Changes are not being saved — see the notice at the top of the page.', true);
}
function markStorageUp(){
  if(storageDown){ storageDown = false; toast('Saving is working again.'); }
  const el = document.getElementById('storage-banner');
  if(el) el.remove();
  document.body.classList.remove('has-banner');
}
function renderStorageBanner(reason){
  document.body.classList.add('has-banner');
  let el = document.getElementById('storage-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'storage-banner';
    el.className = 'fixed top-0 inset-x-0 z-[70] bg-rose-600 text-white text-[13px] px-4 py-2.5 flex flex-wrap items-center justify-center gap-3 text-center';
    document.body.prepend(el);
  }
  const msg = reason === 'missing'
    ? "Your browser is blocking local storage here (common in private/incognito windows, or with strict cookie settings). Allow site data for this page, or open it in a normal browser window."
    : "Your browser couldn't save that change — storage may be full or disabled. Try clearing space or checking your browser's privacy settings.";
  el.innerHTML = '<span><b class="font-bold">Not saving.</b> ' + msg + '</span>' +
    '<button class="bg-white/20 hover:bg-white/30 rounded px-2.5 py-1 text-xs font-semibold shrink-0" onclick="this.parentElement.remove(); document.body.classList.remove(\'has-banner\');">Dismiss</button>';
}

/* =====================================================================
   CLOUD SYNC — optional. Off by default (data stays local-only, no
   sign-in). Once connected to a Firebase project, each person signs in
   with their own account, and their inventory syncs across their own
   devices. Data is private per account — it is never shared between
   different people's accounts.
   We never see or store anyone's credentials — the config and session
   live only in the browser, managed by Firebase itself.
===================================================================== */

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();

function getCloudConfig(){ try{ const raw = localStorage.getItem(CLOUD_CONFIG_KEY); if(raw) return JSON.parse(raw); return { firebaseConfig: DEFAULT_FIREBASE_CONFIG }; }catch(e){ return { firebaseConfig: DEFAULT_FIREBASE_CONFIG }; } }
function setCloudConfig(cfg){

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector('script[data-src="'+src+'"]')){ resolve(true); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.setAttribute('data-src', src);
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error('Could not load the cloud sync library. Check your connection.'));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  if(window.firebase && window.firebase.firestore && window.firebase.auth) return true;
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js');
  if(!window.firebase) throw new Error('Cloud sync library did not load.');
  return true;
}

function parseFirebaseConfigInput(text){
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1 || end===-1 || end<start) throw new Error('Paste the full Firebase config object, including the { }.');
  const objText = text.slice(start, end+1);
  let obj;
  try{ obj = JSON.parse(objText); }
  catch(e){
    try{ obj = Function('"use strict"; return (' + objText + ');')(); }
    catch(e2){ throw new Error('Could not read that config. Paste it exactly as copied from Firebase.'); }
  }
  if(!obj || !obj.apiKey || !obj.projectId) throw new Error('That config is missing apiKey or projectId — copy the whole object from Firebase.');
  return obj;
}

}

async function initCloudIfConfigured(){
  const cfg = getCloudConfig();
  if(!cfg){ cloudStatus = 'local'; authUser = null; renderApp(); return; }
  cloudStatus = 'connecting';
  renderApp();
  try{
    await ensureFirebase();
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg.firebaseConfig);
    firestoreDb = firebase.firestore();
    firestoreProfilesRef = firestoreDb.collection('fdc_inventory_profiles');
    firebaseAuth = firebase.auth();
    firebaseAuth.onAuthStateChanged(user=>{
      if(user){
        isUserBlocked(user.uid).then(blocked=>{
          if(blocked){
            firebaseAuth.signOut();
            toast('Your access has been revoked. Contact an administrator.', true);
          }
        });
        const pendingExtra = pendingSignupExtra; pendingSignupExtra = null;
        authUser = {
          uid:user.uid, email:user.email,
          name: (pendingExtra && pendingExtra.name) || user.displayName || user.email,
          role:'member',
          designation: (pendingExtra && pendingExtra.designation) || '',
          department: (pendingExtra && pendingExtra.department) || '',
        };

function reorderLevelAtForNotify(p, locId){
  if(p.reorderLevels && p.reorderLevels[locId]!=null && p.reorderLevels[locId]!=='') return Number(p.reorderLevels[locId]);
  return Number(p.reorderLevel)||0;
}
function recipientsForLocation(loc){
  if(loc && loc.custodianUid){
    const custodianProfile = state.profiles.find(pr=>pr.uid===loc.custodianUid);
    if(custodianProfile && custodianProfile.email) return custodianProfile.email;
  }
  return notificationSettings.recipients || '';
}
async function checkLowStockAndNotify(product, locationId){
  if(!notificationSettings.enabled || !notificationSettings.serviceId || !notificationSettings.templateId || !notificationSettings.publicKey || !notificationSettings.recipients) return;
  if(typeof emailjs === 'undefined'){
    try{ await loadScriptOnce('https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js'); }
    catch(e){ return; } // best-effort notification — fail silently if offline
  }
  const loc = getLocation(locationId);
  if(!product || !loc) return;
  const qty = qtyAt(product, locationId);
  const threshold = reorderLevelAtForNotify(product, locationId);
  const key = product.id + '::' + locationId;
  const isLow = qty <= threshold;
  if(!isLow){
    notifiedLowStockKeys.delete(key); // back above threshold — allow a fresh notification if it dips again later
    return;
  }
  if(notifiedLowStockKeys.has(key)) return; // already notified for this ongoing low-stock condition
  notifiedLowStockKeys.add(key);
  try{
    await emailjs.send(notificationSettings.serviceId, notificationSettings.templateId, {
      to_email: recipientsForLocation(loc),
      item_name: displayName(product),
      sku: product.sku || '—',
      location_name: loc.name,
      current_qty: fmtNum(qty),
      reorder_level: fmtNum(threshold),
    }, { publicKey: notificationSettings.publicKey });
  }catch(e){
    notifiedLowStockKeys.delete(key); // allow a retry on the next relevant save, rather than silently giving up forever
  }
}
function moveLocation(id, direction){
  if(!canManageInventory()){ toast('Only admins can reorder locations.', true); return; }
  const idx = LOCATIONS.findIndex(l=>l.id===id);
  if(idx===-1) return;
  const swapWith = direction==='up' ? idx-1 : idx+1;
  if(swapWith<0 || swapWith>=LOCATIONS.length) return;
  const tmp = LOCATIONS[idx];
  LOCATIONS[idx] = LOCATIONS[swapWith];
  LOCATIONS[swapWith] = tmp;
  persistLocations();
  rerenderMain();
}

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'An account with this email already exists — sign in instead.';
  if(code.includes('invalid-email')) return 'Enter a valid email address.';
  if(code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('network-request-failed')) return 'Network error — check your connection and try again.';
  if(code.includes('operation-not-allowed')) return 'Email/Password sign-in isn’t turned on for this Firebase project yet. In the Firebase console, go to Authentication → Sign-in method and enable Email/Password.';
  if(code.includes('configuration-not-found')) return 'Authentication hasn’t been set up for this Firebase project yet. In the Firebase console, go to Authentication and click "Get started" first, then enable Email/Password under Sign-in method.';
  return (e && e.message) || 'Something went wrong. Please try again.';
}

async function saveProfileName(){

async function changeOwnPassword(){
  const errEl = document.getElementById('profile-error');
  errEl.classList.add('hidden');
  const current = document.getElementById('prof-current-pw').value;
  const next = document.getElementById('prof-new-pw').value;
  const next2 = document.getElementById('prof-new-pw2').value;
  if(!current || !next){ errEl.textContent='Enter your current and new password.'; errEl.classList.remove('hidden'); return; }
  if(next.length < 6){ errEl.textContent='New password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }

    const user = firebaseAuth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(authUser.email, current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(next);
    closeModal();
    toast('Password updated.');
  }catch(e){
    errEl.textContent = friendlyAuthError(e); errEl.classList.remove('hidden');
  }

function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
const loadedScripts = {};
function loadScriptOnce(src){
  if(loadedScripts[src]) return loadedScripts[src];
  loadedScripts[src] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>{ delete loadedScripts[src]; reject(new Error('Failed to load '+src)); };
    document.head.appendChild(s);
  });
  return loadedScripts[src];
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function byName(a,b){ return (a.name||'').localeCompare(b.name||''); }
function byTag(a,b){
  const ta = (a.tag||'').trim(), tb = (b.tag||'').trim();
  if(!ta && !tb) return byName(a,b);
  if(!ta) return 1;  // items with no code sort after coded ones
  if(!tb) return -1;
  return ta.localeCompare(tb, undefined, { numeric: true, sensitivity: 'base' });
}

// While a form has a pinned header, keep that much clear at the top when the browser scrolls to a field
// (otherwise a field that is only partly visible can sit hidden underneath the header).
let modalHeadObserver = null;
function syncModalScrollPadding(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  const head = overlay.querySelector('.pr-sticky-head');
  overlay.style.scrollPaddingTop = (head && getComputedStyle(head).position === 'sticky') ? (head.offsetHeight + 12) + 'px' : '';
}
function watchModalStickyHead(){
  syncModalScrollPadding();
  const head = document.querySelector('#modal-overlay .pr-sticky-head');
  if(head && window.ResizeObserver){ modalHeadObserver = new ResizeObserver(syncModalScrollPadding); modalHeadObserver.observe(head); }
}
function stopModalScrollPadding(){
  if(modalHeadObserver){ modalHeadObserver.disconnect(); modalHeadObserver = null; }
  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.style.scrollPaddingTop = '';
}
window.addEventListener('resize', syncModalScrollPadding);

function openModal(title, bodyHtml, wide){
  const overlay = document.getElementById('modal-overlay');
  const titleEl = document.getElementById('modal-title');
  // A dialog opened from scratch, or one replacing a different dialog, always starts at the top.
  // (Re-rendering the same dialog in place keeps its position.)
  const sameDialog = !overlay.classList.contains('hidden') && titleEl.textContent === title;
  stopModalScrollPadding();
  titleEl.textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-box').classList.toggle('max-w-lg', !wide);
  document.getElementById('modal-box').classList.toggle('max-w-2xl', !!wide);
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  if(!sameDialog) overlay.scrollTop = 0;
}
function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  overlay.scrollTop = 0;            // the next dialog must not inherit this one's scroll position
  stopModalScrollPadding();
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
  document.getElementById('modal-body').innerHTML = '';
}
document.addEventListener('keydown', (e)=>{
  const overlay = document.getElementById('modal-overlay');
  if(overlay.classList.contains('hidden')) return;
  if(e.key === 'Enter'){
    const confirmBtn = document.getElementById('confirm-yes-btn');
    if(confirmBtn){
      // Don't intercept Enter while the user is typing in a textarea (multi-line input) inside the modal
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if(tag === 'TEXTAREA') return;
      e.preventDefault();
      confirmBtn.click();
    }
  } else if(e.key === 'Escape'){

  }
});

let assetCodeBackfillDone = false;
function backfillDepartmentAssetCodes(){
  if(assetCodeBackfillDone) return;
  if(!canManageInventory()) return; // only an admin session persists this, avoiding permission errors and duplicate work across sessions
  const missing = state.assets.filter(a=>!a.departmentAssetCode);
  if(!missing.length){ assetCodeBackfillDone = true; return; }
  missing.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||'') || (a.name||'').localeCompare(b.name||''));
  let next = 0;
  state.assets.forEach(a=>{
    const match = (a.departmentAssetCode||'').match(/^AD-(\d+)$/);
    if(match){ const n = parseInt(match[1], 10); if(n > next) next = n; }
  });
  missing.forEach(a=>{
    next += 1;
    a.departmentAssetCode = 'AD-' + String(next).padStart(4, '0');
    persistAssetDoc(a);
  });
  assetCodeBackfillDone = true;
}

      } else {

function el_contains_main(node){

function syncStickyOffsets(){
  requestAnimationFrame(()=>{
    const stackEls = [...document.querySelectorAll('.sticky-toolbar')];
    const theads = document.querySelectorAll('.sticky-thead');
    if(!stackEls.length && !theads.length) return;
    const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
    const mobileHeaderH = isDesktop ? 0 : 56; // h-14 mobile top bar
    let cumulative = 0;
    stackEls.forEach(el=>{
      el.style.top = (isDesktop ? cumulative : mobileHeaderH + cumulative) + 'px';
      cumulative += el.getBoundingClientRect().height;
    });
    const gap = 2; // small buffer so no sliver of the row underneath ever peeks through
    const offsetPx = (isDesktop ? cumulative : mobileHeaderH + cumulative) + gap;
    theads.forEach(t=>{
      [...t.children].forEach(th=>{ th.style.top = offsetPx + 'px'; });
    });
  });
}

function refreshTransferToOptions(){

function saveItemTransfer(){
  const errEl = document.getElementById('xf-error');
  errEl.classList.add('hidden');
  const fromLocationId = document.getElementById('xf-from').value;
  const toLocationId = document.getElementById('xf-to').value;
  const date = document.getElementById('xf-date').value;
  const reason = document.getElementById('xf-reason').value.trim();
  const fromLoc = getLocation(fromLocationId), toLoc = getLocation(toLocationId);
  if(!fromLoc || !toLoc){ errEl.textContent='Choose both a source and destination location.'; errEl.classList.remove('hidden'); return; }
  if(fromLocationId===toLocationId){ errEl.textContent='Source and destination must be different locations.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }

  const lineEls = [...document.querySelectorAll('.mf-line-wrap')];
  const lines = [];
  for(const lineEl of lineEls){
    const idx = lineEl.dataset.line;
    const productId = document.getElementById('mf-product-'+idx).value;
    const qty = Number(document.getElementById('mf-qty-'+idx).value);
    const p = getProduct(productId);
    if(!p){ errEl.textContent='Choose an item for every row.'; errEl.classList.remove('hidden'); return; }
    if(!qty || qty<=0){ errEl.textContent = `Enter a quantity greater than zero for ${displayName(p)}.`; errEl.classList.remove('hidden'); return; }
    lines.push({ p, qty });
  }
  if(!lines.length){ errEl.textContent='Add at least one item.'; errEl.classList.remove('hidden'); return; }

  const totalsByProduct = {};
  lines.forEach(({p, qty})=>{ totalsByProduct[p.id] = (totalsByProduct[p.id]||0) + qty; });
  for(const pid of Object.keys(totalsByProduct)){
    const p = getProduct(pid);
    const available = qtyAt(p, fromLocationId);
    if(totalsByProduct[pid] > available){
      errEl.textContent = `Only ${fmtNum(available)} of ${displayName(p)} in stock at ${fromLoc.name}.`;
      errEl.classList.remove('hidden');
      return;
    }
  }

  const touchedProducts = new Map();
  const createdTransfers = [];
  lines.forEach(({p, qty})=>{
    const available = qtyAt(p, fromLocationId);
    if(!p.stock) p.stock = {};
    p.stock[fromLocationId] = available - qty; // leaves the source immediately; destination only credited on acceptance
    const transfer = {
      id: uid(), productId: p.id, fromLocationId, toLocationId, quantity: qty, date, reason,
      status: 'pending',
      initiatedByName: authUser ? authUser.name : null,
      initiatedByEmail: authUser ? authUser.email : null,
      createdAt: nowISO(),
    };
    state.itemTransfers.push(transfer);
    createdTransfers.push(transfer);
    touchedProducts.set(p.id, p);
  });
  touchedProducts.forEach(p=>persistItemDoc(p));
  createdTransfers.forEach(t=>persistItemTransferDoc(t));
  closeModal();
  toast(`Transfer sent — awaiting acceptance at ${toLoc.name}.`);
  rerenderMain();
}
function acceptItemTransfer(transferId){
  const t = state.itemTransfers.find(x=>x.id===transferId);
  if(!t || t.status!=='pending') return;
  if(!canAcceptTransferForLocation(t.toLocationId)){ toast("Only that location's custodian (or an admin) can accept this transfer.", true); return; }
  const p = getProduct(t.productId);
  if(!p){ toast('That item no longer exists.', true); return; }
  if(!p.stock) p.stock = {};
  p.stock[t.toLocationId] = qtyAt(p, t.toLocationId) + t.quantity;
  t.status = 'accepted';
  t.respondedByName = authUser ? authUser.name : null;
  t.respondedByEmail = authUser ? authUser.email : null;
  t.respondedAt = nowISO();
  persistItemDoc(p);
  persistItemTransferDoc(t);
  toast('Transfer accepted — stock added to this location.');
  rerenderMain();
}
function rejectItemTransfer(transferId){
  const t = state.itemTransfers.find(x=>x.id===transferId);
  if(!t || t.status!=='pending') return;
  if(!canAcceptTransferForLocation(t.toLocationId)){ toast("Only that location's custodian (or an admin) can respond to this transfer.", true); return; }
  confirmAction('Reject this transfer? The stock will be returned to the source location.', ()=>{
    const p = getProduct(t.productId);
    if(p){
      if(!p.stock) p.stock = {};
      p.stock[t.fromLocationId] = qtyAt(p, t.fromLocationId) + t.quantity;
      persistItemDoc(p);
    }
    t.status = 'rejected';
    t.respondedByName = authUser ? authUser.name : null;
    t.respondedByEmail = authUser ? authUser.email : null;
    t.respondedAt = nowISO();
    persistItemTransferDoc(t);
    toast('Transfer rejected — stock returned to the source location.');
    rerenderMain();
  });
}
function acquisitionBalance(productId, acquisition, excludeMovementId){
  if(!acquisition) return Infinity; // nothing to check against if no acquisition type is chosen yet
  let inQty = 0, outQty = 0;
  state.movements.forEach(m=>{
    if(m.productId!==productId || m.acquisition!==acquisition) return;
    if(excludeMovementId && m.id===excludeMovementId) return;
    if(m.type==='in') inQty += (Number(m.quantity)||0);
    else if(m.type==='out') outQty += (Number(m.quantity)||0);
  });
  return inQty - outQty;
}
function productTotalQty(p){ return LOCATIONS.reduce((sum,l)=> sum + qtyAt(p, l.id), 0); }
function reorderLevelAt(p, locId){ return (p.reorderLevels && p.reorderLevels[locId]!=null) ? p.reorderLevels[locId] : null; }
function hasPerLocationReorder(p){ return !!(p.reorderLevels && LOCATIONS.some(l=> p.reorderLevels[l.id]!=null)); }
function lowStockLocations(p){
  if(!hasPerLocationReorder(p)) return [];
  return LOCATIONS.filter(l=> reorderLevelAt(p,l.id)!=null && qtyAt(p,l.id) <= reorderLevelAt(p,l.id));
}
function isLowStock(p){
  if(hasPerLocationReorder(p)) return lowStockLocations(p).length > 0;
  return p.reorderLevel!=null && productTotalQty(p) <= p.reorderLevel;
}
function totalUnits(){ return state.products.reduce((s,p)=>s+productTotalQty(p), 0); }
function lowStockProducts(){ return state.products.filter(isLowStock); }
function locationTotalUnits(locId){ return state.products.reduce((s,p)=>s+qtyAt(p, locId), 0); }

function categoryBreakdown(){
  const map = {};
  state.products.forEach(p=>{
    const cat = (p.category||'').trim() || 'Uncategorized';
    map[cat] = (map[cat]||0) + productTotalQty(p);
  });
  return Object.entries(map).map(([category, units])=>({category, units})).sort((a,b)=>b.units-a.units);
}
function assetCategoryBreakdown(){
  const map = {};
  state.assets.forEach(a=>{
    const cat = (a.category||'').trim() || 'Uncategorized';
    map[cat] = (map[cat]||0) + 1;
  });
  return Object.entries(map).map(([category, count])=>({category, count})).sort((a,b)=>b.count-a.count);
}
function movementsByLocation(productId){
  const map = {};
  state.movements.forEach(m=>{
    if(m.productId!==productId) return;
    if(!map[m.locationId]) map[m.locationId] = { inQty: 0, outQty: 0 };
    if(m.type==='in') map[m.locationId].inQty += (Number(m.quantity)||0);
    else if(m.type==='out') map[m.locationId].outQty += (Number(m.quantity)||0);
  });
  return Object.entries(map)
    .map(([locationId, v])=>({ location: getLocation(locationId), inQty: v.inQty, outQty: v.outQty }))
    .filter(e=>e.inQty>0 || e.outQty>0)
    .sort((a,b)=> (b.inQty+b.outQty) - (a.inQty+a.outQty));
}
function donutChartSvg(segments, colors, size){
  size = size || 160;
  const r = size/2 - 10, cx = size/2, cy = size/2, circumference = 2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value, 0);
  if(total<=0) return '';
  let offset = 0;
  const circles = segments.map((seg,i)=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const gap = circumference - dash;
    const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="18" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += dash;
    return circle;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${circles}<circle cx="${cx}" cy="${cy}" r="${r-9}" class="donut-hole"></circle></svg>`;
}
function monthlyCostSeries(productId, year){
  const p = getProduct(productId);
  const unitCost = p ? (Number(p.estimatedCost)||0) : 0;
  const purchaseCost = new Array(12).fill(0);
  const consumptionCost = new Array(12).fill(0);
  state.movements.forEach(m=>{
    if(m.productId!==productId) return;
    if(!m.date || m.date.slice(0,4) !== String(year)) return;
    const monthIdx = Number(m.date.slice(5,7)) - 1;
    if(monthIdx<0 || monthIdx>11) return;
    const cost = (Number(m.quantity)||0) * unitCost;
    if(m.type==='in') purchaseCost[monthIdx] += cost;
    else if(m.type==='out') consumptionCost[monthIdx] += cost;
  });
  return { purchaseCost, consumptionCost };
}
function lineChartSvg(series, labels, width, height){
  width = width || 640; height = height || 220;
  const padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const n = labels.length;
  const maxY = Math.max(1, ...series.flatMap(s=>s.values));
  const niceMax = maxY <= 0 ? 1 : Math.pow(10, Math.ceil(Math.log10(maxY))) ;
  const yMax = maxY / niceMax > 0.5 ? niceMax : niceMax/2 || niceMax;
  const xAt = i => padL + (n<=1 ? 0 : (i/(n-1))*plotW);
  const yAt = v => padT + plotH - (Math.min(v,yMax)/yMax)*plotH;
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    const val = f*yMax;
    return `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="currentColor" class="chart-gridline" stroke-width="1"></line>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" class="chart-axis-label">${fmtNum(val)}</text>`;
  }).join('');
  const xLabels = labels.map((lab,i)=>`<text x="${xAt(i)}" y="${height-8}" text-anchor="middle" font-size="10" class="chart-axis-label">${esc(lab)}</text>`).join('');
  const lines = series.map(s=>{
    const pts = s.values.map((v,i)=>`${xAt(i)},${yAt(v)}`).join(' ');
    const dots = s.values.map((v,i)=>`<circle cx="${xAt(i)}" cy="${yAt(v)}" r="3" fill="${s.color}"></circle>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="xMinYMid meet">${gridLines}${lines}${xLabels}</svg>`;
}

function statCard(label, value, sub, color){
  const accents = { brand:'border-l-brand-500', emerald:'border-l-emerald-500', amber:'border-l-amber-500', slate:'border-l-slate-300' };
  return `
    <div class="bg-white rounded-xl border border-slate-200 border-l-4 ${accents[color]||accents.slate} p-5">
      <div class="text-xs font-medium text-slate-500">${label}</div>
      <div class="text-[26px] font-extrabold text-slate-900 mt-1 num">${value}</div>
      <div class="text-[11.5px] text-slate-400 mt-1">${sub}</div>
    </div>
  `;
}

/* =====================================================================
   VIEW: STOCK LEVELS
===================================================================== */
function viewStockLevels(){
  const valuationLocations = LOCATIONS.filter(l=>l.stockValuation!==false);
  const hiddenCount = LOCATIONS.length - valuationLocations.length;
  const list = [...state.products].sort(byDisplayName);
  const rows = list.map(p=>{
    const total = productTotalQty(p);
    const low = isLowStock(p);
    const cells = valuationLocations.map(l=>{
      const q = qtyAt(p, l.id);
      const rl = reorderLevelAt(p, l.id);
      const cellLow = rl!=null && q <= rl;
      return `<td class="py-3 text-right num${cellLow?' text-amber-700 font-semibold':''}">${q ? fmtNum(q) : '<span class="text-slate-300">—</span>'}${cellLow?' <span class="text-[10px] align-top">●</span>':''}</td>`;
    }).join('');
    return `
      <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
        <td class="px-5 sm:px-6 py-3">
          <div class="font-semibold text-slate-800">${esc(displayName(p))} ${low?'<span class="ml-1.5 inline-flex px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[11px] font-semibold">Low</span>':''}</div>
          <div class="text-[11.5px] text-slate-400">${esc(p.sku||'No SKU')}${p.category?(' · '+esc(p.category)):''}</div>
        </td>
        ${cells}
        <td class="py-3 pr-5 sm:pr-6 text-right num font-bold text-slate-900">${fmtNum(total)}</td>
      </tr>`;
  }).join('');

  return `
    <div class="sticky-toolbar flex items-start justify-between gap-4 flex-wrap mb-6">
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Stock Levels</h1>
        <p class="text-sm text-slate-500 mt-0.5">Quantity on hand for every item, by location.${hiddenCount ? ` ${hiddenCount} location${hiddenCount===1?'':'s'} hidden (stock valuation off).` : ''}</p>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200">
      ${list.length ? `
      <div class="w-full">
        <table class="w-full text-sm">
          <thead><tr class="sticky-thead sticky-thead-0 text-left text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
            <th class="px-5 sm:px-6 py-3 font-semibold">Item</th>
            ${valuationLocations.map(l=>`<th class="py-3 font-semibold text-right">${esc(l.code)}</th>`).join('')}
            <th class="py-3 pr-5 sm:pr-6 font-semibold text-right">Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>` : `
      <div class="text-center py-16 px-6">
        <h3 class="text-base font-semibold text-slate-800 mb-1">No items yet</h3>
        <p class="text-sm text-slate-500 max-w-sm mx-auto mb-4">Add items to see stock levels across all ${LOCATIONS.length} location${LOCATIONS.length===1?'':'s'}.</p>
      </div>`}
    </div>
  `;
}

function viewProducts(){
  const f = ui.productsFilter;
  let list = [...state.products];
  if(f.category) list = list.filter(p=>(p.category||'')===f.category);
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(p=> (p.name+' '+(p.variant||'')+' '+(p.sku||'')+' '+(p.description||'')).toLowerCase().includes(q));
  }
  list.sort(byDisplayName);

  const catOptions = distinctCategories().map(c=>`<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('');

  const rows = list.map(p=>{
    const low = isLowStock(p);
    return `

        <td class="py-3 text-right num">${fmtNum(productTotalQty(p))}</td>

        </td>
      </tr>`;
  }).join('');

  return `

        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Items</h1>

      </div>
      <div class="flex gap-2.5">
        <button onclick="exportProductsCSV()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 bg-white hover:bg-slate-50">Export CSV</button>

    </div>
  `;
}

function saveProduct(id){
  if(!canManageInventory()){ toast(id ? 'Only admins can edit items.' : 'Only admins can add new items.', true); return; }
  const errEl = document.getElementById('pf-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('pf-name').value.trim();
  if(!name){ errEl.textContent='Item name is required.'; errEl.classList.remove('hidden'); return; }
  const stock = {};
  LOCATIONS.forEach(l=>{ stock[l.id] = Number(document.getElementById('pf-qty-'+l.id).value) || 0; });
  const perLoc = document.getElementById('pf-reorder-perloc-toggle').checked;
  const reorderLevels = {};
  if(perLoc){
    LOCATIONS.forEach(l=>{
      const raw = document.getElementById('pf-reorder-'+l.id).value;
      if(raw !== '') reorderLevels[l.id] = Number(raw) || 0;
    });
  }
  const data = {
    name,
    variant: document.getElementById('pf-variant').value.trim(),
    description: document.getElementById('pf-description').value.trim(),
    sku: document.getElementById('pf-sku').value.trim(),
    category: document.getElementById('pf-category').value.trim(),
    stock,
    reorderLevel: Number(document.getElementById('pf-reorder').value) || 0,
    reorderLevels,
    image: document.getElementById('pf-image-data').value || '',
    estimatedCost: document.getElementById('pf-cost').value !== '' ? Number(document.getElementById('pf-cost').value) : 0,
  };
  let savedProduct;
  if(id){
    savedProduct = getProduct(id);
    Object.assign(savedProduct, data);
  } else {
    savedProduct = { id: uid(), ...data, createdAt: nowISO() };
    state.products.push(savedProduct);
  }
  persistItemDoc(savedProduct);
  LOCATIONS.forEach(loc=>checkLowStockAndNotify(savedProduct, loc.id));
  closeModal();
  toast(id ? 'Item updated.' : 'Item added.');
  rerenderMain();
}

function deleteProduct(id){
  if(!canManageInventory()){ toast('Only admins can delete items.', true); return; }
  confirmAction('Delete this item and its stock movement history? This cannot be undone.', async ()=>{
    const movementsToDelete = state.movements.filter(m=>m.productId===id);
    state.products = state.products.filter(p=>p.id!==id);
    state.movements = state.movements.filter(m=>m.productId!==id);
    await deleteItemDoc(id);
    for(const m of movementsToDelete){ await deleteMovementDoc(m.id); }
    toast('Item deleted.');
    rerenderMain();
  });
}

  ACQUISITION_TYPES.forEach(a=>{ map[a] = 0; });

function costValuationByItem(){
  const map = {};
  state.movements.forEach(m=>{
    if(m.type!=='out') return;
    if(!map[m.productId]) map[m.productId] = 0;
    map[m.productId] += Number(m.quantity)||0;
  });
  return Object.entries(map)
    .map(([productId, qty])=>{
      const p = getProduct(productId);
      const unitCost = p ? (Number(p.estimatedCost)||0) : 0;
      return { product: p, qtyConsumed: qty, unitCost, totalCost: qty * unitCost };
    })
    .filter(e=>e.product)
    .sort((a,b)=>b.totalCost-a.totalCost);
}
function costValuationByCategory(){
  const map = {};
  costValuationByItem().forEach(e=>{
    const cat = (e.product.category||'').trim() || 'Uncategorized';
    map[cat] = (map[cat]||0) + e.totalCost;
  });
  return Object.entries(map)
    .map(([category, totalCost])=>({category, totalCost}))
    .filter(e=>e.totalCost>0)
    .sort((a,b)=>b.totalCost-a.totalCost);
}
function buildMonthRange(fromStr, toStr){
  const months = [];
  if(!fromStr || !toStr) return months;
  let fParts = fromStr.slice(0,7).split('-').map(Number);
  let tParts = toStr.slice(0,7).split('-').map(Number);
  let [fy,fm] = fParts, [ty,tm] = tParts;
  if(!fy || !fm || !ty || !tm) return months;
  if(ty<fy || (ty===fy && tm<fm)){ const t1=fy,t2=fm; fy=ty; fm=tm; ty=t1; tm=t2; }
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let y=fy, m=fm, count=0;
  while((y<ty || (y===ty && m<=tm)) && count<36){
    months.push({ year:y, month:m, key: y+'-'+String(m).padStart(2,'0'), label: monthNames[m-1] + (fy!==ty ? " '"+String(y).slice(2) : '') });
    m++; if(m>12){ m=1; y++; }
    count++;
  }
  return months;
}
function monthlyCostSeriesForMovements(movements, months){
  const purchaseCost = new Array(months.length).fill(0);
  const consumptionCost = new Array(months.length).fill(0);
  const idxByKey = {};
  months.forEach((mo,i)=>{ idxByKey[mo.key] = i; });
  movements.forEach(m=>{
    if(!m.date) return;
    const idx = idxByKey[m.date.slice(0,7)];
    if(idx===undefined) return;
    const p = getProduct(m.productId);
    if(!p) return;
    const cost = (Number(m.quantity)||0) * (Number(p.estimatedCost)||0);
    if(m.type==='in') purchaseCost[idx] += cost;
    else if(m.type==='out') consumptionCost[idx] += cost;
  });
  return { purchaseCost, consumptionCost };
}
function categoryMonthlyCostSeriesRange(months){
  const categories = new Set();
  state.movements.forEach(m=>{
    const p = getProduct(m.productId);
    if(p) categories.add((p.category||'').trim() || 'Uncategorized');
  });
  return [...categories].sort((a,b)=>a.localeCompare(b)).map(cat=>{
    const catMovements = state.movements.filter(m=>{
      const p = getProduct(m.productId);
      return p && ((p.category||'').trim() || 'Uncategorized') === cat;
    });
    return { category: cat, ...monthlyCostSeriesForMovements(catMovements, months) };
  }).filter(c => c.purchaseCost.some(v=>v>0) || c.consumptionCost.some(v=>v>0));
}

function saveLocation(id){
  if(!canManageInventory()){ toast('Only admins can manage locations.', true); return; }
  const errEl = document.getElementById('lf-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('lf-name').value.trim();
  const code = document.getElementById('lf-code').value.trim().toUpperCase();
  const color = document.getElementById('lf-color').value;
  const address = document.getElementById('lf-address').value.trim();
  const stockValuation = document.getElementById('lf-stock-valuation-no').checked ? false : true;
  const custodianSelect = document.getElementById('lf-custodian');
  const custodianUid = custodianSelect.value;
  const custodianName = custodianUid ? custodianSelect.options[custodianSelect.selectedIndex].dataset.name : '';
  if(!name){ errEl.textContent='Location name is required.'; errEl.classList.remove('hidden'); return; }
  if(!code){ errEl.textContent='Short code is required.'; errEl.classList.remove('hidden'); return; }
  const dup = LOCATIONS.find(l=> l.code.toLowerCase()===code.toLowerCase() && l.id!==id);
  if(dup){ errEl.textContent='That code is already used by ' + dup.name + '.'; errEl.classList.remove('hidden'); return; }
  if(id){
    const loc = getLocation(id);
    loc.name = name; loc.code = code; loc.color = color; loc.address = address; loc.stockValuation = stockValuation;
    loc.custodianUid = custodianUid; loc.custodianName = custodianName;
  } else {
    LOCATIONS.push({ id: uid(), name, code, color, address, stockValuation, custodianUid, custodianName });
  }
  persistLocations();
  closeModal();
  toast(id ? 'Location updated.' : 'Location added.');
  rerenderMain();
}
function deleteLocation(id){
  if(!canManageInventory()){ toast('Only admins can manage locations.', true); return; }
  if(LOCATIONS.length <= 1){ toast('At least one location is required.', true); return; }
  const loc = getLocation(id);
  if(!loc) return;
  const hasStock = state.products.some(p=> qtyAt(p, id) > 0);
  const hasAssets = state.assets.some(a=> a.locationId === id);
  const warning = (hasStock || hasAssets)
    ? `Delete "${loc.name}"? It still has ${hasStock?'stock':''}${hasStock&&hasAssets?' and ':''}${hasAssets?'assets':''} recorded against it — those records will remain but this location will no longer appear as an option.`
    : `Delete "${loc.name}"? This cannot be undone.`;
  confirmAction(warning, ()=>{
    LOCATIONS = LOCATIONS.filter(l=>l.id!==id);
    persistLocations();
    toast('Location deleted.');
    rerenderMain();
  });
}
function removeMember(uid, name){
  if(!authUser || authUser.role!=='admin'){ toast('Only admins can remove members.', true); return; }
  if(authUser.uid===uid){ toast('You cannot remove your own account.', true); return; }
  if(!firestoreProfilesRef || !firestoreDb){ toast('Removing members requires cloud sync to be connected.', true); return; }
  confirmAction(`Remove ${name}? They will lose access immediately. Their old sign-in will keep failing until an admin removes them from the blocked list, since this app has no backend to delete the underlying account.`, async ()=>{
    const isPermissionError = e => e && (e.code==='permission-denied' || (e.message||'').toLowerCase().includes('permission'));
    try{
      await firestoreProfilesRef.doc(uid).delete();
    }catch(e){
      toast(isPermissionError(e)
        ? 'Firestore rules are blocking profile deletion — an admin must be allowed to delete other users\u2019 documents in fdc_inventory_profiles, not just their own.'
        : 'Could not delete that member\u2019s profile: ' + (e && e.message ? e.message : 'unknown error'), true);
      return;
    }
    try{
      const metaRef = firestoreDb.collection('fdc_inventory_meta').doc('blockedUsers');
      await firestoreDb.runTransaction(async (tx)=>{
        const snap = await tx.get(metaRef);
        const uids = snap.exists && Array.isArray(snap.data().uids) ? snap.data().uids : [];
        if(!uids.includes(uid)) uids.push(uid);
        tx.set(metaRef, { uids });
      });
    }catch(e){
      toast(isPermissionError(e)
        ? 'Profile deleted, but Firestore rules are blocking the blocked-users list update — check that fdc_inventory_meta allows writes to the blockedUsers document.'
        : 'Profile deleted, but could not update the blocked-users list: ' + (e && e.message ? e.message : 'unknown error'), true);
      state.profiles = state.profiles.filter(p=>p.uid!==uid);
      rerenderMain();
      return;
    }
    state.profiles = state.profiles.filter(p=>p.uid!==uid);
    toast('Member removed.');
    rerenderMain();
  });
}

function getUniqueItemNames(){
  return [...new Set(state.products.map(p=>p.name))].sort((a,b)=>a.localeCompare(b));

function movementItemOptionsHtml(filterText, idx){

  if(!names.length) return `<div class="px-3.5 py-2.5 text-sm text-slate-400">No items match "${esc(filterText)}".</div>`;
  return names.map(n=>{
    const count = state.products.filter(p=>p.name===n).length;
    return `
    <button type="button" data-name="${esc(n)}" onmousedown="event.preventDefault(); selectMovementItemName(this.dataset.name, ${idx})" class="w-full text-left px-3.5 py-2 text-sm hover:bg-slate-50 flex items-center justify-between gap-2">

function selectMovementProduct(id, idx){

let scannerStream = null;
let scannerRAF = null;
async function openItemScanner(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Camera access is not supported in this browser.', true); return; }
  if(typeof jsQR === 'undefined'){
    try{ await loadScriptOnce('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'); }
    catch(e){ toast('The QR scanning library did not load — check your internet connection.', true); return; }
  }
  const overlay = document.getElementById('scanner-overlay');
  const video = document.getElementById('scanner-video');
  const status = document.getElementById('scanner-status');
  status.textContent = 'Point the camera at a printed item QR code.';
  status.classList.remove('text-rose-600');
  status.classList.add('text-slate-500');
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    status.textContent = 'Could not access the camera — check your browser/device permissions for this site.';
    status.classList.remove('text-slate-500');
    status.classList.add('text-rose-600');
    return;
  }
  video.srcObject = scannerStream;
  await video.play();
  scanItemFrame();
}
function closeItemScanner(){
  if(scannerRAF){ cancelAnimationFrame(scannerRAF); scannerRAF = null; }
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
  const overlay = document.getElementById('scanner-overlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}
function scanItemFrame(){
  const video = document.getElementById('scanner-video');
  const canvas = document.getElementById('scanner-canvas');
  if(!scannerStream || !video.videoWidth){
    scannerRAF = requestAnimationFrame(scanItemFrame);
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height);
  if(code && code.data){
    handleScannedItemCode(code.data.trim());
    return; // stop the scan loop; handleScannedItemCode decides whether to close or keep scanning
  }
  scannerRAF = requestAnimationFrame(scanItemFrame);
}
function handleScannedItemCode(scannedText){
  const status = document.getElementById('scanner-status');
  const match = state.products.find(p=> p.sku && p.sku===scannedText);
  if(match){
    closeItemScanner();
    const lineWraps = [...document.querySelectorAll('.mf-line-wrap')];
    const lastWrap = lineWraps[lineWraps.length-1];
    const lastIdx = lastWrap ? lastWrap.dataset.line : 0;
    const lastHasProduct = lastWrap && document.getElementById('mf-product-'+lastIdx) && document.getElementById('mf-product-'+lastIdx).value;
    const targetIdx = lastHasProduct ? addMovementLine() : lastIdx;
    selectMovementProduct(match.id, targetIdx);
    toast('Scanned: ' + displayName(match));
  } else {
    status.textContent = `No item found with SKU "${scannedText}" — keep scanning or search manually.`;
    status.classList.remove('text-slate-500');
    status.classList.add('text-rose-600');
    scannerRAF = requestAnimationFrame(scanItemFrame);
  }
}

function saveMovementEdit(id){
  if(!canManageInventory()){ toast('Only admins can edit stock movements.', true); return; }
  const m = state.movements.find(x=>x.id===id);
  if(!m){ toast('That movement could not be found.', true); return; }
  const errEl = document.getElementById('mf-error');
  errEl.classList.add('hidden');
  const productId = document.getElementById('mf-product-0').value;
  const locationId = document.getElementById('mf-location').value;
  const qty = Number(document.getElementById('mf-qty-0').value);
  const date = document.getElementById('mf-date').value;
  const reason = document.getElementById('mf-reason').value.trim();
  const acquisition = document.getElementById('mf-acquisition').value;
  const department = m.type==='out' ? document.getElementById('mf-department').value.trim() : '';
  const staffName = m.type==='out' ? document.getElementById('mf-staffname').value.trim() : '';
  const newProduct = getProduct(productId);
  const newLoc = getLocation(locationId);

  if(!newProduct){ errEl.textContent='Choose an item.'; errEl.classList.remove('hidden'); return; }
  if(!newLoc){ errEl.textContent='Choose a location.'; errEl.classList.remove('hidden'); return; }
  if(!qty || qty<=0){ errEl.textContent='Enter a quantity greater than zero.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }
  if(!acquisition){ errEl.textContent = m.type==='in' ? 'Choose how this stock was acquired.' : 'Choose what this consumption should be attributed to.'; errEl.classList.remove('hidden'); return; }

  // Reverse the old movement's effect on the old product/location first
  const oldProduct = getProduct(m.productId);
  if(oldProduct && oldProduct.stock){
    const curOld = qtyAt(oldProduct, m.locationId);
    oldProduct.stock[m.locationId] = m.type==='in' ? curOld - m.quantity : curOld + m.quantity;
  }

  // Validate the new effect won't take a Stock Out below zero (checking against the ALREADY-reversed baseline if it's the same product/location)
  const currentAtNewLoc = qtyAt(newProduct, locationId);
  if(m.type==='out' && qty > currentAtNewLoc){
    errEl.textContent = `Only ${fmtNum(currentAtNewLoc)} in stock at ${newLoc.name} — reduce the quantity or log a Stock In first.`;
    errEl.classList.remove('hidden');
    // Undo the reversal above since we're bailing out
    if(oldProduct && oldProduct.stock){
      const curOld = qtyAt(oldProduct, m.locationId);
      oldProduct.stock[m.locationId] = m.type==='in' ? curOld + m.quantity : curOld - m.quantity;
    }
    return;
  }
  if(m.type==='out'){
    const balance = acquisitionBalance(productId, acquisition, m.id);
    if(qty > balance){
      errEl.textContent = `Only ${fmtNum(balance)} units of this item were ever acquired via ${acquisition} — reduce the quantity or choose a different consumption source.`;
      errEl.classList.remove('hidden');
      if(oldProduct && oldProduct.stock){
        const curOld = qtyAt(oldProduct, m.locationId);
        oldProduct.stock[m.locationId] = m.type==='in' ? curOld + m.quantity : curOld - m.quantity;
      }
      return;
    }
  }

  if(!newProduct.stock) newProduct.stock = {};
  newProduct.stock[locationId] = m.type==='in' ? currentAtNewLoc + qty : currentAtNewLoc - qty;

  m.productId = productId;
  m.locationId = locationId;
  m.quantity = qty;
  m.date = date;
  m.reason = reason;
  m.acquisition = acquisition;
  m.department = department;
  m.staffName = staffName;

  if(oldProduct) persistItemDoc(oldProduct);
  if(newProduct !== oldProduct) persistItemDoc(newProduct);
  persistMovementDoc(m);
  checkLowStockAndNotify(newProduct, locationId);
  closeModal();
  toast('Movement updated.');
  rerenderMain();
}
