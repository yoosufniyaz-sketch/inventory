function saveMovement(type){
  const errEl = document.getElementById('mf-error');
  errEl.classList.add('hidden');
  const locationId = document.getElementById('mf-location').value;
  const date = document.getElementById('mf-date').value;
  const reason = document.getElementById('mf-reason').value.trim();
  const sharedAcquisition = type==='in' ? document.getElementById('mf-acquisition').value : '';   // Stock In: one source for the whole delivery
  const department = type==='out' ? document.getElementById('mf-department').value.trim() : '';
  const staffName = type==='out' ? document.getElementById('mf-staffname').value.trim() : '';
  const loc = getLocation(locationId);

  if(!loc) { errEl.textContent='Choose a location.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }
  if(type==='in' && !sharedAcquisition){ errEl.textContent = 'Choose how this stock was acquired.'; errEl.classList.remove('hidden'); return; }

  const lineEls = [...document.querySelectorAll('.mf-line-wrap')];
  const lines = [];
  for(const lineEl of lineEls){
    const idx = lineEl.dataset.line;
    const productId = document.getElementById('mf-product-'+idx).value;
    const qty = Number(document.getElementById('mf-qty-'+idx).value);
    const p = getProduct(productId);
    if(!p){ errEl.textContent='Choose an item for every row.'; errEl.classList.remove('hidden'); return; }
    if(!qty || qty<=0){ errEl.textContent = `Enter a quantity greater than zero for ${displayName(p)}.`; errEl.classList.remove('hidden'); return; }
    const acquisition = type==='out' ? document.getElementById('mf-acquisition-'+idx).value : sharedAcquisition;
    if(!acquisition){ errEl.textContent = `Choose what the consumption of ${displayName(p)} should be attributed to.`; errEl.classList.remove('hidden'); return; }
    lines.push({ p, qty, acquisition });
  }
  if(!lines.length){ errEl.textContent='Add at least one item.'; errEl.classList.remove('hidden'); return; }

  // Combine quantities per product first, so validation checks the TOTAL requested against each item's real limits
  const totalsByProduct = {};
  lines.forEach(({p, qty})=>{ totalsByProduct[p.id] = (totalsByProduct[p.id]||0) + qty; });
  for(const pid of Object.keys(totalsByProduct)){
    const p = getProduct(pid);
    const totalQty = totalsByProduct[pid];
    const currentAtLoc = qtyAt(p, locationId);
    if(type==='out' && totalQty > currentAtLoc){
      errEl.textContent = `Only ${fmtNum(currentAtLoc)} of ${displayName(p)} in stock at ${loc.name} — reduce the quantity or log a Stock In first.`;
      errEl.classList.remove('hidden');
      return;
    }
  }
  if(type==='out'){
    // each source is checked on its own: the same item on two rows with different sources is fine, rows sharing a source add up
    const totalsBySource = {};
    lines.forEach(({p, qty, acquisition})=>{
      totalsBySource[p.id] = totalsBySource[p.id] || {};
      totalsBySource[p.id][acquisition] = (totalsBySource[p.id][acquisition]||0) + qty;
    });
    for(const pid of Object.keys(totalsBySource)){
      const p = getProduct(pid);
      for(const acq of Object.keys(totalsBySource[pid])){
        const balance = acquisitionBalance(pid, acq);
        if(totalsBySource[pid][acq] > balance){
          errEl.textContent = `Only ${fmtNum(balance)} units of ${displayName(p)} were ever acquired via ${acq} — reduce the quantity or choose a different consumption source.`;
          errEl.classList.remove('hidden');
          return;
        }
      }
    }
  }

  const touchedProducts = new Map();
  const createdMovements = [];
  lines.forEach(({p, qty, acquisition})=>{
    const currentAtLoc = qtyAt(p, locationId);
    if(!p.stock) p.stock = {};
    p.stock[locationId] = type==='in' ? currentAtLoc + qty : currentAtLoc - qty;
    const newMovement = {
      id: uid(), type, productId: p.id, locationId, quantity: qty, date, reason, acquisition, department, staffName, createdAt: nowISO(),
      loggedByName: authUser ? authUser.name : null,
      loggedByEmail: authUser ? authUser.email : null,
    };
    state.movements.push(newMovement);
    createdMovements.push(newMovement);
    touchedProducts.set(p.id, p);
  });

  touchedProducts.forEach(p=>persistItemDoc(p));
  createdMovements.forEach(m=>persistMovementDoc(m));
  touchedProducts.forEach(p=>checkLowStockAndNotify(p, locationId));
  closeModal();
  toast(lines.length>1 ? `${lines.length} stock movements logged.` : 'Stock movement logged.');
  rerenderMain();
}
function deleteMovement(id){
  if(!canManageInventory()){ toast('Only admins can delete stock movements.', true); return; }
  const m = state.movements.find(x=>x.id===id);
  if(!m) return;
  confirmAction('Delete this movement? The quantity change it made will be reversed.', ()=>{
    const p = getProduct(m.productId);
    if(p && p.stock){
      const cur = qtyAt(p, m.locationId);
      p.stock[m.locationId] = m.type==='in' ? cur - m.quantity : cur + m.quantity;
    }
    state.movements = state.movements.filter(x=>x.id!==id);
    if(p) persistItemDoc(p);
    deleteMovementDoc(id);
    toast('Movement deleted.');
    rerenderMain();
  });
}

function localDateStr(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
// Requisitions created before the date field existed fall back to the (local) day they were created.
function prRequisitionDate(pr){
  if(pr.requisitionDate) return pr.requisitionDate;
  const created = pr.createdAt ? new Date(pr.createdAt) : null;
  return created && !isNaN(created) ? localDateStr(created) : '';
}
// Budget code lives on each line; older requisitions may still carry one at the requisition level.
function prLineBudgetCode(pr, line){
  return String((line && line.budgetCode) || pr.budgetCode || '').trim();
}
function prValueByBudgetCode(list){
  const groups = new Map();
  list.forEach(pr=>{
    (pr.lineItems||[]).forEach(line=>{
      const code = prLineBudgetCode(pr, line).replace(/\s+/g,' ');
      const key = code.toLowerCase();
      let g = groups.get(key);
      if(!g){ g = { code: code || 'No budget code', unassigned: !code, total:0, lines:0, prIds:new Set() }; groups.set(key, g); }
      g.total += Number(line.totalCost) || ((Number(line.quantity)||0) * (Number(line.unitCost)||0));
      g.lines += 1;
      g.prIds.add(pr.id);
    });
  });
  return [...groups.values()].sort((a,b)=> (a.unassigned - b.unassigned) || (b.total - a.total) || a.code.localeCompare(b.code));
}
const PR_SORTS = [
  { id:'number_desc', label:'PR number · high to low' },
  { id:'number_asc',  label:'PR number · low to high' },
  { id:'date_desc',   label:'Requisition date · newest first' },
  { id:'date_asc',    label:'Requisition date · oldest first' },
];
// numeric-aware, so 'PR-5' sorts before 'PR-12' and 'FDC-2026-PR-00838' before 'FDC-2026-PR-01017'
const prNumberCollator = new Intl.Collator(undefined, { numeric:true, sensitivity:'base' });
function prSortCompare(sortId){
  const num  = (a,b) => prNumberCollator.compare(a.prNumber||'', b.prNumber||'');
  const date = (a,b) => prRequisitionDate(a).localeCompare(prRequisitionDate(b));
  const made = (a,b) => (a.createdAt||'').localeCompare(b.createdAt||'');
  switch(sortId){
    case 'number_asc': return (a,b) => num(a,b) || made(a,b);
    case 'date_desc':  return (a,b) => date(b,a) || num(b,a);
    case 'date_asc':   return (a,b) => date(a,b) || num(a,b);
    default:           return (a,b) => num(b,a) || made(b,a);   // number_desc
  }
}

function applyPrAutoStockIn(pr){
  const loc = getLocation(pr.locationId);
  if(!loc) return;
  pr.lineItems.forEach(line=>{
    if(line.linkedProductId && !line.stockedIn){
      const p = getProduct(line.linkedProductId);
      if(p){
        if(!p.stock) p.stock = {};
        const cur = qtyAt(p, pr.locationId);
        p.stock[pr.locationId] = cur + line.quantity;
        const movement = {
          id: uid(), type:'in', productId: p.id, locationId: pr.locationId, quantity: line.quantity,
          date: todayStr(), reason: `Auto stock-in from Purchase Requisition ${pr.prNumber}`,
          acquisition: 'Purchase Order', department:'', staffName:'',
          createdAt: nowISO(), loggedByName: authUser?authUser.name:null, loggedByEmail: authUser?authUser.email:null,
        };
        state.movements.push(movement);
        persistItemDoc(p);
        persistMovementDoc(movement);
        checkLowStockAndNotify(p, pr.locationId);
        line.stockedIn = true;
      }
    }
  });
}
function savePurchaseRequisition(id){
  const errEl = document.getElementById('pr-error');
  errEl.classList.add('hidden');
  const prNumber = document.getElementById('pr-number').value.trim();
  const requisitionDate = document.getElementById('pr-date').value;
  const requester = document.getElementById('pr-requester').value.trim();
  const locationId = document.getElementById('pr-location').value;
  const status = document.getElementById('pr-status').value;
  const prUrl = document.getElementById('pr-url-pr').value.trim();
  const poUrl = document.getElementById('pr-url-po').value.trim();
  const doUrl = document.getElementById('pr-url-do').value.trim();
  const invoiceUrl = document.getElementById('pr-url-invoice').value.trim();

  if(!prNumber){ errEl.textContent='PR Number is required.'; errEl.classList.remove('hidden'); return; }
  if(!requisitionDate){ errEl.textContent='Requisition date is required.'; errEl.classList.remove('hidden'); return; }
  if(!requester){ errEl.textContent='Requester is required.'; errEl.classList.remove('hidden'); return; }
  if(!locationId){ errEl.textContent='Location is required.'; errEl.classList.remove('hidden'); return; }
  const dup = state.purchaseRequisitions.find(x=>x.prNumber.toLowerCase()===prNumber.toLowerCase() && x.id!==id);
  if(dup){ errEl.textContent='That PR Number is already used by another requisition.'; errEl.classList.remove('hidden'); return; }

  const lineEls = [...document.querySelectorAll('.pr-line-wrap')];
  const lineItems = [];
  for(const lineEl of lineEls){
    const idx = lineEl.dataset.line;
    const itemName = document.getElementById('pr-item-name-'+idx).value.trim();
    const itemDescription = document.getElementById('pr-item-description-'+idx).value.trim();
    const budgetCode = document.getElementById('pr-budget-code-'+idx).value.trim();
    const quantity = Number(document.getElementById('pr-qty-'+idx).value);
    const unitCost = Number(document.getElementById('pr-unit-cost-'+idx).value);
    const linkedProductId = document.getElementById('pr-sku-id-'+idx).value || null;
    const linkedAssetId = document.getElementById('pr-asset-id-'+idx).value || null;
    if(!itemName){ errEl.textContent='Item name is required for every line.'; errEl.classList.remove('hidden'); return; }
    if(!quantity || quantity<=0){ errEl.textContent=`Enter a quantity greater than zero for ${itemName}.`; errEl.classList.remove('hidden'); return; }
    if(unitCost==null || isNaN(unitCost) || unitCost<0){ errEl.textContent=`Enter a valid unit cost for ${itemName}.`; errEl.classList.remove('hidden'); return; }
    lineItems.push({ itemName, itemDescription, budgetCode, quantity, unitCost, totalCost: quantity*unitCost, linkedProductId, linkedAssetId, stockedIn: wasLineAlreadyStockedIn(id, linkedProductId) });
  }
  if(!lineItems.length){ errEl.textContent='Add at least one item.'; errEl.classList.remove('hidden'); return; }

  const totalCost = lineItems.reduce((s,l)=>s+l.totalCost, 0);
  const editing = id ? state.purchaseRequisitions.find(x=>x.id===id) : null;
  const wasAlreadyClosed = editing ? editing.status === 'closed' : false;

  if(editing){
    Object.assign(editing, { prNumber, requisitionDate, requester, locationId, status, prUrl, poUrl, doUrl, invoiceUrl, lineItems, totalCost });
    if(status === 'closed' && !wasAlreadyClosed){
      applyPrAutoStockIn(editing);
      toast('Purchase requisition closed — linked stock items added to inventory.');
    } else {
      toast('Purchase requisition updated.');
    }
    persistPurchaseRequisitionDoc(editing);
  } else {
    const pr = {
      id: uid(), prNumber, requisitionDate, requester, locationId, status, prUrl, poUrl, doUrl, invoiceUrl, lineItems, totalCost,
      createdByName: authUser ? authUser.name : null,
      createdByEmail: authUser ? authUser.email : null,
      createdAt: nowISO(),
    };
    state.purchaseRequisitions.push(pr);
    if(status === 'closed'){
      applyPrAutoStockIn(pr);
      toast('Purchase requisition created and closed — linked stock items added to inventory.');
    } else {
      toast('Purchase requisition created.');
    }
    persistPurchaseRequisitionDoc(pr);
  }
  closeModal();
  rerenderMain();
}
function wasLineAlreadyStockedIn(prId, linkedProductId){
  if(!prId || !linkedProductId) return false;
  const pr = state.purchaseRequisitions.find(x=>x.id===prId);
  if(!pr || !pr.lineItems) return false;
  return pr.lineItems.some(l => l.linkedProductId === linkedProductId && l.stockedIn);
}
function deletePurchaseRequisition(id){
  if(!canManageInventory()){ toast('Only admins can delete purchase requisitions.', true); return; }
  const pr = state.purchaseRequisitions.find(x=>x.id===id);
  if(!pr) return;
  confirmAction(`Delete requisition ${pr.prNumber}? This cannot be undone.`, ()=>{
    state.purchaseRequisitions = state.purchaseRequisitions.filter(x=>x.id!==id);
    deletePurchaseRequisitionDoc(id);
    closeModal();
    toast('Purchase requisition deleted.');
    rerenderMain();
  });
}

// Records made before items became a list keep their single item in the top-level fields.
function hoLines(h){
  if(Array.isArray(h.lineItems) && h.lineItems.length) return h.lineItems;
  if(h.itemName || h.productId) return [{ itemName:h.itemName||'', productId:h.productId||'', quantity:h.quantity||0, itemDetails:h.itemDetails||'', assetCode:'', assetId:null }];
  return [];
}
function hoAssetLabel(a){ return a ? (a.departmentAssetCode || a.tag || '') : ''; }
function hoLineHtml(idx, line){
  line = line || {};
  const p = line.productId ? getProduct(line.productId) : null;           // a catalog item that still exists
  const linkedAsset = line.assetId ? state.assets.find(x=>x.id===line.assetId) : null;
  const itemText = p ? p.name : (line.itemName || '');
  const variants = p ? state.products.filter(x=>x.name===p.name).sort(byDisplayName) : [];
  const fieldCls = 'w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent';
  return `
    <div class="ho-line-wrap border border-slate-200 rounded-lg p-3.5 mb-3 bg-slate-50/50 ${p?'has-variant':''}" data-line="${idx}">
      <div class="ho-line-grid">
        <div class="relative ho-item">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Item *</label>
          <input type="text" id="ho-item-${idx}" autocomplete="off" value="${esc(itemText)}" placeholder="Search the catalog, or type an item in"
            oninput="hoItemTyped(${idx})" onfocus="this.select(); hoFilterItems(${idx});" onblur="hoHideItemDropdown(${idx})" class="${fieldCls}">
          <div id="ho-item-dropdown-${idx}" class="hidden absolute z-10 mt-1 w-full max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg"></div>
          <input type="hidden" id="ho-product-${idx}" value="${p?esc(p.id):''}">
        </div>
        <div class="ho-variant">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Variant</label>
          <select id="ho-variant-${idx}" onchange="hoSelectVariant(${idx})" class="${fieldCls}">
            ${variants.map(v=>`<option value="${esc(v.id)}" ${v.id===p.id?'selected':''}>${esc(v.variant&&v.variant.trim()?v.variant.trim():'Standard')}</option>`).join('')}
          </select>
        </div>
        <div class="ho-qty">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Quantity *</label>
          <input type="number" min="0" step="any" id="ho-qty-${idx}" value="${line.quantity||''}" placeholder="0" class="${fieldCls}">
        </div>
        <button type="button" onclick="removeHandoverLine(${idx})" class="ho-remove text-slate-400 hover:text-rose-600 ${idx===0?'invisible':''}" title="Remove this item">✕</button>
      </div>
      <div id="ho-item-hint-${idx}" class="text-[11px] text-slate-400 mt-1"></div>
      <div class="ho-line-row2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Item details <span class="font-normal text-slate-400">(optional)</span></label>
          <input type="text" id="ho-details-${idx}" value="${esc(line.itemDetails||'')}" placeholder="Condition, serial number, notes…" class="${fieldCls}">
        </div>
        <div class="relative">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Asset code <span class="font-normal text-slate-400">(optional)</span></label>
          <input type="text" id="ho-asset-${idx}" autocomplete="off" value="${esc(line.assetCode||'')}" placeholder="Pick an asset, or type a code"
            oninput="hoAssetTyped(${idx})" onfocus="hoFilterAssets(${idx})" onblur="hoHideAssetDropdown(${idx})" class="${fieldCls}">
          <input type="hidden" id="ho-asset-id-${idx}" value="${linkedAsset?esc(linkedAsset.id):''}">
          <div id="ho-asset-dropdown-${idx}" class="hidden absolute z-10 mt-1 w-full max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg"></div>
          <div id="ho-asset-hint-${idx}" class="text-[11px] text-slate-400 mt-1"></div>
        </div>
      </div>
    </div>
  `;
}
function hoRefreshItemHint(idx){
  const hint = document.getElementById('ho-item-hint-'+idx);
  if(!hint) return;
  const text = document.getElementById('ho-item-'+idx).value.trim();
  const pid = document.getElementById('ho-product-'+idx).value;
  const p = pid ? getProduct(pid) : null;
  hint.textContent = p ? ('Catalog item' + (p.sku ? ' · ' + p.sku : '')) : (text ? 'Manual entry — not linked to the item catalog' : '');
}
function hoRefreshAssetHint(idx){
  const hint = document.getElementById('ho-asset-hint-'+idx);
  if(!hint) return;
  const aid = document.getElementById('ho-asset-id-'+idx).value;
  const a = aid ? state.assets.find(x=>x.id===aid) : null;
  hint.textContent = a ? ('Linked asset · ' + a.name) : '';
}
function hoItemOptionsHtml(filterText, idx){
  const f = (filterText||'').trim().toLowerCase();
  const names = getUniqueItemNames().filter(n=> !f || n.toLowerCase().includes(f));
  if(!names.length) return `<div class="px-3.5 py-2.5 text-sm text-slate-400">Not in the catalog — keep typing and it will be saved as a manual entry.</div>`;
  return names.map(n=>{
    const count = state.products.filter(p=>p.name===n).length;
    return `
    <button type="button" data-name="${esc(n)}" onmousedown="event.preventDefault(); hoSelectItemName(this.dataset.name, ${idx})" class="w-full text-left px-3.5 py-2 text-sm hover:bg-slate-50 flex items-center justify-between gap-2">
      <span class="truncate">${esc(n)}</span>
      ${count>1 ? `<span class="text-[11px] text-slate-400 shrink-0 ml-2">${count} variants</span>` : ''}
    </button>`;
  }).join('');
}
function hoFilterItems(idx){
  const input = document.getElementById('ho-item-'+idx), dd = document.getElementById('ho-item-dropdown-'+idx);
  if(!input || !dd) return;
  dd.innerHTML = hoItemOptionsHtml(input.value, idx);
  dd.classList.remove('hidden');
}
function hoHideItemDropdown(idx){
  setTimeout(()=>{ const d = document.getElementById('ho-item-dropdown-'+idx); if(d) d.classList.add('hidden'); }, 150);
}
function hoItemTyped(idx){
  const input = document.getElementById('ho-item-'+idx);
  const pidEl = document.getElementById('ho-product-'+idx);
  const p = pidEl.value ? getProduct(pidEl.value) : null;
  // typing something other than the picked catalog item turns the row into a manual entry
  if(p && input.value.trim().toLowerCase() !== p.name.toLowerCase()){
    pidEl.value = '';
    document.getElementById('ho-variant-'+idx).innerHTML = '';
    document.querySelector(`.ho-line-wrap[data-line="${idx}"]`).classList.remove('has-variant');
  }
  hoRefreshItemHint(idx);
  hoFilterItems(idx);
}
function hoSelectItemName(name, idx){
  const variants = state.products.filter(p=>p.name===name).sort(byDisplayName);
  if(!variants.length) return;
  document.getElementById('ho-item-'+idx).value = name;
  document.getElementById('ho-item-dropdown-'+idx).classList.add('hidden');
  document.getElementById('ho-variant-'+idx).innerHTML = variants.map(v=>`<option value="${esc(v.id)}">${esc(v.variant&&v.variant.trim()?v.variant.trim():'Standard')}</option>`).join('');
  document.getElementById('ho-product-'+idx).value = variants[0].id;
  document.querySelector(`.ho-line-wrap[data-line="${idx}"]`).classList.add('has-variant');
  hoRefreshItemHint(idx);
}
function hoSelectVariant(idx){
  document.getElementById('ho-product-'+idx).value = document.getElementById('ho-variant-'+idx).value;
  hoRefreshItemHint(idx);
}
function hoAssetOptionsHtml(filterText){
  const f = (filterText||'').trim().toLowerCase();
  const matches = state.assets.filter(a => !f || (a.name||'').toLowerCase().includes(f) || (a.departmentAssetCode||'').toLowerCase().includes(f) || (a.tag||'').toLowerCase().includes(f)).slice(0, 30);
  if(!matches.length) return `<div class="px-3.5 py-2.5 text-sm text-slate-400">No matching asset — whatever you type is saved as the asset code.</div>`;
  return matches.map(a=>`
    <button type="button" onmousedown="event.preventDefault(); hoSelectAsset('${esc(a.id)}', __IDX__)" class="w-full text-left px-3.5 py-2 text-sm hover:bg-slate-50 flex items-center justify-between gap-2">
      <span class="truncate">${esc(a.name)}</span>
      <span class="text-[11px] text-slate-400 shrink-0 ml-2">${esc(hoAssetLabel(a)||'no code')}</span>
    </button>`).join('');
}
function hoFilterAssets(idx){
  const input = document.getElementById('ho-asset-'+idx), dd = document.getElementById('ho-asset-dropdown-'+idx);
  if(!input || !dd) return;
  dd.innerHTML = hoAssetOptionsHtml(input.value).replace(/__IDX__/g, idx);
  dd.classList.remove('hidden');
}
function hoHideAssetDropdown(idx){
  setTimeout(()=>{ const d = document.getElementById('ho-asset-dropdown-'+idx); if(d) d.classList.add('hidden'); }, 150);
}
function hoAssetTyped(idx){
  const input = document.getElementById('ho-asset-'+idx);
  const idEl = document.getElementById('ho-asset-id-'+idx);
  const a = idEl.value ? state.assets.find(x=>x.id===idEl.value) : null;
  // editing the code after picking an asset makes it a manual code again
  if(a && input.value.trim() !== (hoAssetLabel(a) || a.name)) idEl.value = '';
  hoRefreshAssetHint(idx);
  hoFilterAssets(idx);
}
function hoSelectAsset(assetId, idx){
  const a = state.assets.find(x=>x.id===assetId);
  if(!a) return;
  document.getElementById('ho-asset-'+idx).value = hoAssetLabel(a) || a.name;
  document.getElementById('ho-asset-id-'+idx).value = a.id;
  document.getElementById('ho-asset-dropdown-'+idx).classList.add('hidden');
  const itemEl = document.getElementById('ho-item-'+idx);
  if(!itemEl.value.trim()){ itemEl.value = a.name; hoRefreshItemHint(idx); }   // nothing entered yet: use the asset's name
  const qtyEl = document.getElementById('ho-qty-'+idx);
  if(!qtyEl.value) qtyEl.value = 1;                                               // an asset is a single unit
  hoRefreshAssetHint(idx);
}
function addHandoverLine(){
  const idx = hoLineCount++;
  const wrap = document.getElementById('ho-lines');
  if(wrap) wrap.insertAdjacentHTML('beforeend', hoLineHtml(idx));
  return idx;
}
function removeHandoverLine(idx){
  const el = document.querySelector(`.ho-line-wrap[data-line="${idx}"]`);
  if(el) el.remove();
}

function saveHandover(id){
  const errEl = document.getElementById('ho-error');
  errEl.classList.add('hidden');
  const fail = msg => { errEl.textContent = msg; errEl.classList.remove('hidden'); };
  const referenceNumber = document.getElementById('ho-ref').value.trim();
  const handoverType = document.getElementById('ho-type').value.trim();
  const handoverDate = document.getElementById('ho-date').value;
  const fromDepartment = document.getElementById('ho-from-department').value.trim();
  const fromStaffName = document.getElementById('ho-from-staff').value.trim();
  const fromDesignation = document.getElementById('ho-from-designation').value.trim();
  const toDepartment = document.getElementById('ho-to-department').value.trim();
  const toStaffName = document.getElementById('ho-to-staff').value.trim();
  const toDesignation = document.getElementById('ho-to-designation').value.trim();
  const fileUrl = document.getElementById('ho-file-url').value.trim();
  const remarks = document.getElementById('ho-remarks').value.trim();

  if(!referenceNumber){ fail('Reference number is required.'); return; }
  if(state.handovers.some(h=>(h.referenceNumber||'').toLowerCase()===referenceNumber.toLowerCase() && h.id!==id)){ fail('That reference number is already used by another handover.'); return; }
  if(!handoverType){ fail('Handover type is required.'); return; }
  if(!handoverDate){ fail('Handover date is required.'); return; }

  const lineItems = [];
  for(const el of document.querySelectorAll('.ho-line-wrap')){
    const i = el.dataset.line;
    const typed = document.getElementById('ho-item-'+i).value.trim();
    const pid = document.getElementById('ho-product-'+i).value;
    const p = pid ? getProduct(pid) : null;
    const itemName = p ? displayName(p) : typed;               // a picked catalog item keeps its variant in the name
    const quantity = Number(document.getElementById('ho-qty-'+i).value);
    if(!itemName){ fail('Enter an item for every row (pick one from the catalog or type it in).'); return; }
    if(!quantity || quantity<=0){ fail(`Enter a quantity greater than zero for ${itemName}.`); return; }
    lineItems.push({
      itemName, productId: p ? p.id : '', quantity,
      itemDetails: document.getElementById('ho-details-'+i).value.trim(),
      assetCode: document.getElementById('ho-asset-'+i).value.trim(),
      assetId: document.getElementById('ho-asset-id-'+i).value || null,
    });
  }
  if(!lineItems.length){ fail('Add at least one item.'); return; }
  const seenAssets = new Set();
  for(const l of lineItems){
    const key = (l.assetCode||'').toLowerCase();
    if(!key) continue;
    if(seenAssets.has(key)){ fail(`Asset code ${l.assetCode} is on more than one item — an asset can only be handed over once in a handover.`); return; }
    seenAssets.add(key);
  }
  if(!toDepartment){ fail('"To" department is required.'); return; }
  if(!toStaffName){ fail('"To" staff name is required.'); return; }

  const data = { referenceNumber, handoverType, handoverDate, lineItems, fromDepartment, fromStaffName, fromDesignation, toDepartment, toStaffName, toDesignation, fileUrl, remarks };
  if(id){
    const editing = state.handovers.find(x=>x.id===id);
    Object.assign(editing, data);
    ['productId','itemName','itemDetails','quantity'].forEach(k=>{ delete editing[k]; });   // the old single-item fields now live in lineItems
    persistHandoverDoc(editing);
    toast('Handover updated.');
  } else {
    const h = Object.assign({ id: uid(), createdByName: authUser?authUser.name:null, createdByEmail: authUser?authUser.email:null, createdAt: nowISO() }, data);
    state.handovers.push(h);
    persistHandoverDoc(h);
    toast('Handover recorded.');
  }
  closeModal();
  rerenderMain();
}
function deleteHandover(id){
  if(!canManageInventory()){ toast('Only admins can delete handover records.', true); return; }
  const h = state.handovers.find(x=>x.id===id);
  if(!h) return;
  confirmAction(`Delete this handover record? This cannot be undone.`, ()=>{
    state.handovers = state.handovers.filter(x=>x.id!==id);
    deleteHandoverDoc(id);
    closeModal();
    toast('Handover deleted.');
    rerenderMain();
  });
}

function toggleHoItems(id){
  ui.hoExpanded = ui.hoExpanded || {};
  ui.hoExpanded[id] = !ui.hoExpanded[id];
  rerenderMain();
}
const HO_ITEMS_COLLAPSED = 5;
function hoItemsListHtml(h){
  const lines = hoLines(h);
  if(!lines.length) return '<span class="text-sm text-slate-300">—</span>';
  const expanded = !!(ui.hoExpanded && ui.hoExpanded[h.id]);
  const shown = expanded ? lines : lines.slice(0, HO_ITEMS_COLLAPSED);
  const rows = shown.map(l=>`
    <div class="ho-item-row">
      <span class="text-sm text-slate-800">${esc(l.itemName)}</span>
      <span class="text-[13px] text-slate-400 num">× ${fmtNum(l.quantity)}</span>
      ${l.assetCode ? `<span class="inline-flex px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px] font-semibold">${esc(l.assetCode)}</span>` : ''}
    </div>`).join('');
  const extra = lines.length - HO_ITEMS_COLLAPSED;
  const toggle = extra > 0
    ? `<button type="button" onclick="toggleHoItems('${h.id}')" class="mt-2 text-xs font-semibold text-brand-600 hover:underline">${expanded ? 'Show fewer' : `Show ${extra} more item${extra===1?'':'s'}`}</button>`
    : '';
  return rows + toggle;
}

      </div>
    </div>
    ${all.length ? `
    <div class="flex items-center gap-3 flex-wrap mb-4">
      <input type="search" id="ho-search" value="${esc(ui.hoQuery || '')}" oninput="setHoQuery(this.value)" placeholder="Search reference, name, item, asset code, remarks…" class="w-full sm:w-96 px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm bg-white">
      <span class="text-xs text-slate-400">${terms.length ? `${filtered.length} of ${all.length} handovers` : `${all.length} handover${all.length === 1 ? '' : 's'}`}</span>
    </div>` : ''}
    ${list.length ? `
    <div class="ho-list">
      ${list.map(h=>`
      <div class="ho-card bg-white rounded-xl border border-slate-200">
        <div class="ho-card-head border-b border-slate-100">
          <div>
            <div class="text-[15px] font-bold text-slate-800 num">${h.referenceNumber ? esc(h.referenceNumber) : '<span class="font-normal text-slate-300">No reference</span>'}</div>
            <div class="text-xs text-slate-400 mt-0.5">${fmtDate(h.handoverDate)}</div>
          </div>
          <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">${esc(h.handoverType)}</span>
          <div class="ho-card-actions">
            <button type="button" onclick="generateHandoverDocument('${h.id}', this)" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-slate-300 text-slate-700 hover:bg-slate-50">Generate document</button>
            ${h.fileUrl ? `<a href="${esc(h.fileUrl)}" target="_blank" rel="noopener" class="text-xs font-semibold text-brand-600 hover:underline">File ↗</a>` : ''}
            <button type="button" onclick="openHandoverForm('${h.id}')" class="text-xs font-semibold text-brand-600 hover:underline">Edit</button>
          </div>
        </div>
        <div class="ho-card-body">
          <div class="ho-col-items"><div class="ho-label text-xs font-semibold text-slate-400">Items</div>${hoItemsListHtml(h)}</div>
          <div><div class="ho-label text-xs font-semibold text-slate-400">From</div>${hoPersonHtml(h.fromStaffName, h.fromDesignation, h.fromDepartment)}</div>
          <div><div class="ho-label text-xs font-semibold text-slate-400">To</div>${hoPersonHtml(h.toStaffName, h.toDesignation, h.toDepartment)}</div>
          ${h.remarks ? `<div class="ho-col-remarks"><div class="ho-label text-xs font-semibold text-slate-400">Remarks</div><div class="text-sm text-slate-600">${esc(h.remarks)}</div></div>` : ''}
        </div>
      </div>`).join('')}
    </div>
    ${filtered.length > list.length ? `
    <div class="flex items-center justify-center gap-3 mt-5">
      <span class="text-xs text-slate-400">Showing ${list.length} of ${filtered.length}</span>
      <button type="button" onclick="showMoreHandovers()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-50">Show ${Math.min(HO_PAGE, filtered.length - list.length)} more</button>
    </div>` : ''}` : (all.length ? `
    <div class="bg-white rounded-xl border border-slate-200">
      <div class="text-center py-16 px-6"><h3 class="text-base font-semibold text-slate-800 mb-1">No handovers match “${esc(ui.hoQuery || '')}”</h3><p class="text-sm text-slate-500">Try a different reference, name, item or asset code.</p></div>
    </div>` : `
    <div class="bg-white rounded-xl border border-slate-200">
      <div class="text-center py-16 px-6">
        <h3 class="text-base font-semibold text-slate-800 mb-1">No handovers recorded yet</h3>
        <p class="text-sm text-slate-500 max-w-sm mx-auto">Log an item handover between staff or departments to start tracking here.</p>
      </div>
    </div>`)}
  `;
}

const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const DOC_MONTHS = ['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
function xmlEsc(s){
  return String(s==null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')      // characters that are not allowed in XML
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// text that goes inside a Word text element; new lines become real Word line breaks
function xmlText(s){ return xmlEsc(s).replace(/\r\n|\r|\n/g, '</w:t><w:br/><w:t xml:space="preserve">'); }
function ordinalSuffix(n){
  if(n % 100 >= 11 && n % 100 <= 13) return 'th';
  return ({1:'st', 2:'nd', 3:'rd'})[n % 10] || 'th';
}
function handoverDateParts(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr || '');
  if(!m) return { day:'', suffix:'', month:'', year:'', slash:'' };
  const day = parseInt(m[3], 10), month = parseInt(m[2], 10);
  return { day:String(day), suffix:ordinalSuffix(day), month:DOC_MONTHS[month-1] || '', year:m[1], slash:m[3] + '/' + m[2] + '/' + m[1] };
}
function handoverDetailsText(l){
  const parts = [];
  if(l.itemDetails && String(l.itemDetails).trim()) parts.push(String(l.itemDetails).trim());
  if(l.assetCode) parts.push('Asset code: ' + l.assetCode);
  return parts.join('\n');
}
function fillHandoverXml(xml, h){
  const dp = handoverDateParts(h.handoverDate);
  const lines = hoLines(h);
  // the sample item row is repeated once for every item
  const marker = xml.indexOf('{{ITEM_NO}}');
  if(marker < 0) throw new Error('The handover template is missing its item row.');
  const rowStart = Math.max(xml.lastIndexOf('<w:tr>', marker), xml.lastIndexOf('<w:tr ', marker));
  const rowEnd = xml.indexOf('</w:tr>', marker) + '</w:tr>'.length;
  const proto = xml.slice(rowStart, rowEnd);
  const rows = (lines.length ? lines : [{}]).map((l, i)=> proto
    .replace('{{ITEM_NO}}',      () => xmlText(String(i+1).padStart(2, '0')))
    .replace('{{ITEM_NAME}}',    () => xmlText(l.itemName || ''))
    .replace('{{ITEM_QTY}}',     () => xmlText(l.quantity == null ? '' : String(l.quantity)))
    .replace('{{ITEM_DETAILS}}', () => xmlText(handoverDetailsText(l)))
  ).join('');
  xml = xml.slice(0, rowStart) + rows + xml.slice(rowEnd);
  const values = {
    REF: h.referenceNumber || '',
    DATE_DAY: dp.day, DATE_SUFFIX: dp.suffix, DATE_MONTH: dp.month, DATE_YEAR: dp.year,
    FROM_DEPT: h.fromDepartment || '', TO_DEPT: h.toDepartment || '',
    FROM_NAME: h.fromStaffName || '', FROM_DESIG: h.fromDesignation || '', FROM_DATE: dp.slash,
    TO_NAME: h.toStaffName || '', TO_DESIG: h.toDesignation || '',
  };
  return xml.replace(/\{\{([A-Z_]+)\}\}/g, (all, key) => (key in values) ? xmlText(values[key]) : all);
}
async function buildHandoverDocx(h){
  try{ await loadScriptOnce(JSZIP_URL); }
  catch(e){ throw new Error('The document builder could not be loaded. Check your internet connection and try again.'); }
  if(typeof JSZip === 'undefined') throw new Error('The document builder could not be loaded. Check your internet connection and try again.');
  const zip = await JSZip.loadAsync(HANDOVER_TEMPLATE_B64, { base64:true });
  const docXml = await zip.file('word/document.xml').async('string');
  zip.file('word/document.xml', fillHandoverXml(docXml, h));
  return zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE' });
}
function handoverFileName(h){
  const safe = String(h.referenceNumber || '').replace(/[\\/:*?"<>|\u0000-\u001F]+/g, '-').trim();
  return safe ? 'Handover_' + safe + '.docx' : 'Handover.docx';
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function generateHandoverDocument(id, btn){
  const h = state.handovers.find(x=>x.id===id);
  if(!h) return;
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const blob = await buildHandoverDocx(h);
    downloadBlob(blob, handoverFileName(h));
    toast('Handover document downloaded.');
  }catch(e){
    console.error(e);
    toast('Could not create the document: ' + (e && e.message ? e.message : e), true);
  }finally{
    if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = label; }
  }
}

/* =====================================================================
   HANDOVER IMPORT — reads the handover registry workbook (.xlsx) and creates handover records
   Layout it understands: one row group per handover; the first row carries #, type, people, date and reference,
   the rows below it (merged cells) carry further items. Nothing is saved until the preview is confirmed.
===================================================================== */
// ---- a small .xlsx reader (an .xlsx is a zip of XML files; JSZip is already used for the Word document)
function xlsxColIndex(letters){ let n = 0; for(const ch of letters) n = n*26 + (ch.charCodeAt(0) - 64); return n; }
function xlsxParseRef(ref){ const m = /^([A-Z]+)(\d+)$/.exec(ref); return m ? { c: xlsxColIndex(m[1]), r: parseInt(m[2], 10) } : null; }
function xlsxIsDateFormat(id, code){
  if((id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58)) return true;
  if(!code) return false;
  return /[dmyhs]/i.test(code.replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '').replace(/\\./g, '').replace(/[_*]./g, ''));
}
function xlsxSerialToIso(n){
  const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
}
async function readXlsxWorkbook(arrayBuffer){
  try{ await loadScriptOnce(JSZIP_URL); }
  catch(e){ throw new Error('The Excel reader could not be loaded. Check your internet connection and try again.'); }
  if(typeof JSZip === 'undefined') throw new Error('The Excel reader could not be loaded. Check your internet connection and try again.');
  let zip;
  try{ zip = await JSZip.loadAsync(arrayBuffer); }
  catch(e){ throw new Error('That file is not a valid .xlsx workbook.'); }
  const read = async path => { const f = zip.file(path); return f ? f.async('string') : null; };
  const parse = s => new DOMParser().parseFromString(s, 'application/xml');
  const all = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
  const wbText = await read('xl/workbook.xml');
  if(!wbText) throw new Error('That file is not a valid .xlsx workbook.');
  const relsText = await read('xl/_rels/workbook.xml.rels');
  const rels = {};
  if(relsText) all(parse(relsText), 'Relationship').forEach(r => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const shared = [];
  const ssText = await read('xl/sharedStrings.xml');
  if(ssText) all(parse(ssText), 'si').forEach(si => {
    let s = '';
    all(si, 't').forEach(t => { if(!t.parentNode || t.parentNode.localName !== 'rPh') s += t.textContent; });
    shared.push(s);
  });
  const xfDate = [];
  const stText = await read('xl/styles.xml');
  if(stText){
    const st = parse(stText);
    const codes = {};
    all(st, 'numFmt').forEach(n => { codes[n.getAttribute('numFmtId')] = n.getAttribute('formatCode'); });
    const xfs = all(st, 'cellXfs')[0];
    if(xfs) all(xfs, 'xf').forEach(xf => { const id = parseInt(xf.getAttribute('numFmtId') || '0', 10); xfDate.push(xlsxIsDateFormat(id, codes[id])); });
  }
  const sheets = [];
  for(const s of all(parse(wbText), 'sheet')){
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || s.getAttribute('r:id');
    let target = rels[rid] || '';
    target = target.replace(/^\//, '');
    const path = target.startsWith('xl/') ? target : 'xl/' + target;
    const text = await read(path);
    if(!text) continue;
    const sx = parse(text);
    const cells = {};            // cells[row][col] = string | number | boolean | { date:'YYYY-MM-DD' }
    let maxRow = 0, maxCol = 0;
    all(sx, 'c').forEach(c => {
      const pos = xlsxParseRef(c.getAttribute('r') || '');
      if(!pos) return;
      const type = c.getAttribute('t');
      const style = parseInt(c.getAttribute('s') || '0', 10);
      const vEl = all(c, 'v')[0];
      let v = null;
      if(type === 'inlineStr') v = all(c, 't').map(t => t.textContent).join('');
      else if(vEl){
        const raw = vEl.textContent;
        if(type === 's') v = shared[parseInt(raw, 10)];
        else if(type === 'str') v = raw;
        else if(type === 'b') v = raw === '1';
        else if(type === 'e') v = null;
        else if(raw !== ''){ const n = parseFloat(raw); v = xfDate[style] ? { date: xlsxSerialToIso(n) } : n; }
      }
      if(v === null || v === undefined) return;
      (cells[pos.r] = cells[pos.r] || {})[pos.c] = v;
      if(pos.r > maxRow) maxRow = pos.r;
      if(pos.c > maxCol) maxCol = pos.c;
    });
    const merges = all(sx, 'mergeCell').map(m => {
      const [a, b] = (m.getAttribute('ref') || '').split(':');
      const p1 = xlsxParseRef(a), p2 = xlsxParseRef(b || a);
      return (p1 && p2) ? { r1:p1.r, c1:p1.c, r2:p2.r, c2:p2.c } : null;
    }).filter(Boolean);
    sheets.push({ name: s.getAttribute('name'), hidden: (s.getAttribute('state') || 'visible') !== 'visible', cells, merges, maxRow, maxCol });
  }
  return sheets;
}

// ---- cleaning helpers
function cellText(v){
  if(v == null) return '';
  if(typeof v === 'object' && v.date) return v.date;
  return String(v).replace(/\u00A0/g, ' ').replace(/\r/g, '');
}
const oneLine = v => cellText(v).replace(/\s+/g, ' ').trim();
function editDistance(a, b){
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) dp[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}
const REG_MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
function registryMonth(word){
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  if(w.length < 3) return -1;
  const prefix = REG_MONTHS.map((m, i) => m.startsWith(w) ? i : -1).filter(i => i >= 0);
  if(prefix.length === 1) return prefix[0];
  const near = REG_MONTHS.map((m, i) => ({ i, d: editDistance(w.slice(0, 3), m.slice(0, 3)) })).filter(x => x.d <= 1);   // 'Apl' → April
  return near.length === 1 ? near[0].i : -1;
}
function isoFromParts(y, m, d){
  const t = new Date(Date.UTC(y, m - 1, d));
  if(t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return '';
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
// returns 'YYYY-MM-DD' or '' when the text can't be understood
function parseRegistryDate(v){
  if(v == null || v === '') return '';
  if(typeof v === 'object' && v.date) return v.date;
  if(typeof v === 'number') return (v > 20000 && v < 80000) ? xlsxSerialToIso(v) : '';
  const s = String(v).replace(/\u00A0/g, ' ').trim();
  let m;
  if((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return isoFromParts(+m[1], +m[2], +m[3]);
  if((m = /^(\d{1,2})\s*(?:st|nd|rd|th)?\s*[-\/.,\s]*\s*([A-Za-z]{3,})\.?\s*[-\/.,\s]*\s*(\d{2}|\d{4})$/i.exec(s))){
    const mo = registryMonth(m[2]);
    if(mo < 0) return '';
    return isoFromParts(m[3].length === 2 ? 2000 + +m[3] : +m[3], mo + 1, +m[1]);
  }
  if((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/.exec(s)))                 // day first, as used locally
    return isoFromParts(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return '';
}
// whitespace and case tidy-up, then match to the department list; anything else is kept exactly as typed
function tidyDepartment(raw, known){
  const clean = oneLine(raw);
  if(!clean) return { name:'', fixed:false, known:false };
  const lower = clean.toLowerCase();
  const exact = known.find(k => k.toLowerCase() === lower);
  if(exact) return { name:exact, fixed: exact !== clean, known:true };
  const stripped = clean.replace(/\s+(department|dept\.?)$/i, '').toLowerCase();
  const viaStrip = known.find(k => k.toLowerCase() === stripped);
  if(viaStrip) return { name:viaStrip, fixed:true, known:true };
  if(clean.length >= 8){
    const near = known.filter(k => editDistance(k.toLowerCase(), lower) <= 1);               // 'Aministration' → Administration
    if(near.length === 1) return { name:near[0], fixed:true, known:true };
  }
  return { name:clean, fixed:false, known:false };
}
const ASSET_TAG = /^(?:FA\d{3,5}|FDC-HO(?:-?[A-Z])?-\d{4}-\d{1,4}|AST-\d+)$/i;
function splitDetails(raw){
  const text = cellText(raw).trim();
  if(!text) return { assetCode:'', details:'' };
  const tokens = text.split(/[\s,;]+/).filter(Boolean);
  if(tokens.length && tokens.every(t => ASSET_TAG.test(t))) return { assetCode: tokens.join(', '), details:'' };
  return { assetCode:'', details: text.split(/\s*\n\s*/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' / ') };
}
// an item cell with a blank line, or many lines, is a list of items; otherwise the line break is just text wrapping
function tidyItemName(raw){
  const text = cellText(raw);
  const lines = text.split('\n').map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const isList = /^\s*\n/.test(text) || /\n\s*\n/.test(text) || lines.length >= 4;
  return { name: lines.join(isList ? ', ' : ' '), combined: lines.length > 1 && isList };
}
const isFilled = v => v != null && String(typeof v === 'object' && v.date ? v.date : v).trim() !== '';

// ---- the registry parser
function parseHandoverRegistry(sheet, knownDepartments){
  const get = (r, c) => (sheet.cells[r] || {})[c];
  // find the header row and map the columns by their titles
  let headerRow = 0, col = null;
  for(let r = 1; r <= Math.min(sheet.maxRow, 15) && !col; r++){
    const labels = {};
    Object.keys(sheet.cells[r] || {}).forEach(c => { labels[+c] = oneLine(get(r, +c)).toLowerCase(); });
    const has = t => Object.values(labels).includes(t);
    if(has('transfer type') && has('handover by') && has('item')){
      headerRow = r; col = {};
      const cols = Object.keys(labels).map(Number).sort((a, b) => a - b);
      cols.forEach(c => {
        const t = labels[c];
        if(t === '#') col.num = c; else if(t === 'transfer type') col.type = c; else if(t === 'item') col.item = c; else if(t === 'details') col.details = c;
        else if(t === 'qty' || t === 'quantity') col.qty = c; else if(t === 'handover by') col.fromStaff = c; else if(t === 'received') col.toStaff = c;
        else if(t === 'date') col.date = c; else if(t === 'handover') col.ref = c; else if(t === 'delivery note') col.dn = c; else if(t === 'remarks') col.rem = c;
        else if(t === 'department'){ if(col.fromDept == null) col.fromDept = c; else col.toDept = c; }
      });
    }
  }
  const needed = ['item', 'details', 'qty', 'fromStaff', 'fromDept', 'toStaff', 'toDept', 'date', 'ref'];
  if(!col || needed.some(k => col[k] == null)) return null;
  const lastCol = Math.max(...Object.values(col));
  const noteCols = [];
  for(let c = lastCol + 1; c <= sheet.maxCol; c++) noteCols.push(c);

  const mergeAt = {};
  sheet.merges.forEach(m => { for(let r = m.r1; r <= m.r2; r++) for(let c = m.c1; c <= m.c2; c++) mergeAt[r + ',' + c] = m; });
  const resolved = (r, c) => { const m = mergeAt[r + ',' + c]; return m ? get(m.r1, m.c1) : get(r, c); };

  // group the rows into records: a record starts on a row that has its own # or reference
  const starts = [];
  for(let r = headerRow + 1; r <= sheet.maxRow; r++){
    if(isFilled(get(r, col.num)) || isFilled(get(r, col.ref))) starts.push(r);
  }
  const out = { records: [], emptyRows: [], notes: { dates: [], depts: [], unknownDepts: {}, check: [] } };
  starts.forEach((start, idx) => {
    const end = (idx + 1 < starts.length ? starts[idx + 1] : sheet.maxRow + 1) - 1;
    const ref = oneLine(get(start, col.ref));
    const lines = [];
    let derivedName = false;                       // the previous line took its name from the Details column
    for(let r = start; r <= end; r++){
      const own = { item: get(r, col.item), det: get(r, col.details), qty: get(r, col.qty) };
      if(!isFilled(own.item) && !isFilled(own.det) && !isFilled(own.qty)) continue;
      // a quantity merged over several rows: if it equals the number of rows each row is one unit, otherwise it is one combined line
      const qm = mergeAt[r + ',' + col.qty];
      let qty, groupRows = [r];
      if(qm && qm.r2 > qm.r1){
        if(r !== qm.r1) { qty = 1; }
        else {
          const k = qm.r2 - qm.r1 + 1, q = get(qm.r1, col.qty);
          if(typeof q === 'number' && q === k) qty = 1;
          else { qty = q; groupRows = []; for(let x = qm.r1; x <= qm.r2; x++) groupRows.push(x); }
        }
      } else if(typeof own.qty === 'number') qty = own.qty;
      else if(isFilled(own.qty)){
        const nums = (String(own.qty).match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
        qty = nums.reduce((a, b) => a + b, 0) || null;
        if(nums.length > 1) out.notes.check.push({ ref, text: `quantity "${oneLine(own.qty)}" was read as ${qty}` });
      } else qty = null;
      // the item name: the merged/own cell, else carried down from the line above (unless that one came from Details)
      let nameRaw = resolved(r, col.item);
      let item = tidyItemName(nameRaw);
      const detParts = groupRows.map(x => splitDetails(get(x, col.details)));
      let assetCode = detParts.map(p => p.assetCode).filter(Boolean).join(', ');
      let details = detParts.map(p => p.details).filter(Boolean).join(' / ');
      let itemName = item.name, fromDetails = false;
      if(!itemName){
        if(lines.length && !derivedName) itemName = lines[lines.length - 1].itemName;
        else if(details || assetCode){ itemName = details || assetCode; details = details === itemName ? '' : details; if(assetCode === itemName) assetCode = ''; fromDetails = true; }
      }
      derivedName = fromDetails;
      if(item.combined) out.notes.check.push({ ref, text: 'several items were typed into one cell, so they are imported as a single line' });
      // notes typed beyond the Remarks column belong to this row
      noteCols.forEach(c => {
        const note = oneLine(get(r, c));
        if(note && !(details + ' ' + assetCode).toLowerCase().includes(note.toLowerCase())) details = [details, note].filter(Boolean).join(' / ');
      });
      if(qty == null || !(qty > 0)){
        qty = 1;
        out.notes.check.push({ ref, text: `no quantity for "${itemName}", so 1 was assumed` });
      }
      lines.push({ itemName, productId:'', quantity: qty, itemDetails: details, assetCode, assetId: null });
    }
    if(!lines.length){ out.emptyRows.push(ref); return; }
    const dRaw = get(start, col.date);
    let handoverDate = parseRegistryDate(dRaw);
    if(typeof dRaw === 'string' && handoverDate) out.notes.dates.push({ ref, from: oneLine(dRaw), to: handoverDate });
    if(!handoverDate) out.notes.check.push({ ref, text: dRaw == null || dRaw === '' ? 'no date' : `the date "${oneLine(dRaw)}" could not be read` });
    const fromD = tidyDepartment(get(start, col.fromDept), knownDepartments);
    const toD = tidyDepartment(get(start, col.toDept), knownDepartments);
    [[get(start, col.fromDept), fromD], [get(start, col.toDept), toD]].forEach(([raw, d]) => {
      if(d.fixed && oneLine(raw) !== d.name) out.notes.depts.push({ from: oneLine(raw), to: d.name });
      if(d.name && !d.known) out.notes.unknownDepts[d.name] = (out.notes.unknownDepts[d.name] || 0) + 1;
    });
    let remarks = col.rem != null ? cellText(get(start, col.rem)).split(/\s*\n\s*/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' / ') : '';
    const dn = col.dn != null ? oneLine(get(start, col.dn)) : '';
    if(dn) remarks = [remarks, 'Delivery note: ' + dn].filter(Boolean).join(' · ');
    out.records.push({
      referenceNumber: ref, handoverType: col.type != null ? oneLine(get(start, col.type)) : '', handoverDate,
      fromDepartment: fromD.name, fromStaffName: oneLine(get(start, col.fromStaff)), fromDesignation: '',
      toDepartment: toD.name, toStaffName: oneLine(get(start, col.toStaff)), toDesignation: '',
      fileUrl: '', remarks, lineItems: lines,
    });
  });
  return out;
}

// ---- import: dialog, preview, and bulk save
function hoImportPickerHtml(err){
  return `
    <div>
      ${err ? `<div class="bg-rose-50 text-rose-700 text-sm rounded-lg px-3.5 py-2.5 mb-4">${esc(err)}</div>` : ''}
      <p class="text-sm text-slate-600 mb-3">Choose your handover registry workbook (.xlsx). The app reads the sheet with the columns <span class="font-semibold">Transfer Type, Item, Details, Qty, Handover by, Received, Date</span> and <span class="font-semibold">Handover</span>, then shows you what it found before anything is saved.</p>
      <ul class="text-[13px] text-slate-500 list-disc pl-5 mb-5 space-y-1">
        <li>Handovers whose reference number is already in the app are skipped, so importing the same file again is safe.</li>
        <li>Numbered rows with no items in them are skipped.</li>
        <li>The first time, it needs an internet connection to load a small file reader.</li>
      </ul>
      <label class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 cursor-pointer">Choose Excel file
        <input type="file" id="ho-import-file" accept=".xlsx" class="hidden" onchange="hoImportFileChosen(this)">
      </label>
      <div id="hoimp-status" class="text-sm text-slate-500 mt-3"></div>
    </div>`;
}
function openHandoverImport(){
  ui.hoImport = null;
  openModal('Import handovers from Excel', hoImportPickerHtml(), true);
}
async function hoImportFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const status = document.getElementById('hoimp-status');
  if(status) status.textContent = 'Reading ' + file.name + '…';
  try{
    const sheets = await readXlsxWorkbook(await file.arrayBuffer());
    const known = DEPARTMENTS.map(d => d.name);
    let parsed = null, sheetName = '';
    for(const sh of sheets){
      if(sh.hidden) continue;
      const p = parseHandoverRegistry(sh, known);
      if(p){ parsed = p; sheetName = sh.name; break; }
    }
    if(!parsed) throw new Error('Could not find a handover registry in that file. It needs a sheet with the columns Transfer Type, Item, Details, Qty, Handover by, Department, Received, Date and Handover.');
    hoImportStage(parsed, file.name, sheetName);
  }catch(e){
    console.error(e);
    openModal('Import handovers from Excel', hoImportPickerHtml(e && e.message ? e.message : String(e)), true);
  }
}
function hoImportStage(parsed, fileName, sheetName){
  const existing = new Set(state.handovers.map(h => (h.referenceNumber || '').trim().toLowerCase()).filter(Boolean));
  const seen = new Set();
  const fresh = [], already = [], repeated = [];
  parsed.records.forEach(r => {
    const key = r.referenceNumber.toLowerCase();
    if(existing.has(key)) already.push(r);
    else if(seen.has(key)) repeated.push(r);
    else { seen.add(key); fresh.push(r); }
  });
  const order = [];
  for(let i = 1; i < parsed.records.length; i++){
    const a = parsed.records[i-1], b = parsed.records[i];
    if(a.handoverDate && b.handoverDate && (Date.parse(a.handoverDate) - Date.parse(b.handoverDate)) / 86400000 > 7)
      order.push({ ref: b.referenceNumber, date: b.handoverDate, prevRef: a.referenceNumber, prevDate: a.handoverDate });
  }
  ui.hoImport = { fileName, sheetName, parsed, fresh, already, repeated, order };
  openModal('Import handovers from Excel', hoImportPreviewHtml(), true);
}
function hoImportPreviewHtml(){
  const st = ui.hoImport, notes = st.parsed.notes;
  const lineCount = st.fresh.reduce((s, r) => s + r.lineItems.length, 0);
  const stat = (big, label, tone) => `<div class="rounded-lg border border-slate-200 px-4 py-3"><div class="text-xl font-extrabold ${tone || 'text-slate-900'} num">${big}</div><div class="text-xs text-slate-500 mt-0.5">${label}</div></div>`;
  const section = (title, count, rows, open) => count ? `
    <details class="mb-3 border border-slate-200 rounded-lg" ${open ? 'open' : ''}>
      <summary class="cursor-pointer px-4 py-2.5 text-sm font-semibold text-slate-700">${title} <span class="font-normal text-slate-400">(${count})</span></summary>
      <div class="px-4 pb-3 text-[13px] text-slate-600 space-y-1 max-h-48 overflow-y-auto">${rows}</div>
    </details>` : '';
  const checkRows = notes.check.filter(n => st.fresh.some(r => r.referenceNumber === n.ref)).map(n => `<div><span class="font-semibold num">${esc(n.ref)}</span> — ${esc(n.text)}</div>`)
    .concat(st.order.filter(o => st.fresh.some(r => r.referenceNumber === o.ref)).map(o => `<div><span class="font-semibold num">${esc(o.ref)}</span> — dated ${esc(fmtDate(o.date))}, but the one before it (<span class="num">${esc(o.prevRef)}</span>) is dated ${esc(fmtDate(o.prevDate))}. Worth a look.</div>`));
  const dateRows = notes.dates.filter(d => st.fresh.some(r => r.referenceNumber === d.ref)).map(d => `<div><span class="num">${esc(d.ref)}</span> — “${esc(d.from)}” → ${esc(fmtDate(d.to))}</div>`);
  const tidy = {};
  notes.depts.forEach(d => { const k = d.from + ' → ' + d.to; tidy[k] = (tidy[k] || 0) + 1; });
  const tidyRows = Object.keys(tidy).map(k => `<div>${esc(k)} <span class="text-slate-400">× ${tidy[k]}</span></div>`);
  const unknownRows = Object.keys(notes.unknownDepts).sort((a, b) => notes.unknownDepts[b] - notes.unknownDepts[a]).map(k => `<div>${esc(k)} <span class="text-slate-400">× ${notes.unknownDepts[k]}</span></div>`);
  const listRows = st.fresh.map(r => `<div class="flex gap-3"><span class="font-semibold num shrink-0">${esc(r.referenceNumber)}</span><span class="text-slate-400 shrink-0">${esc(r.handoverDate ? fmtDate(r.handoverDate) : '—')}</span><span class="truncate">${esc(r.toStaffName || r.toDepartment || '—')} · ${r.lineItems.length} item${r.lineItems.length === 1 ? '' : 's'}</span></div>`);
  return `
    <div>
      <div class="text-xs text-slate-400 mb-3">${esc(st.fileName)} · sheet “${esc(st.sheetName)}”</div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">

      ${section('Departments kept as typed (not in your department list)', unknownRows.length, unknownRows.join(''))}

      ${section('Skipped: numbered rows with no items', st.parsed.emptyRows.length, st.parsed.emptyRows.map(r => `<div class="num">${esc(r)}</div>`).join(''))}
      ${section('All handovers to import', st.fresh.length, listRows.join(''))}

        <div class="flex gap-2.5">
          <button class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-50" onclick="ui.hoImport=null; closeModal()">Cancel</button>
          <button id="hoimp-go" ${st.fresh.length ? '' : 'disabled'} class="px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-50" onclick="runHandoverImport()">Import ${st.fresh.length} handover${st.fresh.length === 1 ? '' : 's'}</button>
        </div>
      </div>
    </div>`;
}
async function persistHandoversBulk(list){
  if(!firestoreDb || !firestoreHandoversRef) return true;
  try{
    for(let i = 0; i < list.length; i += 400){
      const chunk = list.slice(i, i + 400);
      const batch = firestoreDb.batch();
      chunk.forEach(h => batch.set(firestoreHandoversRef.doc(h.id), h));
      await batch.commit();
      chunk.forEach(h => markSynced('handovers', h.id));
    }
    return true;
  }catch(e){
    toast(syncErrorMessage(e, 'fdc_inventory_handovers', 'save'), true);
    scheduleUnsyncedCheck();
    return false;
  }
}
async function runHandoverImport(){
  const st = ui.hoImport;
  if(!st || !st.fresh.length) return;
  const btn = document.getElementById('hoimp-go');
  if(btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
  const base = Date.now();
  const list = st.fresh.map((r, i) => Object.assign(
    { id: uid(), createdByName: authUser ? authUser.name : null, createdByEmail: authUser ? authUser.email : null, createdAt: new Date(base - (st.fresh.length - 1 - i) * 1000).toISOString() },   // registry order, all in the past
    JSON.parse(JSON.stringify(r))));
  state.handovers.push(...list);
  await setJSON('handovers', state.handovers);
  ui.hoImport = null;
  const ok = await persistHandoversBulk(list);
  closeModal();
  ui.hoQuery = ''; ui.hoShown = HO_PAGE;
  rerenderMain();
  if(ok) toast(`Imported ${list.length} handover${list.length === 1 ? '' : 's'}.`);
}

function deleteAssetTransfer(id){
  if(!canManageInventory()){ toast('Only admins can delete asset movements.', true); return; }
  confirmAction('Delete this movement record? This only removes the log entry — the asset keeps its current location and assignee.', ()=>{
    state.assetTransfers = state.assetTransfers.filter(t=>t.id!==id);
    deleteAssetTransferDoc(id);
    toast('Movement deleted.');
    rerenderMain();
  });
}
function exportAssetTransfersCSV(){
  const f = ui.assetTransactionsFilter;
  const header = ['Date','Asset','Tag','From','To','Department','Assignee','Reason','Handled by'];
  const rows = getFilteredAssetTransactions().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
    const a = getAsset(t.assetId);
    const fromLoc = getLocation(t.fromLocationId);
    const toLoc = getLocation(t.toLocationId);
    return [t.date, a?a.name:'', a?a.tag||'':'', fromLoc?fromLoc.name:'', toLoc?toLoc.name:'', t.toDepartment||'', t.toAssignedTo||'', t.reason||'', t.handledByName||''];
  });
  if(rows.length===0){ toast('No movements match the current filters — nothing to export.', true); return; }
  const rangePart = (f.dateFrom || f.dateTo) ? `_${f.dateFrom||'start'}_to_${f.dateTo||'now'}` : '_' + todayStr();
  downloadCSV('asset_movements' + rangePart + '.csv', header, rows);
}

function handleImageSelect(event, prefix){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please select an image file.', true); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const dataInput = document.getElementById(prefix+'-image-data');
      const preview = document.getElementById(prefix+'-image-preview');
      const removeBtn = document.getElementById(prefix+'-image-remove-btn');
      if(dataInput) dataInput.value = dataUrl;
      if(preview){ preview.src = dataUrl; preview.classList.remove('hidden'); }
      if(removeBtn) removeBtn.classList.remove('hidden');
    };
    img.onerror = function(){ toast('Could not read that image — try a different file.', true); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast('Could not read that image — try a different file.', true); };
  reader.readAsDataURL(file);
}
function removeImage(prefix){
  const dataInput = document.getElementById(prefix+'-image-data');
  const preview = document.getElementById(prefix+'-image-preview');
  const removeBtn = document.getElementById(prefix+'-image-remove-btn');
  const fileInput = document.getElementById(prefix+'-image-input');
  if(dataInput) dataInput.value = '';
  if(preview){ preview.src = ''; preview.classList.add('hidden'); }
  if(removeBtn) removeBtn.classList.add('hidden');
  if(fileInput) fileInput.value = '';
}
function nextDepartmentAssetCode(){
  let max = 0;
  state.assets.forEach(a=>{
    const match = (a.departmentAssetCode||'').match(/^AD-(\d+)$/);
    if(match){ const n = parseInt(match[1], 10); if(n > max) max = n; }
  });
  return 'AD-' + String(max+1).padStart(4, '0');
}

function saveAsset(id){
  if(id && !canManageInventory()){ toast('Only admins can edit assets.', true); return; }
  const errEl = document.getElementById('af-error');
  errEl.classList.add('hidden');
  const name = document.getElementById('af-name').value.trim();
  const locationId = document.getElementById('af-location').value;
  if(!name){ errEl.textContent='Asset name is required.'; errEl.classList.remove('hidden'); return; }
  if(!locationId){ errEl.textContent='Choose a location.'; errEl.classList.remove('hidden'); return; }
  const data = {
    name,
    tag: document.getElementById('af-tag').value.trim(),
    serialNumber: document.getElementById('af-serial').value.trim(),
    departmentAssetCode: document.getElementById('af-dept-code').value.trim(),
    category: document.getElementById('af-category').value.trim(),
    locationId,
    department: document.getElementById('af-department').value.trim(),
    assignedTo: document.getElementById('af-assignedto').value.trim(),
    status: document.getElementById('af-status').value,
    notes: document.getElementById('af-notes').value.trim(),
    image: document.getElementById('af-image-data').value || '',
  };
  let saved;
  if(id){
    saved = getAsset(id);
    Object.assign(saved, data);
  } else {
    saved = { id: uid(), ...data, createdAt: nowISO() };
    state.assets.push(saved);
  }
  persistAssetDoc(saved);
  closeModal();
  toast(id ? 'Asset updated.' : 'Asset added.');
  rerenderMain();
}
function deleteAsset(id){
  if(!canManageInventory()){ toast('Only admins can delete assets.', true); return; }
  confirmAction('Delete this asset and its transfer history? This cannot be undone.', async ()=>{
    const transfersToDelete = state.assetTransfers.filter(t=>t.assetId===id);
    state.assets = state.assets.filter(a=>a.id!==id);
    state.assetTransfers = state.assetTransfers.filter(t=>t.assetId!==id);
    await deleteAssetDoc(id);
    for(const t of transfersToDelete){ await deleteAssetTransferDoc(t.id); }
    toast('Asset deleted.');
    rerenderMain();
  });
}

      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Date *</label>
        <input type="date" id="tf-date" value="${todayStr()}" max="${todayStr()}" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
      </div>
    </div>
    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-600 mb-1.5">Reason / notes</label>
      <input type="text" id="tf-reason" placeholder="e.g. Reassigned to new department" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
    </div>
    <div class="flex justify-end gap-2.5">
      <button class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300 text-slate-700 hover:bg-slate-50" onclick="closeModal()">Cancel</button>
      <button class="px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700" onclick="saveTransfer('${assetId}')">Log transfer</button>
    </div>
  `;
  openModal('Transfer / Handover', body);
}
function saveTransfer(assetId){
  const errEl = document.getElementById('tf-error');
  errEl.classList.add('hidden');
  const asset = getAsset(assetId);
  if(!asset){ errEl.textContent='Asset not found.'; errEl.classList.remove('hidden'); return; }
  const toLocationId = document.getElementById('tf-location').value;
  const toDepartment = document.getElementById('tf-department').value.trim();
  const toAssignedTo = document.getElementById('tf-assignedto').value.trim();
  const date = document.getElementById('tf-date').value;
  const reason = document.getElementById('tf-reason').value.trim();
  const toLoc = getLocation(toLocationId);
  if(!toLoc){ errEl.textContent='Choose a destination location.'; errEl.classList.remove('hidden'); return; }
  if(!date){ errEl.textContent='Choose a date.'; errEl.classList.remove('hidden'); return; }

  const transfer = {
    id: uid(),
    assetId,
    fromLocationId: asset.locationId, toLocationId,
    fromDepartment: asset.department||'', toDepartment,
    fromAssignedTo: asset.assignedTo||'', toAssignedTo,
    date, reason, createdAt: nowISO(),
    handledByName: authUser ? authUser.name : null,
    handledByEmail: authUser ? authUser.email : null,
  };
  asset.locationId = toLocationId;
  asset.department = toDepartment;
  asset.assignedTo = toAssignedTo;
  state.assetTransfers.push(transfer);
  persistAssetDoc(asset);
  persistAssetTransferDoc(transfer);
  closeModal();
  toast('Transfer logged.');
  rerenderMain();
}

/* =====================================================================
   CSV EXPORT
===================================================================== */
function csvCell(v){
  const s = String(v==null?'':v);
  const nl = String.fromCharCode(10);
  const needsQuote = s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf(nl)>=0;
  return needsQuote ? '"'+s.split('"').join('""')+'"' : s;
}
function downloadCSV(filename, header, rows){
  const lines = [header.join(',')];
  rows.forEach(r=> lines.push(r.map(csvCell).join(',')));
  const blob = new Blob([lines.join(String.fromCharCode(10))], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportProductsCSV(){
  const header = ['SKU','Name','Variant','Description','Category', ...LOCATIONS.map(l=>l.name+' qty'), 'Total qty','Reorder level (total)', ...LOCATIONS.map(l=>l.name+' reorder level'), 'Status'];
  const rows = [...state.products].sort(byDisplayName).map(p=>[
    p.sku||'', p.name, p.variant||'', p.description||'', p.category||'', ...LOCATIONS.map(l=>qtyAt(p,l.id)), productTotalQty(p),
    p.reorderLevel, ...LOCATIONS.map(l=>{ const rl = reorderLevelAt(p,l.id); return rl!=null?rl:''; }), isLowStock(p)?'Low stock':'In stock'
  ]);
  downloadCSV('items_' + todayStr() + '.csv', header, rows);
}
function exportMovementsCSV(){
  const f = ui.movementsFilter;
  const header = ['Date','Type','Item','SKU','Location','Quantity','Acquisition','Reason / reference','Department','Staff name','Logged by'];
  const rows = getFilteredMovements().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>{
    const p = getProduct(m.productId);
    const loc = getLocation(m.locationId);
    return [m.date, m.type==='in'?'Stock In':'Stock Out', p?displayName(p):'', p?p.sku||'':'', loc?loc.name:'', m.quantity, m.acquisition||'', m.reason||'', m.department||'', m.staffName||'', m.loggedByName||''];
  });
  if(rows.length===0){ toast('No movements match the current filters — nothing to export.', true); return; }
  const rangePart = (f.dateFrom || f.dateTo) ? `_${f.dateFrom||'start'}_to_${f.dateTo||'now'}` : '_' + todayStr();
  downloadCSV('stock_movements' + rangePart + '.csv', header, rows);
}
function exportAssetsCSV(){
  const header = ['Tag','Serial Number','Name','Category','Location','Department','Assigned to','Status','Notes'];
  const rows = [...state.assets].sort(byName).map(a=>{
    const loc = getLocation(a.locationId);
    return [a.tag||'', a.serialNumber||'', a.name, a.category||'', loc?loc.name:'', a.department||'', a.assignedTo||'', a.status==='retired'?'Retired':'Active', a.notes||''];
  });
  if(rows.length===0){ toast('No assets to export.', true); return; }
  downloadCSV('assets_' + todayStr() + '.csv', header, rows);
}
